      { id: 'w6',
        q: 'Как работает HTTP-кеширование?',
        a: `<h4>Коротко</h4>
        <p>Два независимых механизма. <strong>Срок свежести</strong> определяет, можно ли отдать ответ из кеша без похода на сервер. <strong>Ревалидация</strong> определяет, как дёшево проверить, не изменился ли ресурс. Продакшен-паттерн строится на этом: статика с хешем в имени — навсегда, HTML — всегда с проверкой.</p>

        <h4>Как это работает</h4>
        <ul>
          <li><code>Cache-Control: max-age=N</code> — сколько секунд ответ считается свежим. <code>immutable</code> добавляет: не ревалидируй даже при обновлении страницы.</li>
          <li><code>no-cache</code> — <strong>хранить можно, но перед каждой отдачей ревалидировать</strong>. Частая путаница: это не запрет кеширования.</li>
          <li><code>no-store</code> — не хранить вовсе. Для персональных и чувствительных ответов.</li>
          <li><code>private</code> — можно кешировать только в браузере, но не на CDN; <code>public</code> — можно везде.</li>
          <li><code>stale-while-revalidate=N</code> — можно отдать протухшее и обновить в фоне; пользователь не ждёт. <code>stale-if-error</code> — отдать протухшее, если сервер лёг.</li>
          <li><strong>Ревалидация</strong>: сервер прислал <code>ETag</code> → браузер шлёт <code>If-None-Match</code>; или <code>Last-Modified</code> → <code>If-Modified-Since</code>. Совпало — ответ <strong>304</strong> без тела, экономится трафик, но не round-trip.</li>
        </ul>
        <p>Боевая конфигурация: файлы с хешем в имени (<code>app.9f2c1.js</code>) — <code>max-age=31536000, immutable</code>; HTML — <code>no-cache</code>. Новый релиз меняет имена файлов, поэтому инвалидация происходит сама собой, а свежий HTML указывает на новые имена.</p>

        <h4>Почему так</h4>
        <p>Самый дешёвый запрос — тот, которого не было. <code>immutable</code> убирает даже 304-проверки, а хеш в имени делает содержимое неизменяемым по определению, что и позволяет так рисковать. Плата — обязанность корректно инвалидировать HTML, иначе пользователь застрянет на старой версии.</p>

        <h4>Подводные камни</h4>
        <ul>
          <li><strong>Кеширование HTML с большим max-age</strong> — застрявший релиз, который нечем починить, пока не истечёт срок.</li>
          <li>Кеш браузера не сбросишь удалённо. Единственный рычаг — новые URL, поэтому хеш в имени не украшение.</li>
          <li>CDN и браузер — разные слои: <code>s-maxage</code> относится только к CDN, <code>Vary</code> определяет ключ кеша и легко раздувает его (<code>Vary: User-Agent</code> убивает попадания).</li>
          <li>Слабый ETag <code>W/"..."</code> допускает семантическое совпадение; на кластере из нескольких серверов ETag-и могут не совпасть, и 304 не сработает.</li>
          <li>Service Worker имеет собственный кеш и переопределяет всё это: своя стратегия и своя инвалидация.</li>
          <li>Персональные данные с <code>public</code> могут осесть на CDN и утечь другому пользователю.</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>«Чем no-cache отличается от no-store?» — первый разрешает хранить с обязательной проверкой, второй запрещает хранить. «Как выкатить хотфикс, если статика immutable?» — сменить имя файла; HTML не кеширован, поэтому новые имена приедут сразу. «Что даёт stale-while-revalidate?» — мгновенный ответ из кеша и фоновое обновление, идеальный компромисс для API-ответов и HTML на CDN.</p>`,
        code: `# статика с хешем в имени — можно навсегда
Cache-Control: public, max-age=31536000, immutable

# HTML — хранить можно, но каждый раз проверять
Cache-Control: no-cache

# ответ API: свежесть минута, дальше отдаём протухшее и обновляем в фоне
Cache-Control: public, max-age=60, stale-while-revalidate=600

# персональные данные
Cache-Control: private, no-store

# ревалидация
Запрос:  If-None-Match: "9f2c1"
Ответ:   304 Not Modified          # тела нет, round-trip остался

# CDN и браузер по-разному
Cache-Control: max-age=60, s-maxage=86400`,
        tip: 'Проговори разницу no-cache и no-store — на ней путаются чаще всего. И сразу дай боевую пару «хеш в имени плюс immutable для статики, no-cache для HTML»: это ответ человека, который настраивал, а не читал.' },

      { id: 'w7',
        q: 'Что такое XSS и как от него защищаться?',
        a: `<h4>Коротко</h4>
        <p>XSS — внедрение и исполнение чужого JavaScript в контексте твоей страницы. Атакующий получает всё, что доступно коду: токены, cookie без <code>HttpOnly</code>, возможность делать запросы от имени пользователя, читать и подменять содержимое. Защита строится <strong>слоями</strong>, потому что ни один слой не абсолютен.</p>

        <h4>Как это работает</h4>
        <ul>
          <li><strong>Stored</strong> — скрипт сохранён на сервере (комментарий, имя профиля, поле в CRM) и отдаётся всем посетителям. Самый опасный вид.</li>
          <li><strong>Reflected</strong> — приходит в параметре запроса и отражается в ответе. Требует, чтобы жертва перешла по ссылке.</li>
          <li><strong>DOM-based</strong> — сервер ни при чём: небезопасный код на клиенте берёт данные из <code>location.hash</code>, <code>postMessage</code> или <code>localStorage</code> и кладёт их в <code>innerHTML</code>.</li>
        </ul>
        <p>Слои защиты, от важного к дополнительному:</p>
        <ol>
          <li><strong>Экранирование при выводе</strong>, зависящее от контекста. React делает это по умолчанию для текстовых узлов — опасны только явные обходы.</li>
          <li><strong>Санитизация</strong> через DOMPurify, если пользовательский HTML всё-таки нужно показать. Своими регулярками это не делается.</li>
          <li><strong>CSP</strong>: <code>script-src 'nonce-...' 'strict-dynamic'</code> без <code>unsafe-inline</code> и без <code>unsafe-eval</code>. Даже при найденной дыре внедрённый скрипт не выполнится.</li>
          <li><strong>Cookie с <code>HttpOnly</code></strong>: сессия остаётся недоступной JS, поэтому XSS не превращается в кражу токена.</li>
          <li>Trusted Types в Chromium превращают присваивание в <code>innerHTML</code> в ошибку, если строка не прошла политику.</li>
        </ol>

        <h4>Почему так</h4>
        <p>Браузер не различает «свой» и «чужой» скрипт — оба выполняются в одном origin с одинаковыми правами. Поэтому единственный способ — не дать чужому тексту стать кодом. Плата за CSP — надо избавиться от инлайн-скриптов и обработчиков в атрибутах, что для легаси болезненно.</p>

        <h4>Подводные камни</h4>
        <ul>
          <li><strong>Экранирование зависит от контекста</strong>: безопасное для текста небезопасно в атрибуте, в URL и внутри <code>&lt;script&gt;</code>.</li>
          <li><code>href={userInput}</code> в React <strong>не экранируется</strong> от <code>javascript:</code> — проверяй протокол вручную.</li>
          <li><code>dangerouslySetInnerHTML</code> без санитизации, <code>innerHTML</code>, <code>document.write</code>, <code>eval</code>, <code>new Function</code>, <code>setTimeout</code> со строкой — все точки входа.</li>
          <li>Санитизация <strong>на входе</strong> вместо выхода: данные могут использоваться в разных контекстах и уже сохранены в изменённом виде.</li>
          <li>CSP с <code>unsafe-inline</code> в <code>script-src</code> практически бесполезен.</li>
          <li>SVG, загруженный пользователем и отданный с того же origin, может содержать скрипт.</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>«React полностью защищает?» — нет: <code>dangerouslySetInnerHTML</code>, <code>href</code> с <code>javascript:</code>, ссылки в <code>&lt;a&gt;</code> из данных, а также рендер на сервере строк без экранирования. «Где хранить токен?» — в <code>HttpOnly</code> cookie; <code>localStorage</code> при XSS утекает мгновенно. «Как внедрять CSP на живом проекте?» — сначала <code>Content-Security-Policy-Report-Only</code> с отчётами, потом боевой режим.</p>`,
        code: `// опасно: пользовательская строка становится разметкой
el.innerHTML = comment;
<div dangerouslySetInnerHTML={{ __html: comment }} />

// безопасно: санитизация специализированной библиотекой
import DOMPurify from 'dompurify';
<div dangerouslySetInnerHTML={{ __html: DOMPurify.sanitize(comment) }} />

// React не спасает от javascript: в href
const safeHref = (url) => {
  try {
    const u = new URL(url, location.origin);
    return ['http:', 'https:', 'mailto:'].includes(u.protocol) ? u.href : '#';
  } catch { return '#'; }
};

# CSP: даже внедрённый скрипт не выполнится
Content-Security-Policy:
  script-src 'nonce-r4nd0m' 'strict-dynamic'; object-src 'none'; base-uri 'none'

# cookie, которую XSS не прочитает
Set-Cookie: session=...; HttpOnly; Secure; SameSite=Lax; Path=/`,
        tip: 'Отвечай слоями и назови, что даёт каждый слой в отдельности: экранирование предотвращает, CSP ограничивает ущерб, HttpOnly не даёт украсть сессию. И честно скажи, что React защищает не полностью — назови три обхода.' },

      { id: 'w8',
        q: 'Чем CSRF отличается от XSS?',
        a: `<h4>Коротко</h4>
        <p>Разные атаки с разной моделью угрозы. <strong>XSS</strong> — выполнение чужого кода <strong>на твоём домене</strong>: атакующий получает всё, что доступно странице, и может читать ответы. <strong>CSRF</strong> — запрос с чужого сайта от имени залогиненного пользователя: код нигде не исполняется, но браузер сам прикладывает cookie, и сервер считает запрос легитимным. Атакующий при CSRF <strong>не видит ответ</strong> — он только вызывает побочный эффект.</p>

        <h4>Как это работает</h4>
        <p>CSRF: пользователь залогинен на <code>bank.com</code>. Он открывает <code>evil.com</code>, где лежит форма, автоматически отправляющая POST на <code>bank.com/transfer</code>. Браузер прикладывает cookie сессии — это его штатное поведение для запросов на нужный домен. Same-Origin Policy не даёт прочитать ответ, но перевод уже произошёл.</p>
        <p>Защита, по слоям:</p>
        <ol>
          <li><strong><code>SameSite</code> у cookie</strong> — сегодня основной механизм. <code>Lax</code> (по умолчанию в современных браузерах) не отправляет cookie на кросс-сайтовые POST, но отправляет при обычном переходе по ссылке. <code>Strict</code> строже, но ломает вход по внешней ссылке. <code>None</code> требует <code>Secure</code> и снова открывает CSRF.</li>
          <li><strong>CSRF-токен</strong>: непредсказуемое значение в форме, сверяемое на сервере. Паттерн double submit — токен и в cookie, и в теле или заголовке.</li>
          <li><strong>Проверка <code>Origin</code></strong> (или <code>Sec-Fetch-Site</code>) на сервере для всех небезопасных методов.</li>
          <li>Не использовать GET для изменяющих операций: их проще всего вызвать картинкой.</li>
        </ol>

        <h4>Почему так</h4>
        <p>Cookie задумывались как «состояние, автоматически привязанное к домену» — именно эта автоматика и есть уязвимость. Заголовок <code>Authorization</code>, проставляемый кодом, CSRF-уязвим не бывает: чужой сайт не может его добавить. Отсюда практический вывод: схема с токеном в памяти и заголовком снимает CSRF, но требует решать вопрос хранения.</p>

        <h4>Подводные камни</h4>
        <ul>
          <li><strong>При наличии XSS защита от CSRF бесполезна</strong>: код исполняется на твоём домене, читает токен и шлёт запрос честно. Порядок приоритетов: сначала XSS.</li>
          <li><code>SameSite=Lax</code> по умолчанию — не гарантия: у старых браузеров и при явном <code>None</code> её нет.</li>
          <li>CORS не защищает от CSRF: простой POST с <code>Content-Type: text/plain</code> или form-encoded уходит без preflight, и запрет чтения ответа атакующему не мешает.</li>
          <li>CSRF-токен в <code>localStorage</code> бессмыслен: страница-атакующая его не прочитает, но и XSS его тут же достанет.</li>
          <li>Отдельная угроза — clickjacking; закрывается <code>X-Frame-Options: DENY</code> или <code>frame-ancestors 'none'</code> в CSP.</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>«Нужен ли CSRF-токен, если стоит SameSite=Lax?» — для чувствительных операций да: это второй слой, а <code>Lax</code> зависит от браузера и от того, как сделан переход. «А если авторизация по Bearer-заголовку?» — CSRF неактуален, но появляется вопрос хранения токена. «Чем опасен <code>SameSite=None</code>?» — он возвращает исходную уязвимость и обязателен только для настоящих кросс-сайтовых сценариев.</p>`,
        code: `# основной слой: cookie не уедет на кросс-сайтовый POST
Set-Cookie: session=...; HttpOnly; Secure; SameSite=Lax; Path=/

# второй слой: проверка происхождения на сервере
if (req.method !== 'GET' && req.headers.origin !== 'https://bank.com') {
  return res.status(403).end();
}

// double submit: токен в cookie и в заголовке
fetch('/api/transfer', {
  method: 'POST',
  headers: { 'X-CSRF-Token': readCookie('csrf') },
  credentials: 'include',
});

<!-- так выглядит атака: форма отправится сама, cookie приложится -->
<form action="https://bank.com/transfer" method="POST">
  <input name="to" value="attacker"><input name="sum" value="10000">
</form>`,
        tip: 'Разведи атаки одной фразой: «XSS — чужой код на моём домене, CSRF — чужой сайт заставляет браузер сделать запрос моими куками». И обязательно скажи, что XSS обнуляет любую защиту от CSRF: это показывает понимание приоритетов, а не списка мер.' },

      { id: 'w9',
        q: 'Что такое CORS и почему это не защита сервера?',
        a: `<h4>Коротко</h4>
        <p>CORS ничего не защищает — он <strong>ослабляет</strong> Same-Origin Policy браузера, разрешая странице <strong>читать</strong> ответ с другого origin. Простой запрос при этом уже дошёл до сервера и был выполнен: браузер лишь не отдал ответ коду страницы. Отсюда главный вывод: ошибка CORS чинится на сервере, а не во фронтенде.</p>

        <h4>Как это работает</h4>
        <ol>
          <li>Origin — это тройка «схема + хост + порт». Отличается хоть одно — запрос кросс-оригинный, включая <code>http</code> против <code>https</code> и разные порты.</li>
          <li><strong>Простой запрос</strong> (GET, HEAD или POST с <code>Content-Type</code> из списка form-urlencoded, multipart, text/plain и без кастомных заголовков) уходит сразу. Сервер обязан ответить <code>Access-Control-Allow-Origin</code>, иначе браузер выбросит ответ.</li>
          <li><strong>Непростой запрос</strong> (PUT, DELETE, <code>Content-Type: application/json</code>, кастомный заголовок вроде <code>Authorization</code> или <code>X-Request-Id</code>) сначала вызывает <strong>preflight</strong> <code>OPTIONS</code>. Сервер отвечает <code>Allow-Methods</code>, <code>Allow-Headers</code> и <code>Max-Age</code>; только после этого уходит настоящий запрос.</li>
          <li>С cookie: нужны <code>credentials: 'include'</code> на клиенте и <code>Access-Control-Allow-Credentials: true</code> плюс <strong>конкретный</strong> origin в <code>Allow-Origin</code> — звёздочка в этом режиме запрещена.</li>
          <li>Читать нестандартные заголовки ответа можно только если сервер перечислил их в <code>Access-Control-Expose-Headers</code>.</li>
        </ol>

        <h4>Почему так</h4>
        <p>Same-Origin Policy защищает <strong>пользователя</strong>, а не сервер: без неё любой сайт читал бы твою почту, пока ты залогинен. CORS — механизм, которым сервер явно говорит «этому origin можно». Плата — сложность и preflight-запросы, добавляющие round-trip.</p>

        <h4>Подводные камни</h4>
        <ul>
          <li><strong>«Починю CORS на фронте»</strong> — нельзя. Прокси в dev-сервере и расширения браузера не решение для прода.</li>
          <li>CORS <strong>не защищает от CSRF</strong>: простой POST уходит и выполняется, а невозможность прочитать ответ атакующему не мешает.</li>
          <li>Preflight на каждый запрос — лишний round-trip. Лечится <code>Access-Control-Max-Age</code>.</li>
          <li><code>Allow-Origin: *</code> вместе с <code>Allow-Credentials: true</code> не работает — браузер отвергнет ответ.</li>
          <li>Отражение <code>Origin</code> обратно без проверки по белому списку равносильно открытому API для всех.</li>
          <li>Ошибка при редиректе в кросс-оригинном запросе даёт непрозрачное сообщение — редиректы в preflight запрещены.</li>
          <li>Сообщение «CORS error» в консоли иногда скрывает обычный сетевой сбой или 500 без заголовков.</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>«Почему запрос дошёл, а ответ не прочитался?» — потому что политика браузерная и применяется к чтению ответа, а не к отправке. «Как убрать preflight?» — отправлять как простой запрос (редко возможно) или кешировать через <code>Max-Age</code>. «Что такое <code>mode: 'no-cors'</code>?» — запрос уйдёт, но ответ будет opaque и нечитаем; годится только для fire-and-forget.</p>`,
        code: `# ответ сервера для конкретного origin с cookie
Access-Control-Allow-Origin: https://app.example.com   # не *
Access-Control-Allow-Credentials: true
Access-Control-Allow-Methods: GET, POST, PUT, DELETE

      { id: 'w10',
        q: 'Где хранить токены авторизации?',
        a: `<h4>Коротко</h4>
        <p>Выбор идёт между двумя рисками: XSS и CSRF. <code>localStorage</code> доступен любому скрипту на странице — при XSS токен утекает мгновенно и переживает закрытие вкладки. Cookie с <code>HttpOnly</code>, <code>Secure</code> и <code>SameSite</code> из JS не читается, поэтому XSS её не украдёт, но появляется вопрос CSRF. Рекомендуемый вариант по умолчанию — cookie.</p>

        <h4>Как это работает</h4>
        <p>Типовая production-схема: <strong>короткоживущий access-токен</strong> (5–15 минут) хранится в памяти JS и уходит в заголовке <code>Authorization</code>; <strong>долгоживущий refresh-токен</strong> лежит в <code>HttpOnly</code>-cookie с путём, ограниченным эндпоинтом обновления. Клиент по 401 дёргает <code>/auth/refresh</code>, получает новый access и повторяет запрос.</p>
        <p>Что даёт такая схема: токен в памяти не переживает перезагрузку вкладки, поэтому окно кражи узкое; refresh недоступен JS, поэтому XSS не даст постоянного доступа; заголовок <code>Authorization</code> не подставляется браузером автоматически, поэтому CSRF на основные запросы не работает; сам refresh защищается <code>SameSite</code> и проверкой <code>Origin</code>.</p>
        <p>Дополнительно применяют <strong>ротацию</strong> refresh-токенов с детекцией повторного использования: если старый токен предъявили дважды, вся цепочка отзывается.</p>

        <h4>Почему так</h4>
        <p>Полностью защититься от последствий XSS нельзя: код на твоём домене может делать запросы даже без чтения токена. Но можно ограничить ущерб — сделать окно коротким и не дать унести долгоживущий доступ. Плата за схему: нужен эндпоинт обновления, обработка гонки нескольких параллельных 401 и чуть более сложный клиент.</p>

        <h4>Подводные камни</h4>
        <ul>
          <li><strong>Секретов в клиентском бандле не бывает.</strong> Всё с префиксом <code>NEXT_PUBLIC_</code> или <code>VITE_</code> публично по определению; ключ стороннего API прячется только за своим бэкендом.</li>
          <li><code>sessionStorage</code> ничем не лучше <code>localStorage</code> с точки зрения XSS — он просто живёт до закрытия вкладки.</li>
          <li>Несколько параллельных запросов при истёкшем access дают лавину refresh-запросов: нужен единый промис обновления в очереди.</li>
          <li>Cookie на поддомене (<code>Domain=.example.com</code>) доступна всем поддоменам — скомпрометированный <code>blog.example.com</code> утащит сессию.</li>
          <li>Хранение JWT ради «чтения роли на клиенте» — плохая мотивация: клиентские проверки декоративны, права проверяет сервер.</li>
          <li>Токен, попавший в URL или в лог, утекает через Referer и системы мониторинга.</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>«Как выйти на всех устройствах?» — нужен серверный список сессий или чёрный список refresh-токенов: JWT сам по себе не отзывается. «А если SPA на другом домене, чем API?» — <code>SameSite=None; Secure</code> плюс CORS с конкретным origin и CSRF-токен. «Что с BFF?» — паттерн, где токены целиком живут на сервере, а браузер держит только сессионную cookie: сейчас это рекомендованный подход.</p>`,
        code: `# refresh: недоступен JS, ограничен по пути, не уедет кросс-сайтово
Set-Cookie: refresh=...; HttpOnly; Secure; SameSite=Lax; Path=/auth/refresh

// access живёт в памяти модуля, а не в localStorage
let accessToken = null;

// один общий промис обновления — иначе лавина refresh при параллельных 401
let refreshing = null;
async function authFetch(url, init = {}) {
  const withAuth = () => ({
    ...init,
    headers: { ...init.headers, Authorization: 'Bearer ' + accessToken },
  });

  let res = await fetch(url, withAuth());
  if (res.status === 401) {
    refreshing ??= fetch('/auth/refresh', { method: 'POST', credentials: 'include' })
      .then(r => r.json())
      .then(d => { accessToken = d.accessToken; })
      .finally(() => { refreshing = null; });
    await refreshing;
    res = await fetch(url, withAuth());
  }
  return res;
}`,
        tip: 'Не выбирай между localStorage и cookie абстрактно — назови схему целиком: access в памяти, refresh в HttpOnly-cookie с ротацией. И добавь фразу «секретов в клиентском бандле не бывает»: её ждут почти всегда.' },

      { id: 'w11',
        q: 'HTTP/1.1, HTTP/2, HTTP/3 — что изменилось?',
        a: `<h4>Коротко</h4>
        <p>Каждая версия убирала свою разновидность head-of-line blocking. <strong>HTTP/1.1</strong>: запросы в соединении идут по очереди. <strong>HTTP/2</strong>: мультиплексирование потоков в одном соединении, но HOL остался на уровне TCP. <strong>HTTP/3</strong>: QUIC поверх UDP — потоки по-настоящему независимы.</p>

        <h4>Как это работает</h4>
        <ul>
          <li><strong>1.1</strong> — текстовый протокол, один запрос за раз на соединение. Браузер компенсирует это шестью параллельными соединениями на origin. Отсюда весь инженерный фольклор эпохи: CSS-спрайты, конкатенация всего JS в один бандл, инлайн картинок в base64 и домены-шарды.</li>
          <li><strong>2</strong> — бинарный, кадрирование, много потоков в одном TCP-соединении, сжатие заголовков HPACK, приоритеты. Дробить бандл на десятки чанков стало нормально и даже полезно: мелкие файлы лучше кешируются по отдельности. Но при потере пакета TCP останавливает доставку <strong>всем</strong> потокам, пока не придёт ретрансмит.</li>
          <li><strong>3</strong> — QUIC поверх UDP. Потери в одном потоке не блокируют остальные; рукопожатие транспорта и TLS 1.3 объединены (1 RTT, а при возобновлении 0-RTT); соединение привязано к Connection ID, а не к паре IP-порт, поэтому переживает переход с Wi-Fi на мобильную сеть без переподключения.</li>
        </ul>

        <h4>Почему так</h4>
        <p>Ограничение всегда было в транспорте, а не в семантике HTTP: методы и заголовки не менялись. Чтобы убрать HOL на уровне TCP, пришлось уйти с TCP — переписать его нельзя, он живёт в ядрах ОС и в промежуточном оборудовании. Плата за QUIC: реализация в user space (больше CPU), UDP местами режется корпоративными сетями, а отладка сложнее.</p>

        <h4>Подводные камни</h4>
        <ul>
          <li><strong>Костыли 1.1 вредят на 2 и 3</strong>: один гигантский бандл ломает кеширование и tree shaking, спрайты мешают ленивой загрузке, шардинг доменов добавляет лишние рукопожатия.</li>
          <li>Приоритеты HTTP/2 плохо поддержаны серверами; в HTTP/3 их заменила схема Extensible Priorities, но полагаться на неё вслепую не стоит.</li>
          <li><strong>Server Push</strong> из HTTP/2 признан неудачным и удалён из Chrome; вместо него используют <code>103 Early Hints</code> с <code>preload</code>.</li>
          <li>Мультиплексирование не отменяет ограничения пропускной способности: 200 запросов всё равно делят один канал.</li>
          <li>HTTP/3 требует <code>Alt-Svc</code> или HTTPS-запись в DNS для обнаружения — первый запрос всё равно идёт по 2.</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>«Насколько дробить бандл?» — по маршрутам и крупным виджетам; десятки чанков нормально, тысячи — уже накладные расходы на запросы и заголовки. «Где выигрыш HTTP/3 виден лучше всего?» — на мобильных сетях с потерями и при переключении между сетями. «Как проверить версию?» — колонка Protocol во вкладке Network (h2, h3).</p>`,
        code: `# что видно в DevTools → Network → колонка Protocol
http/1.1   h2   h3

# сервер сообщает о поддержке HTTP/3
Alt-Svc: h3=":443"; ma=86400

# вместо мёртвого Server Push — ранние подсказки
HTTP/1.1 103 Early Hints
Link: </app.css>; rel=preload; as=style
Link: </hero.avif>; rel=preload; as=image

// антипаттерн эпохи 1.1, вредный сегодня

// нормальная стратегия для h2/h3: чанки по маршрутам

        tip: 'Строй ответ вокруг head-of-line blocking: каждая версия убирала его на своём уровне. И назови практическое следствие — приёмы оптимизации из эпохи 1.1 (спрайты, мегабандл, шардинг доменов) сегодня вредят.' },

      { id: 'w12',
        q: 'Polling, SSE, WebSocket — что выбрать?',
        a: `<h4>Коротко</h4>
        <p>Решающий вопрос один: нужен ли <strong>низколатентный канал от клиента к серверу</strong>. Если нет — берём SSE, он проще во всём. Если да (чат, совместное редактирование, игры) — WebSocket. Polling остаётся для редких обновлений и там, где инфраструктура не позволяет держать соединение.</p>

        <h4>Как это работает</h4>
        <ul>
          <li><strong>Polling</strong> — периодические запросы. Просто, работает через любые прокси, легко кешируется и отлаживается. Цена: задержка равна интервалу, а трафик и нагрузка идут даже когда ничего не изменилось. Long polling (запрос висит до события) уменьшает задержку, но занимает соединение.</li>
          <li><strong>SSE</strong> — односторонний поток от сервера поверх обычного HTTP. Формат текстовый, есть встроенное автопереподключение и <code>Last-Event-ID</code> для догона пропущенного. Проходит через любые HTTP-прокси, работает с обычной авторизацией и сжатием. Идеален для уведомлений, лент событий, прогресса задач и стриминга ответов LLM.</li>
          <li><strong>WebSocket</strong> — полноценный двусторонний канал после HTTP-апгрейда. Минимальные накладные расходы на сообщение, бинарные кадры. Цена — своя инфраструктура: heartbeat, переподключение с backoff, sticky-сессии или общая шина между инстансами, отдельный мониторинг, проблемы с корпоративными прокси.</li>
        </ul>

        <h4>Почему так</h4>
        <p>SSE — это обычный HTTP-ответ, который не заканчивается, поэтому он наследует всю существующую инфраструктуру: балансировщики, авторизацию, retry, наблюдаемость. WebSocket меняет протокол и выпадает из неё, зато даёт симметричный канал. Выбор — между стоимостью эксплуатации и возможностями.</p>

        <h4>Подводные камни</h4>
        <ul>
          <li><strong>Лимит соединений SSE по HTTP/1.1</strong> — шесть на домен на все вкладки, и они кончаются мгновенно. По HTTP/2 ограничение снимается (около 100 потоков), но проверять надо.</li>
          <li>Нативный <code>EventSource</code> <strong>не умеет заголовки</strong>: токен приходится класть в cookie или query. Обходится библиотекой поверх <code>fetch</code>.</li>
          <li>WebSocket не переподключается сам: без heartbeat «мёртвое» соединение выглядит живым, пока не попробуешь отправить.</li>
          <li>Буферизующий прокси или nginx без <code>proxy_buffering off</code> задерживает SSE-события пачками.</li>
          <li>Масштабирование WebSocket требует шины (Redis pub/sub, NATS): без неё сообщение уйдёт только тем, кто попал на тот же инстанс.</li>
          <li>Ни один транспорт не гарантирует доставку сам по себе — нужна нумерация сообщений и догон истории после реконнекта.</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>«Почему стриминг LLM обычно на SSE?» — поток односторонний, а инфраструктура и переподключение достаются бесплатно. «Как догнать пропущенное?» — <code>Last-Event-ID</code> в SSE, а в WebSocket своя схема с запросом истории по последнему известному id. «Есть ли третий путь?» — WebTransport поверх HTTP/3 с ненадёжными потоками, но поддержка пока частичная.</p>`,
        code: `// SSE: переподключение и догон пропущенного — из коробки
const es = new EventSource('/api/stream');
es.addEventListener('message', (e) => append(JSON.parse(e.data)));
es.onerror = () => { /* браузер сам переподключится */ };

# формат ответа сервера
Content-Type: text/event-stream

id: 42
event: message
data: {"text":"привет"}

// WebSocket: heartbeat и backoff пишем сами
function connect(attempt = 0) {
  const ws = new WebSocket(url);
  const ping = setInterval(() => ws.readyState === 1 && ws.send('ping'), 15000);
  ws.onclose = () => {
    clearInterval(ping);
    const delay = Math.min(1000 * 2 ** attempt, 30000) * (0.5 + Math.random());
    setTimeout(() => connect(attempt + 1), delay);   // backoff с джиттером
  };
  return ws;
}`,
        tip: 'Дай критерий одной фразой: «нужен ли низколатентный канал от клиента». И назови эксплуатационную цену WebSocket — heartbeat, backoff, шина между инстансами: именно это отличает опыт от знания таблицы сравнения.' },

      { id: 'w13',
        q: 'localStorage, sessionStorage, cookie, IndexedDB — когда что?',
        a: `<h4>Коротко</h4>
        <p>Четыре хранилища с разным назначением. <code>localStorage</code> — мелкие настройки UI. <code>sessionStorage</code> — то же, но на одну вкладку. <strong>cookie</strong> — только то, что нужно серверу на каждом запросе. <strong>IndexedDB</strong> — всё крупное и структурированное. Ключевой критерий выбора: объём, нужен ли доступ серверу и допустима ли синхронная блокировка потока.</p>

        <h4>Как это работает</h4>
        <ul>
          <li><code>localStorage</code> — <strong>синхронный</strong> API, только строки, около 5 МБ на origin, общий для всех вкладок, живёт до явной очистки. Есть событие <code>storage</code> для синхронизации между вкладками. Годится для темы, языка, свёрнутых панелей, черновика.</li>

          <li><strong>cookie</strong> — около 4 КБ, но главное свойство другое: она <strong>уезжает с каждым запросом</strong> на домен. Поэтому только то, что нужно серверу: сессия, идентификатор эксперимента, локаль для SSR. Умеет флаги <code>HttpOnly</code>, <code>Secure</code>, <code>SameSite</code>.</li>
          <li><strong>IndexedDB</strong> — асинхронная транзакционная база: сотни мегабайт, любые структурированные данные (включая Blob и File), индексы, доступ из Service Worker и воркеров. Для офлайна, кеша ответов, вложений.</li>
          <li>Рядом стоит <strong>Cache API</strong> — хранилище пар «запрос-ответ» для Service Worker; для HTTP-ответов оно уместнее IndexedDB.</li>

        <h4>Почему так</h4>
        <p>Синхронность <code>localStorage</code> — историческое решение ради простоты API, и это его главный недостаток: каждое чтение и запись блокируют главный поток, а сериализация большого объекта через <code>JSON.stringify</code> превращается в long task и бьёт по INP. Сырое API IndexedDB неудобно именно потому, что асинхронно и транзакционно — поэтому на практике берут обёртку (idb, Dexie).</p>

        <h4>Подводные камни</h4>

          <li>Переполнение квоты даёт <code>QuotaExceededError</code> — обрабатывай, иначе приложение падает на ровном месте.</li>

          <li>Событие <code>storage</code> не срабатывает во вкладке-источнике: для общения между вкладками лучше <code>BroadcastChannel</code>.</li>
          <li>Ничего из этого не является безопасным хранилищем: пользователь и любой скрипт на странице всё видят.</li>

        <h4>Что спросят следом</h4>

      { id: 'w14',

        a: `<h4>Коротко</h4>
        <p>Порядок работы: сначала <strong>измерить</strong> (анализатор бандла), потом убрать лишнее, потом отложить остальное. Три главных рычага — code splitting, tree shaking и замена тяжёлых зависимостей. Финальный шаг — бюджет размера в CI, чтобы регрессия не проехала незамеченной.</p>

        <h4>Как это работает</h4>
        <ul>
          <li><strong>Code splitting</strong>: разделение по маршрутам (в Next и большинстве роутеров автоматически), <code>React.lazy</code> с <code>Suspense</code> и динамический <code>import()</code> для тяжёлых виджетов — редактора, карты, графиков, экспорта в PDF. Грузим по клику или по появлению в зоне видимости.</li>
          <li><strong>Tree shaking</strong>: работает только с ESM. Нужны точечные импорты, честное поле <code>sideEffects</code> в package.json и отказ от barrel-файлов, которые тянут за собой весь пакет.</li>
          <li><strong>Замена зависимостей</strong>: moment (около 70 КБ с локалями) на date-fns или dayjs, lodash на точечные импорты или нативные методы, тяжёлая библиотека графиков на лёгкую или на SVG вручную. Смотреть в bundlephobia перед установкой.</li>
          <li><strong>Полифилы</strong>: <code>browserslist</code> под современные браузеры убирает килобайты транспиляции; проверь, что не тянешь core-js целиком.</li>
          <li><strong>Шрифты</strong>: self-hosting, woff2, сабсеттинг под нужные символы, только используемые начертания.</li>
          <li><strong>Иконки</strong>: SVG-спрайт или точечные импорты вместо целого пакета иконок.</li>
        </ul>

        <h4>Почему так</h4>
        <p>Каждый килобайт JS дороже килобайта картинки: его надо скачать, распарсить, скомпилировать и выполнить — и всё это на главном потоке, часто на слабом телефоне. Поэтому JS режут агрессивнее всего. Плата за дробление: больше запросов (на HTTP/2 и 3 это дёшево), риск водопада при вложенных ленивых импортах и необходимость продумывать состояния загрузки.</p>

        <h4>Подводные камни</h4>
        <ul>
          <li><strong>Оптимизация без измерения.</strong> Начинай с <code>rollup-plugin-visualizer</code>, <code>@next/bundle-analyzer</code> или source-map-explorer: обычно 80% веса дают две-три зависимости.</li>
          <li><code>"sideEffects": false</code>, поставленный нечестно, вырежет импорт CSS или полифила.</li>
          <li>Дублирование зависимостей: две версии одного пакета в дереве. Проверяется <code>npm ls</code> и настраивается через overrides.</li>
          <li>Ленивая загрузка компонента, который нужен сразу на первом экране, ухудшает LCP вместо улучшения.</li>
          <li>Вендорный чанк «всё в одном» ломается при любом обновлении и обнуляет кеш пользователей.</li>
          <li>Метрика — не только размер: gzip и brotli, а главное время парсинга и выполнения.</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>«Как поставить бюджет?» — size-limit или bundlesize в CI с падением сборки при превышении. «Как понять, что грузится лишнее?» — вкладка Coverage в DevTools показывает долю неиспользованного кода. «Что делать с большой сторонней библиотекой, которую нельзя убрать?» — грузить по требованию и, если возможно, вынести работу в Web Worker.</p>`,
        code: `// маршруты и тяжёлые виджеты — по требованию

<Suspense fallback={<Skeleton />}><Editor /></Suspense>;

// грузим по клику, а не при старте
const openMap = async () => {
  const { renderMap } = await import('./map');

        <h4>Как это работает</h4>

        <p>Дополнительно: мемоизация строк и стабильные ключи, дебаунс поля поиска, <code>content-visibility: auto</code> с <code>contain-intrinsic-size</code> для тяжёлых блоков, отказ от теней и фильтров внутри строк, передача данных в компактном формате.</p>

        <h4>Почему так</h4>

      { id: 'sd2',
        q: 'Offset или cursor пагинация?',
        a: `<h4>Коротко</h4>
        <p>Определяет сценарий, а не вкус. <strong>Offset</strong> нужен там, где пользователю необходим переход на произвольную страницу: административные таблицы, отчёты. <strong>Cursor</strong> — там, где данные живые и читаются последовательно: ленты, бесконечная прокрутка, чаты, логи.</p>

        <h4>Как это работает</h4>
        <ul>
          <li><strong>Offset</strong> (<code>?page=3&amp;limit=20</code>) — база пропускает N записей и берёт следующие 20. Просто, даёт общее число страниц и прямой переход. Два минуса. Первый: при вставке или удалении элемента во время просмотра записи <strong>дублируются и пропадают</strong> между страницами — граница уезжает. Второй: <code>OFFSET 100000</code> заставляет базу прочитать и отбросить сто тысяч строк, и время растёт линейно.</li>
          <li><strong>Cursor</strong> (<code>?after=eyJpZCI6...</code>) — курсор кодирует позицию последнего элемента по <strong>стабильному ключу сортировки</strong>. Запрос превращается в <code>WHERE (created_at, id) &lt; (:ts, :id) ORDER BY ... LIMIT 20</code> — база идёт по индексу и не читает лишнего, поэтому время постоянно на любой глубине. Вставки в начало не сбивают выдачу.</li>
        </ul>
        <p>Важная деталь: ключ сортировки обязан быть уникальным. Одна дата у нескольких записей — и элементы на границе страницы теряются; поэтому в курсор кладут пару «поле сортировки + id».</p>

        <h4>Компромиссы</h4>
        <p>Cursor теряет то, что и делает offset удобным: нельзя прыгнуть на страницу 47, трудно показать общее число страниц (<code>COUNT</code> на большой таблице дорог сам по себе), и смена сортировки требует нового курсора. Offset платит корректностью и производительностью на глубине. Гибрид тоже встречается: keyset для ленты плюс приблизительный счётчик «примерно 12 000 результатов».</p>

          <li>Забывают про кеш и дедупликацию на клиенте: при бесконечной прокрутке одна и та же запись может прийти дважды, и React упадёт на дублирующихся ключах.</li>
          <li>Не думают про восстановление после перезагрузки: URL с курсором нечитаем, поэтому глубокую позицию обычно не сохраняют.</li>
          <li>Пропускают доступность бесконечной ленты: нужна кнопка «показать ещё» как альтернатива и доступ к футеру.</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>«Как сделать переход на страницу при курсорах?» — обычно никак: либо меняем UX на «показать ещё», либо держим отдельный индексный запрос. «Что с обновлением ленты сверху?» — отдельный запрос «новее чем курсор» и плашка «5 новых постов». «Как отдать общее число?» — приблизительно (оценка планировщика) или считать асинхронно и кешировать.</p>`,
        code: `# offset: просто, но на глубине дорого и с дырами

SELECT * FROM posts ORDER BY created_at DESC OFFSET 40 LIMIT 20;

# cursor (keyset): постоянное время, стабильная выдача
GET /api/posts?after=eyJ0cyI6IjIwMjUtMDgtMDEiLCJpZCI6MTIzfQ&limit=20

        code: `useMutation({

        <p>Микрофронтенды решают <strong>организационную</strong>, а не техническую задачу: они нужны, когда несколько независимых команд должны релизиться в разном темпе и владеть своими частями продукта целиком. Второй легитимный случай — постепенное вытеснение легаси, когда старое и новое приложение обязаны сосуществовать. Во всех остальных случаях честный ответ — не нужны.</p>

        <h4>Когда оправданы</h4>
        <ul>
          <li>Несколько команд, у каждой свой цикл релизов, и общий деплой стал узким местом (очередь на выкатку, блокирующие ревью, «поломал сборку всем»).</li>
          <li>Части продукта слабо связаны по домену: каталог, чекаут, личный кабинет, админка.</li>
          <li>Разные технологические стеки по историческим причинам, и переписать всё разом невозможно.</li>
          <li>Нужна возможность откатить один модуль, не откатывая весь продукт.</li>
        </ul>

        <h4>Цена</h4>
        <ul>
          <li><strong>Вес</strong>: дублирование зависимостей между модулями; React, роутер и дизайн-система норовят приехать несколько раз.</li>
          <li><strong>Расхождение UX</strong>: разные версии дизайн-системы дают заметные глазу отличия между разделами.</li>
          <li><strong>Сквозные заботы</strong>: авторизация, роутинг, обработка ошибок, аналитика, тема, локализация — всё это нужно решать централизованно и версионировать.</li>
          <li><strong>Отладка и тестирование</strong>: воспроизвести баг на стыке модулей трудно, e2e требуют поднятия всей композиции.</li>
          <li><strong>Инфраструктура</strong>: несколько пайплайнов, контрактные тесты, версионирование интерфейсов, оркестрация выката.</li>
        </ul>

        <h4>Альтернативы, которые почти всегда лучше</h4>
        <p>Монорепо с чёткими границами модулей, CODEOWNERS на директории, общей дизайн-системой и линтером зависимостей (запрет импортов через границы). Это даёт независимость владения без цены распределённой системы. Если проблема в скорости сборки — инкрементальные сборки и кеш; если в очереди на релиз — feature flags и trunk-based development.</p>

        <h4>Что упускают кандидаты</h4>
        <ul>
          <li><strong>Отвечают технологией, а не задачей.</strong> Module Federation — это как, а не зачем.</li>
          <li>Не называют, что версия общих зависимостей должна быть жёстко зафиксирована (<code>singleton: true</code> для React и роутера), иначе получишь два React в рантайме.</li>
          <li>Не думают про контракт между модулями и его версионирование: изменение пропсов удалённого компонента ломает хост в проде, а не на сборке.</li>
          <li>Забывают, что общее состояние между микрофронтендами — источник самой сильной связанности; передавать надо события и данные, а не стор.</li>
          <li>Не упоминают наблюдаемость: чей это модуль уронил страницу и как это видно в мониторинге.</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>«Какие есть способы композиции?» — сборка (пакеты npm), рантайм (Module Federation, import maps), серверная (edge side includes, Next.js multi-zones), iframe как крайний, но изолирующий вариант. «Как не сломать хост упавшим модулем?» — Error Boundary вокруг каждого удалённого модуля плюс фолбэк. «Что с общей дизайн-системой?» — отдельный версионированный пакет с политикой обновления и окном поддержки нескольких версий.</p>`,
        code: `// Module Federation: общие зависимости обязательно singleton
new ModuleFederationPlugin({
  name: 'checkout',
  filename: 'remoteEntry.js',
  exposes: { './Cart': './src/Cart' },
  shared: {
    react:       { singleton: true, requiredVersion: '^18.2.0' },
    'react-dom': { singleton: true, requiredVersion: '^18.2.0' },
    '@acme/ui':  { singleton: true },
  },
});

// хост: удалённый модуль всегда за границей ошибок и Suspense
const Cart = lazy(() => import('checkout/Cart'));
<ErrorBoundary fallback={<CartUnavailable />}>
  <Suspense fallback={<Skeleton />}><Cart /></Suspense>
</ErrorBoundary>

// связь между модулями — события и пропсы, а не общий стор
window.dispatchEvent(new CustomEvent('cart:updated', { detail: { count } }));`,
        tip: 'Начни с того, что это организационное решение, и честно скажи, что в большинстве случаев хватит монорепо с границами. Кандидат, который продаёт микрофронтенды как технологию, читается как человек без опыта их эксплуатации.' },

      { id: 'sd8',
        q: 'Как ты выстраиваешь тестирование фронтенда?',
        a: `<h4>Коротко</h4>
        <p>Классическая пирамида на фронтенде превращается в «трофей»: основную массу составляют не unit, а <strong>интеграционные компонентные</strong> тесты — они дают максимум уверенности на вложенную единицу усилий. Главный принцип: тестируем <strong>поведение</strong> глазами пользователя, а не детали реализации.</p>

        <h4>Слои</h4>
        <ul>
          <li><strong>Unit</strong> (Vitest, Jest) — чистая логика: расчёты, редьюсеры, форматтеры, валидаторы, утилиты. Быстро, много, дёшево поддерживать.</li>
          <li><strong>Компонентные и интеграционные</strong> (Testing Library) — основной слой. Ищем элементы по роли и доступному имени, кликаем через <code>userEvent</code>, проверяем то, что видит пользователь. Сеть мокаем на уровне HTTP через <strong>MSW</strong>, а не подменой <code>fetch</code>: так тест не знает, каким клиентом ходили за данными, и переживает смену библиотеки.</li>
          <li><strong>E2E</strong> (Playwright) — только критические сценарии: вход, оплата, ключевой флоу продукта. Дорогие в поддержке и хрупкие, поэтому их единицы, а не сотни.</li>
          <li><strong>Визуальная регрессия</strong> для дизайн-системы и <strong>автоматические проверки доступности</strong> (axe) в CI.</li>
          <li><strong>Типы</strong> — тоже слой защиты: строгий TypeScript снимает целый класс тестов на «а что если сюда придёт undefined».</li>
        </ul>

        <h4>Компромиссы</h4>
        <p>Много unit-тестов на компоненты даёт зелёный CI и ложную уверенность: каждый кусок работает, а вместе не собирается. Много e2e даёт уверенность, но медленный и флакающий пайплайн, который команда начинает перезапускать не глядя. Метрика — не процент покрытия, а <strong>уверенность в релизе</strong>: покрытие полезно только чтобы находить непокрытые важные ветки, а не как цель.</p>

        <h4>Что упускают кандидаты</h4>
        <ul>
          <li><strong>Тестируют реализацию</strong>: обращаются к внутреннему стейту, ищут по <code>data-testid</code> там, где есть роль и текст, проверяют, что вызвался конкретный хук. Такой тест ломается при рефакторинге, хотя поведение не изменилось.</li>
          <li>Не говорят про <strong>флакающие тесты</strong> и что с ними делать: фиксировать время и рандом, ждать состояния (<code>findBy</code>), а не таймаутами, карантин и обязательный разбор, а не <code>retry: 3</code> как решение.</li>
          <li>Не упоминают скорость обратной связи: тесты, идущие 20 минут, перестают запускать локально.</li>
          <li>Забывают про тестовые данные: фабрики вместо копипасты фикстур.</li>
          <li>Не связывают тесты с релизным процессом: что блокирует мерж, что гоняется на ночной сборке, что проверяется на staging.</li>
          <li>Не говорят, что тестировать <strong>не надо</strong>: сторонние библиотеки, тривиальные геттеры, вёрстку попиксельно вручную.</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>«Как тестировать асинхронный UI?» — <code>findBy</code> и <code>waitFor</code> вместо таймаутов, MSW для сценариев ошибки и медленного ответа. «Какое покрытие достаточно?» — вопрос неправильный; лучше метрика «сколько багов дошло до прода» и обязательный тест на каждый исправленный баг. «Как выбрать, что покрывать e2e?» — по деньгам и риску: сценарии, поломка которых стоит дороже всего.</p>`,
        code: `// поведение, а не реализация: роль и доступное имя
test('показывает ошибку, если сервер вернул 500', async () => {
  server.use(http.get('/api/users', () => HttpResponse.error()));
  render(<Users />);

  expect(await screen.findByRole('alert')).toHaveTextContent('Не удалось загрузить');
  await userEvent.click(screen.getByRole('button', { name: 'Повторить' }));
  expect(await screen.findByRole('list')).toBeInTheDocument();
});

// сеть мокаем на уровне HTTP — тест не знает про axios или fetch

);

// плохо: тест знает про внутренности и сломается при рефакторинге
expect(wrapper.state('isLoading')).toBe(false);
expect(useUsers).toHaveBeenCalledTimes(1);`,
        tip: 'Скажи «тестирую поведение, а не реализацию» и подкрепи примером с ролями и MSW. Отдельные очки — заговорить про флакающие тесты и про то, что покрытие не цель: это темы, которые поднимает только тот, кто жил с большим CI.' },

  {

    cards: [
      { id: 'b1',
        q: 'Что такое STAR и как рассказывать историю?',
        a: `<h4>Коротко</h4>
        <p>STAR — каркас истории из четырёх частей. <strong>S</strong>ituation: контекст в двух предложениях. <strong>T</strong>ask: твоя личная задача и зона ответственности. <strong>A</strong>ction: что сделал <strong>именно ты</strong> — «я», а не «мы». <strong>R</strong>esult: результат, желательно с числами, и чему это тебя научило. Длина — две-три минуты, дальше идут уточняющие вопросы.</p>

        <h4>Что на самом деле проверяют</h4>
        <p>Не саму историю, а способ мышления: понимаешь ли ты свою зону ответственности, принимаешь ли решения осознанно, умеешь ли структурно рассказывать сложное и оцениваешь ли результат по влиянию на продукт, а не по объёму работы. Интервьюер ищет поведенческие сигналы — ownership, работу с неопределённостью, коммуникацию — и STAR просто помогает ему их услышать.</p>

        <h4>Как строить рассказ</h4>
        <ol>
          <li><strong>Situation</strong> — только то, без чего непонятны решения: продукт, масштаб, роль, ограничение. Два предложения, не пять минут истории компании.</li>
          <li><strong>Task</strong> — что было <strong>твоей</strong> задачей и по каким критериям её оценивали. Здесь важно отделить себя от команды.</li>
          <li><strong>Action</strong> — <strong>половина времени рассказа</strong>. Какие варианты рассматривал, почему выбрал этот, что сделал сам, с кем и как договаривался, что пошло не по плану.</li>
          <li><strong>Result</strong> — число или наблюдаемое изменение, а если чисел нет — честное «метрику не снимали, но вот что изменилось». Плюс вывод: что бы сделал иначе.</li>
        </ol>

        <h4>Обезличенные формулировки</h4>
        <ul>
          <li>«Моей зоной ответственности было …, за остальное отвечал …»</li>
          <li>«Я рассматривал два варианта: … и … . Выбрал первый, потому что …, ценой …»</li>
          <li>«Результат — …; измеряли по …»</li>
          <li>«Сейчас бы сделал иначе вот в чём: …»</li>
        </ul>

        <h4>Красные флаги</h4>
        <ul>
          <li><strong>80% времени на контекст</strong> и двадцать секунд на собственные действия — самая частая ошибка.</li>
          <li>Сплошное «мы» без объяснения личного вклада.</li>
          <li>Результат без результата: «стало лучше», «всем понравилось».</li>
          <li>История, где всё прошло идеально и не было ни одного трудного решения.</li>
          <li>Рассказ на десять минут без пауз: интервьюеру не дают задать уточняющий вопрос.</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>«Почему выбрали именно этот вариант?», «Что было самым трудным?», «Кто был против и как вы договорились?», «Что бы сделали иначе?». Готовь ответы на них заранее — именно в них и происходит настоящая оценка.</p>`,
        code: `Тайминг истории на 2,5 минуты
────────────────────────────
Situation   ~20 сек   контекст, масштаб, ограничение
Task        ~20 сек   моя зона ответственности и критерий успеха
Action      ~80 сек   варианты → выбор и почему → что сделал → что пошло не так
Result      ~30 сек   число или наблюдаемое изменение + вывод

Проверка перед интервью
────────────────────────────
[ ] в Action звучит «я», а не только «мы»
[ ] назван хотя бы один отвергнутый вариант и причина
[ ] есть число или честное «не мерили, но …»
[ ] есть фраза «сейчас бы сделал иначе …»
[ ] уложился в 3 минуты при чтении вслух по таймеру`,
        tip: 'Половина времени должна уйти на Action — это единственная часть, где слышно тебя. Репетируй вслух с таймером: на бумаге история всегда кажется короче, чем звучит.' },

      { id: 'b2',
        q: 'Какие шесть историй нужно подготовить заранее?',
        a: `<h4>Коротко</h4>
        <p>Поведенческих вопросов кажется много, но за ними стоит десяток повторяющихся сигналов. Шесть подготовленных историй закрывают около 90% вопросов, потому что одна история отвечает сразу на несколько формулировок. Написать их нужно один раз — и дальше только подбирать нужную.</p>

        <h4>Шесть историй и сигнал за каждой</h4>
        <ol>
          <li><strong>Сложная техническая задача</strong> — проверяют глубину и умение объяснять сложное просто. Заодно закрывает «проект, которым гордишься» и «самое трудное решение».</li>
          <li><strong>Конфликт или несогласие</strong> — проверяют, умеешь ли спорить по существу и сохранять отношения. Закрывает «спор с коллегой», «несогласие с руководителем», «как убеждал».</li>
          <li><strong>Провал или ошибка</strong> — проверяют рефлексию и ownership. Закрывает «уронил прод», «ошибся в оценке», «неверное техническое решение».</li>
          <li><strong>Менторинг или влияние на команду</strong> — проверяют, растёшь ли ты за пределы своего кода. Закрывает «как помогал коллегам», «внедрил процесс», «улучшил DX».</li>
          <li><strong>Дедлайн и приоритизация</strong> — проверяют работу с ограничениями. Закрывает «не успевали», «как резал скоуп», «как сообщал о риске».</li>
          <li><strong>Инициатива</strong> — проверяют проактивность. Закрывает «сделал сверх задачи», «заметил проблему сам», «обосновал ценность бизнесу».</li>
        </ol>

        <h4>Как готовить</h4>
        <p>На каждую историю — короткий конспект по STAR (не текст, а тезисы) и три вещи: одно число, один отвергнутый вариант с причиной, один вывод. Держи набор в одном файле и перечитывай перед интервью. Полезно рядом пометить, на какие формулировки вопроса каждая история отвечает.</p>

        <h4>Что упускают кандидаты</h4>
        <ul>
          <li>Готовят только «сильные» истории и плывут на вопросе про провал или конфликт.</li>
          <li>Заучивают текст дословно — звучит как декламация, и первый же уточняющий вопрос всё ломает.</li>
          <li>Берут истории только из последнего места работы: набор получается однобоким.</li>
          <li>Не проверяют, что в истории есть <strong>решение</strong>, а не только выполнение задачи.</li>
          <li>Не готовят числа: их приходится вспоминать вслух, и это звучит неубедительно.</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>Почти всегда: «а что было самым сложным?», «кто ещё участвовал и что делали они?», «что бы сделали иначе?». По истории про инициативу часто спрашивают «как вы обосновали это бизнесу?» — заранее подумай, на какую метрику или боль ты ссылался.</p>`,
        code: `Шаблон конспекта на одну историю
─────────────────────────────────
Название:      короткое, чтобы быстро найти
Отвечает на:   «расскажи про конфликт», «когда был не согласен»
S:             контекст, масштаб, ограничение        (1–2 тезиса)
T:             моя зона ответственности              (1 тезис)
A:             варианты → выбор и почему → действия  (3–5 тезисов)
R:             число / наблюдаемое изменение         (1 тезис)
Вывод:         что изменил в своей работе после

Обязательный минимум в каждой
─────────────────────────────────
одно число · один отвергнутый вариант · один честный вывод`,
        tip: 'Пометь у каждой истории, на какие формулировки вопроса она отвечает — на интервью выбор нужной истории должен занимать секунду, а не полминуты молчания. И держи конспект тезисами, а не текстом: заученное наизусть слышно сразу.' },

      { id: 'b3',
        q: 'Как отвечать на вопрос про провал?',
        a: `<h4>Что на самом деле проверяют</h4>
        <p>Не сам провал, а три вещи: берёшь ли ты ответственность вместо поиска виноватых, способен ли анализировать причину, а не только симптом, и меняешь ли <strong>процесс</strong> после ошибки. Вопрос про провал — это на самом деле вопрос про зрелость и безопасность: с человеком, который не признаёт ошибок, опасно работать, потому что он их скрывает.</p>

        <h4>Каркас ответа</h4>
        <ol>
          <li><strong>Что произошло</strong> — коротко и без оправданий. Настоящая ошибка с реальными последствиями: уронил прод, ошибся в оценке в три раза, выбрал технологию, от которой потом отказались, пропустил баг, который дошёл до пользователей.</li>
          <li><strong>Какой был ущерб</strong> — в измеримых терминах: сколько времени лежало, сколько пользователей задело, сколько стоило команде. Не преуменьшай.</li>
          <li><strong>Как чинил</strong> — что сделал в первые минуты, как сообщил, кого подключил. Здесь виден навык действий под давлением.</li>
          <li><strong>Что изменил в процессе</strong> — тесты на этот класс ошибок, изменение в ревью, мониторинг и алерт, feature flags, постепенный выкат, чеклист. <strong>Это и есть ответ на вопрос.</strong> Без него история остаётся жалобой.</li>
        </ol>
        <p>Хорошо, если ты называешь и системную причину: «это стало возможно, потому что у нас не было X» — и что ты с этим сделал.</p>

        <h4>Обезличенные формулировки</h4>
        <ul>
          <li>«Ответственность была моя: я …»</li>
          <li>«Ущерб — …; заметили через … по …»</li>
          <li>«Корневая причина была не в самой опечатке, а в том, что …»</li>
          <li>«После этого мы внедрили …, и с тех пор такой класс ошибок ловится на …»</li>
        </ul>

        <h4>Красные флаги</h4>
        <ul>
          <li><strong>«У меня не было провалов»</strong> — читается как отсутствие ответственности или отсутствие опыта.</li>
          <li>Перекладывание вины на коллег, бизнес, сроки или «плохие требования».</li>
          <li>Ошибка настолько мелкая, что её не жалко: «однажды опечатался в переменной».</li>
          <li>Отсутствие изменений в процессе: «стал внимательнее» — это не решение, это намерение.</li>
          <li>Псевдо-провал в стиле «мой недостаток — я слишком много работаю».</li>
          <li>Скрытая обида на команду в тоне рассказа.</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>«Почему это вообще стало возможно?» — жди вопроса о системной причине. «Как узнали?» — от мониторинга или от пользователей: второе хуже, и это стоит признать. «Повторялось ли потом?» — лучший ответ, если нет, и ты можешь сказать, что именно этому помешало.</p>`,
        code: `Каркас ответа про провал
──────────────────────────────
1. Факт        что сломалось, без смягчений
2. Ущерб       время / пользователи / деньги, измеримо
3. Реакция     что сделал в первые минуты, кого предупредил
4. Причина     системная, а не «был невнимателен»
5. Изменение   что появилось в процессе после (главный пункт)

Плохо → Хорошо
──────────────────────────────
«Задача пришла без требований»   → «Я не уточнил критерий приёмки»
«Стал внимательнее»              → «Добавили алерт на рост 5xx и smoke-тест»
«Мы уронили прод»                → «Я выкатил миграцию без обратной совместимости»
«Всё быстро починили»            → «Откатили за 12 минут, инцидент разобрали»`,
        tip: 'Половина ответа должна быть про изменение процесса, а не про сам инцидент. И называй ущерб честно — попытка преуменьшить заметна и стоит дороже самой ошибки.' },

      { id: 'b4',
        q: 'Как рассказывать про конфликт с коллегой?',
        a: `<h4>Что на самом деле проверяют</h4>
        <p>Умеешь ли ты спорить по существу, не переходя на людей, и сохранять рабочие отношения после спора. Отдельно смотрят, способен ли ты <strong>изменить своё мнение</strong> под аргументами и качественно реализовать решение, которое приняли не в твою пользу. Для сеньора это критично: он влияет на решения команды, и токсичный спорщик обходится дороже, чем неидеальная архитектура.</p>

        <h4>Каркас ответа</h4>
        <ol>
          <li><strong>В чём было расхождение</strong> — суть технического или процессного вопроса, без ярлыков вроде «он не разбирался».</li>
          <li><strong>Как ты понял позицию оппонента</strong> — уточнял, переспрашивал, формулировал его аргумент своими словами. Это самая ценная часть: она показывает, что ты слушал, а не ждал очереди говорить.</li>
          <li><strong>Какие данные принёс</strong> — замеры, прототип, оценка трудозатрат, разбор рисков, пример из другого проекта. Спор, переведённый в измеримое, перестаёт быть спором о вкусах.</li>
          <li><strong>Как приняли решение</strong> — кто принимал, по каким критериям, был ли зафиксирован выбор (ADR, запись в тикете).</li>
          <li><strong>Что вышло</strong> — включая честное «я был неправ», если так и было.</li>
        </ol>
        <p>Сильные варианты истории: ты изменил своё мнение под аргументами; решение приняли не твоё, но ты реализовал его качественно, а потом честно оценил результат; вы нашли третий вариант, который никто не предлагал изначально.</p>

        <h4>Обезличенные формулировки</h4>
        <ul>
          <li>«Мы расходились в …; его аргумент был …, и он был обоснован тем, что …»</li>
          <li>«Чтобы не спорить на уровне мнений, я сделал прототип и замерил …»</li>
          <li>«Решение принимал …; критерием был …»</li>
          <li>«В итоге выбрали не мой вариант. Я его реализовал, и через … стало видно, что …»</li>
          <li>«Я поменял позицию, когда увидел, что …»</li>
        </ul>

        <h4>Красные флаги</h4>
        <ul>
          <li>Оценки людей вместо позиций: «он не разбирался», «менеджер не понимал технику».</li>
          <li>История, где ты всегда оказался прав и все потом это признали.</li>
          <li>Эскалация к руководителю как первый шаг, а не последний.</li>
          <li>«Я просто сделал по-своему» — обход договорённости, а не разрешение конфликта.</li>
          <li>Молчаливое согласие с последующим саботажем: «сделал, но плохо, чтобы показать».</li>
          <li>Конфликт, в котором не было никакого содержательного предмета.</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>«Как сейчас отношения с этим человеком?» — важен ответ, что рабочие. «Что бы сделали иначе?» — обычно «раньше перевёл бы обсуждение в данные». «А если бы вы оказались правы, а решение было чужое?» — говори про механизм: зафиксировали критерий, договорились вернуться к вопросу через месяц с метриками.</p>`,
        code: `Порядок эскалации спора
────────────────────────────
1. Уточнить      переформулировать позицию оппонента своими словами
2. Найти критерий по чему вообще решаем: скорость, стоимость, риск
3. Измерить      прототип, бенчмарк, оценка трудозатрат
4. Зафиксировать письменно: варианты, критерий, выбор и его цена
5. Эскалировать  только если критерий продуктовый и решает не команда

Плохо → Хорошо
────────────────────────────
«Он был не прав»              → «Его аргумент был …, и он был обоснован»
«Я настоял на своём»          → «Мы сравнили по критерию … и выбрали …»
«Пошёл к тимлиду»             → «Сначала измерили, эскалация не понадобилась»
«Сделал по-своему потихоньку» → «Решение зафиксировали, я реализовал их вариант»`,
        tip: 'Лучшая история про конфликт — та, где ты изменил своё мнение или качественно реализовал чужое решение. Она сильнее истории про победу: интервьюер ищет человека, с которым можно спорить, а не выигрывать у него.' },

      { id: 'b5',
        q: 'Как построить рассказ о себе за две минуты?',
        a: `<h4>Что на самом деле проверяют</h4>
        <p>Этот ответ задаёт тон всему интервью: по нему интервьюер решает, куда копать дальше. Проверяют три вещи — умеешь ли ты структурно излагать, понимаешь ли масштаб своей работы (а не только список технологий) и осознанно ли выбираешь позицию. Хронологический пересказ резюме проваливает все три: резюме интервьюер уже читал.</p>

        <h4>Каркас на две минуты</h4>
        <ol>
          <li><strong>Кто ты сейчас</strong> — одно предложение: сколько лет в разработке, на чём специализируешься, в каком типе продуктов.</li>
          <li><strong>Два-три релевантных проекта с масштабом</strong> — аудитория, объём данных, размер команды, твоя роль и одно измеримое достижение на каждый. Релевантных именно этой вакансии, а не всех подряд.</li>
          <li><strong>Твоя сильная сторона</strong> — то, за чем к тебе приходят коллеги. Формулируй как способность, а не как список технологий: «умею вытаскивать производительность на больших списках», «беру задачи с размытыми требованиями».</li>
          <li><strong>Почему эта позиция</strong> — что конкретно в продукте, задачах или стеке тебе интересно. Одно предложение, но конкретное.</li>
        </ol>

        <h4>Обезличенные формулировки</h4>
        <ul>
          <li>«Я фронтенд-разработчик, … лет, специализируюсь на … в продуктах типа …»</li>
          <li>«Последние … лет работал над …; команда — … человек, аудитория — …; я отвечал за …»</li>
          <li>«Самое заметное, что сделал там, — …, это дало …»</li>
          <li>«Ко мне обычно приходят, когда нужно …»</li>
          <li>«Ваша вакансия интересна тем, что …»</li>
        </ul>

        <h4>Красные флаги</h4>
        <ul>
          <li><strong>Хронология с первого места работы</strong> — к пятой минуте интервьюер перестаёт слушать.</li>
          <li>Перечисление технологий без контекста: «React, TypeScript, Node, Docker, Kubernetes».</li>
          <li>Отсутствие масштаба: непонятно, это стартап на трёх человек или продукт на миллионы пользователей.</li>
          <li>Негатив о текущем работодателе как объяснение поиска.</li>
          <li>Ответ на пятнадцать секунд («ну, я пишу на React») — приходится вытягивать клещами.</li>
          <li>Заученный текст без пауз: не даёт интервьюеру зацепиться и задать вопрос.</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>Почти наверняка уточнят по одному из названных проектов — поэтому упоминай только то, о чём готов говорить пятнадцать минут вглубь. Часто спрашивают «почему уходите с текущего места?»: отвечай через то, чего хочешь дальше, а не через то, что не устраивает сейчас.</p>`,
        code: `Каркас на 2 минуты
────────────────────────────
0:00–0:15   кто я сейчас: опыт, специализация, тип продуктов
0:15–1:15   2–3 проекта: масштаб → моя роль → измеримый результат
1:15–1:40   сильная сторона как способность, а не стек
1:40–2:00   почему эта позиция и что хочу дальше

Подготовка
────────────────────────────
[ ] по каждому названному проекту готов уйти вглубь на 15 минут
[ ] у каждого проекта есть масштаб: пользователи, команда, данные
[ ] нет ни одного слова про недостатки текущего работодателя
[ ] прочитан вслух по таймеру и уложился в 2 минуты
[ ] версия под конкретную вакансию, а не универсальная`,
        tip: 'Называй только те проекты, по которым готов отвечать на пятнадцать минут вглубь: интервьюер выберет один из них и начнёт копать. И готовь отдельную версию под каждую вакансию — универсальная всегда звучит мимо.' },

      { id: 'b6',
        q: 'Какие вопросы задать интервьюеру?',
        a: `<h4>Что на самом деле проверяют</h4>
        <p>Вопросы кандидата — это последний и очень сильный сигнал. По ним видно, интересуется ли человек продуктом и процессами или только зарплатой, мыслит ли он масштабом команды и есть ли у него опыт, из которого эти вопросы вырастают. Ответ «нет вопросов, вы всё рассказали» — упущенная возможность, а часто и минус.</p>

        <h4>Что спрашивать</h4>
        <p>Три-четыре вопроса, подобранные под собеседника: инженеру — про инженерию, руководителю — про процессы и цели, рекрутеру — про условия.</p>
        <ul>
          <li><strong>Про процесс:</strong> как устроен путь от идеи до продакшена? Кто принимает технические решения и как они фиксируются? Как устроены ревью, тестирование и релизы, как часто деплоите?</li>
          <li><strong>Про боль:</strong> какой сейчас главный технический вызов у команды? Что болит в техдолге и есть ли на него выделенное время?</li>
          <li><strong>Про роль:</strong> как выглядит успех на этой позиции через полгода? Чего не хватает команде сейчас, раз открыли вакансию?</li>
          <li><strong>Про людей:</strong> кто в команде и с кем я буду работать плотнее всего? Как принимаются решения, когда мнения расходятся?</li>
          <li><strong>Про продукт:</strong> какие метрики у продукта и как команда на них влияет? Кто ставит приоритеты?</li>
        </ul>
        <p>Сильный ход — вопрос, вырастающий из разговора: «вы упомянули, что переезжаете на App Router — что оказалось самым болезненным?». Он показывает, что ты слушал.</p>

        <h4>Чего избегать</h4>
        <ul>
          <li>Отпуск, переработки, компенсация в первую очередь — это разговор с рекрутером на следующем круге.</li>
          <li>Вопросы, ответ на которые есть на сайте компании: выглядит как отсутствие подготовки.</li>
          <li>Экзаменовка интервьюера: «а почему вы выбрали именно этот стек?» с интонацией «зря выбрали».</li>
          <li>Десять вопросов подряд: это интервью, а не допрос; трёх-четырёх достаточно.</li>
          <li>«У меня всё, спасибо» — читается как отсутствие интереса к позиции.</li>
        </ul>

        <h4>Как слушать ответы</h4>
        <p>Вопросы нужны и тебе: ты выбираешь работу. Тревожные признаки в ответах — «релизим когда получится», «тестов пока нет, но собираемся», «техдолгом занимаемся в свободное время», уклончивость про причину открытия вакансии, невозможность назвать метрику успеха роли. Один такой ответ ещё ничего не значит, три — уже картина.</p>

        <h4>Что спросят следом</h4>
        <p>Часто интервьюер отвечает встречно: «а как это устроено у вас?». Будь готов кратко описать процесс на текущем месте — без оценок и без негатива, просто как факт.</p>`,
        code: `Подбор вопросов под собеседника
────────────────────────────────
инженер      ревью, тесты, релизы, техдолг, архитектурные решения
тимлид       цели команды, распределение задач, рост, критерии успеха
продакт      метрики, приоритизация, влияние команды на продукт
рекрутер     условия, формат, следующие шаги, сроки решения

Тревожные ответы
────────────────────────────────
«Релизим, когда получится»            → нет предсказуемого процесса
«Тестов пока нет, планируем»          → регресс ловят пользователи
«Техдолг делаем в свободное время»    → свободного времени не бывает
«Прошлый разработчик просто ушёл»     → уклончивость про причину
«Успех? Ну, чтобы задачи закрывались» → нет критериев роли`,
        tip: 'Один вопрос обязательно построй на том, что интервьюер сказал в разговоре, — это невозможно подготовить заранее и потому ценится выше остальных. И слушай ответы всерьёз: ты тоже выбираешь.' },

      { id: 'b7',
        q: 'Что читается как красный флаг в ответах кандидата?',
        a: `<h4>Что на самом деле проверяют</h4>
        <p>Красные флаги — это не «неправильные ответы», а сигналы о том, как человек будет вести себя в команде: как он говорит о конфликтах, признаёт ли границы своих знаний, умеет ли выбирать осознанно. Один флаг обычно ничего не решает, но два-три складываются в отказ даже при сильной технической части.</p>

        <h4>Основные флаги</h4>
        <ul>
          <li><strong>Негатив о бывших коллегах и работодателях.</strong> Интервьюер мысленно подставляет себя на их место. Говори про факты и решения, а не про людей.</li>
          <li><strong>«Мы сделали»</strong> без объяснения личной роли. Непонятно, что делал именно ты, — значит, засчитать нечего.</li>
          <li><strong>Отсутствие результата и чисел.</strong> «Стало лучше» — насколько, по какой метрике, кто заметил?</li>
          <li><strong>Догматизм вместо компромиссов:</strong> «Redux всегда плохо», «тесты не нужны», «микросервисы — это всегда правильно». Сеньорность — это умение назвать условия, при которых верно и то, и другое.</li>
          <li><strong>Неумение сказать «не знаю».</strong> Блеф виден мгновенно и обесценивает всё, что было сказано до.</li>
          <li><strong>Ответы без вопросов:</strong> кандидат бросается решать задачу, не уточнив требования.</li>
          <li><strong>Никакой рефлексии:</strong> все проекты прошли идеально, ошибок не было, менять нечего.</li>
          <li><strong>Пассивность:</strong> «мне давали задачи, я делал» — на сеньорной позиции ждут инициативы и влияния.</li>
        </ul>

        <h4>Как правильно не знать</h4>
        <p>Формула из трёх частей: честно обозначить границу, показать способ рассуждения, назвать проверку. «С этим не работал. Рассуждал бы так: … Проверил бы вот так — сделал бы прототип и замерил …». Это сильнее выдуманного ответа, потому что показывает именно то, что нужно в работе: поведение при столкновении с незнакомым.</p>

  { id: 't2', title: 'throttle(fn, ms)', must: true, why: 'Идёт в паре с debounce',

            'Если окно ещё не истекло — поставить отложенный вызов на остаток окна, но только один.'],
    code: `function throttle(fn, ms) {
  let lastTime = 0;
  let timer = null;
  return function (...args) {
    const now = Date.now();
    const remaining = ms - (now - lastTime);
    if (remaining <= 0) {
      lastTime = now;
      fn.apply(this, args);
    } else if (!timer) {
      timer = setTimeout(() => {
        lastTime = Date.now();
        timer = null;
        fn.apply(this, args);
      }, remaining);
    }
  };
}`,

    code: `function deepClone(value, seen = new WeakMap()) {
  if (value === null || typeof value !== 'object') return value;
  if (seen.has(value)) return seen.get(value);
  if (value instanceof Date) return new Date(value);

  if (value instanceof Map) {
    const m = new Map(); seen.set(value, m);
    value.forEach((v, k) => m.set(deepClone(k, seen), deepClone(v, seen)));
    return m;
  }
  if (value instanceof Set) {
    const s = new Set(); seen.set(value, s);
    value.forEach(v => s.add(deepClone(v, seen)));
    return s;
  }

  const result = Array.isArray(value) ? [] : {};
  seen.set(value, result);
  for (const key of Object.keys(value)) {
    result[key] = deepClone(value[key], seen);

  { id: 't11', title: 'LRU-кеш', must: false, why: 'Единственный «алгоритм», который реально спрашивают фронтендам',
    prompt: `<p>Кеш фиксированной ёмкости: <code>get</code> и <code>put</code> за O(1). При переполнении вытесняется наименее недавно использованный элемент.</p>`,
    hints: ['Map хранит порядок вставки — это и есть порядок свежести.',
            'get должен переставлять элемент в конец: delete + set.',
            'Самый старый ключ — первый: map.keys().next().value.'],
    code: `class LRUCache {
  constructor(capacity) {
    this.capacity = capacity;
    this.map = new Map();
  }

  get(key) {
    if (!this.map.has(key)) return -1;
    const value = this.map.get(key);
    this.map.delete(key);
    this.map.set(key, value);   // переставить в конец = освежить
    return value;
  }

  put(key, value) {
    if (this.map.has(key)) {
      this.map.delete(key);
    } else if (this.map.size >= this.capacity) {
      this.map.delete(this.map.keys().next().value);  // вытеснить самый старый
    }
    this.map.set(key, value);
  }
}`,
    notes: `<p>Классическое решение — двусвязный список плюс хеш-таблица. Скажи, что знаешь его, но <code>Map</code> в JS уже даёт нужный порядок, поэтому городить список незачем.</p>` },

  { id: 't12', title: 'useDebounce и usePrevious', must: true, why: 'Кастомные хуки спрашивают почти всегда',
    prompt: `<p>Напиши хук, возвращающий значение с задержкой, и хук, возвращающий значение из предыдущего рендера.</p>`,
    hints: ['Вся суть useDebounce — в cleanup: он отменяет предыдущий таймер.',
            'usePrevious: ref обновляется в эффекте, то есть уже после рендера, поэтому во время рендера в нём лежит прошлое значение.'],
    code: `function useDebounce(value, ms) {
  const [debounced, setDebounced] = useState(value);
  useEffect(() => {
    const timer = setTimeout(() => setDebounced(value), ms);
    return () => clearTimeout(timer);
  }, [value, ms]);
  return debounced;
}

function usePrevious(value) {
  const ref = useRef();
  useEffect(() => { ref.current = value; });  // после рендера
  return ref.current;                         // значение прошлого рендера
}`,
    notes: `<p>В <code>usePrevious</code> у эффекта намеренно нет массива зависимостей — он должен срабатывать после каждого рендера.</p>` },

  { id: 't13', title: 'useFetch с отменой', must: true, why: 'Проверяет гонки запросов и cleanup',
    prompt: `<p>Хук загрузки данных: состояния загрузки, успеха и ошибки, отмена при размонтировании и при смене URL.</p>`,
    hints: ['AbortController создаётся внутри эффекта, abort вызывается в cleanup.',
            'AbortError нужно отфильтровать — это не ошибка загрузки, а наша собственная отмена.',
            'fetch не бросает на 4xx и 5xx — проверять res.ok вручную.'],
    code: `function useFetch(url) {
  const [state, setState] = useState({ status: 'loading', data: null, error: null });

  useEffect(() => {
    const controller = new AbortController();
    setState({ status: 'loading', data: null, error: null });

    fetch(url, { signal: controller.signal })
      .then((res) => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then((data) => setState({ status: 'success', data, error: null }))
      .catch((error) => {
        if (error.name !== 'AbortError') {
          setState({ status: 'error', data: null, error });
        }
      });

    return () => controller.abort();
  }, [url]);

  return state;
}`,
    notes: `<p>Два момента, за которые здесь и ставят балл: <code>fetch</code> реджектится только на сетевой ошибке, поэтому <code>res.ok</code> проверяем сами; и отмена в cleanup решает не только утечку, но и гонку — ответ на старый URL не затрёт новый.</p>
    <p>Финальная реплика: в продакшене это TanStack Query, а не свой хук — там уже есть кеш, дедупликация и повторы.</p>` },

  { id: 't14', title: 'Компонент Autocomplete', must: true, why: 'Собеседование целиком в одной задаче',

    hints: ['Собери из готовых кусков: useDebounce плюс эффект с AbortController.',

    code: `function Autocomplete({ search, onSelect }) {
  const [query, setQuery] = useState('');
  const [items, setItems] = useState([]);
  const [active, setActive] = useState(-1);
  const debouncedQuery = useDebounce(query, 300);

  useEffect(() => {
    if (debouncedQuery.length < 2) { setItems([]); return; }
    const controller = new AbortController();
    search(debouncedQuery, controller.signal)
      .then((res) => { setItems(res); setActive(-1); })
      .catch((e) => { if (e.name !== 'AbortError') setItems([]); });
    return () => controller.abort();
  }, [debouncedQuery, search]);

  function onKeyDown(e) {
    if (e.key === 'ArrowDown') setActive((i) => Math.min(i + 1, items.length - 1));
    if (e.key === 'ArrowUp')   setActive((i) => Math.max(i - 1, 0));
    if (e.key === 'Enter' && items[active]) onSelect(items[active]);
    if (e.key === 'Escape') setItems([]);
  }

  return (
    <div role="combobox" aria-expanded={items.length > 0}>
      <input
        value={query}
        onChange={(e) => setQuery(e.target.value)}
        onKeyDown={onKeyDown}
        aria-activedescendant={active >= 0 ? 'opt-' + active : undefined}
      />
      <ul role="listbox">
        {items.map((item, i) => (
          <li
            key={item.id}
            id={'opt-' + i}
            role="option"
            aria-selected={i === active}
            onMouseDown={() => onSelect(item)}

}`,
    notes: `<p>Проговори улучшения, даже если не успел их написать: кеш «запрос → результаты», минимальная длина запроса, подсветка совпадения, состояния «ничего не найдено» и «ошибка», <code>onMouseDown</code> вместо <code>onClick</code> (иначе blur закроет список раньше выбора).</p>` },

  depth <= 0
    ? arr.slice()
    : arr.reduce((acc, item) =>
        acc.concat(Array.isArray(item) ? flatten(item, depth - 1) : item), []);

const chunk = (arr, size) =>
  Array.from({ length: Math.ceil(arr.length / size) }, (_, i) =>
    arr.slice(i * size, i * size + size));

const groupBy = (arr, keyFn) =>

function mergeCards(deckId, cards) {
  if (!cards || !cards.length) return;
  const deck = DECKS.find(d => d.id === deckId);
  if (deck) deck.cards = deck.cards.concat(cards);
}

if (typeof DECK_JS_EXTRA    !== 'undefined') mergeCards('js',    DECK_JS_EXTRA);
if (typeof DECK_TS_EXTRA    !== 'undefined') mergeCards('ts',    DECK_TS_EXTRA);
if (typeof DECK_REACT_EXTRA !== 'undefined') mergeCards('react', DECK_REACT_EXTRA);
if (typeof DECK_WEB_EXTRA   !== 'undefined') mergeCards('web',   DECK_WEB_EXTRA);
if (typeof DECK_SD_EXTRA    !== 'undefined') mergeCards('sd',    DECK_SD_EXTRA);
if (typeof DECK_BEH_EXTRA   !== 'undefined') mergeCards('beh',   DECK_BEH_EXTRA);

// Паттерны — отдельная колода после React: там же, где о них спрашивают
if (typeof DECK_PATTERNS !== 'undefined' && DECK_PATTERNS.length) {

}

if (typeof DECK_CSS !== 'undefined' && DECK_CSS.length) {

}
