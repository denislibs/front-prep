<meta charset="utf-8">
<title>Frontend Interview Trainer</title>
<!--__VENDOR__-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,300;0,6..12,400;0,6..12,600;0,6..12,900&family=JetBrains+Mono:wght@400;700&display=swap">

<style>
/* ── Design tokens ─────────────────────────────────────────────
   Palette lifted from epam.com CSS custom properties:
   #000 / #1b1b1b / #231f20 / #eee / #737373 / #bbb / #0047ff
   gradients: #0078c2→#0047ff→#8453d2 (light), #00fff0→#00f6ff→#b896ff (dark)
   Type: museo-sans → Nunito Sans (closest free relative) ───── */

:root {
  --paper:        #ffffff;
  --paper-2:      #f5f5f5;
  --paper-3:      #eeeeee;
  --ink:          #000000;
  --ink-2:        #231f20;
  --muted:        #737373;
  --line:         #d9d9d9;
  --line-2:       #bbbbbb;
  --accent:       #0047ff;
  --accent-soft:  rgba(0, 71, 255, .08);
  --grad:         linear-gradient(90deg, #0078c2 0%, #0047ff 55%, #8453d2 100%);
  --known:        #007a6e;
  --known-bg:     rgba(0, 122, 110, .1);
  --review:       #8a5a00;
  --review-bg:    rgba(255, 192, 0, .18);
  --code-bg:      #f5f5f5;
  --code-ink:     #231f20;
  --shadow:       0 1px 0 rgba(0,0,0,.04);

  --syn-keyword:  #8453d2;
  --syn-string:   #0078c2;
  --syn-number:   #b5480a;
  --syn-comment:  #8a8a8a;
  --syn-func:     #0047ff;
  --syn-prop:     #006b7d;
  --syn-type:     #7a2fb0;
  --syn-op:       #737373;

  --step--1: .78rem;
  --step-0:  1rem;
  --step-1:  1.25rem;
  --step-2:  1.6rem;
  --step-3:  2.2rem;
  --step-4:  3.4rem;

  --sans: museo-sans, "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:        #1b1b1b;
    --paper-2:      #231f20;
    --paper-3:      #2b2728;
    --ink:          #ffffff;
    --ink-2:        #eeeeee;
    --muted:        #9a9a9a;
    --line:         #383536;
    --line-2:       #4a4647;
    --accent:       #76cdd8;
    --accent-soft:  rgba(118, 205, 216, .12);
    --grad:         linear-gradient(90deg, #00fff0 0%, #00f6ff 55%, #b896ff 100%);
    --known:        #4fd6c4;
    --known-bg:     rgba(79, 214, 196, .12);
    --review:       #ffc000;
    --review-bg:    rgba(255, 192, 0, .14);
    --code-bg:      #141313;
    --code-ink:     #eeeeee;
    --shadow:       none;

    --syn-keyword:  #b896ff;
    --syn-string:   #76cdd8;
    --syn-number:   #ffc000;
    --syn-comment:  #6f6a6b;
    --syn-func:     #00f6ff;
    --syn-prop:     #9fd8e0;
    --syn-type:     #d4b3ff;
    --syn-op:       #9a9a9a;
  }
}

:root[data-theme="dark"] {
  --paper:        #1b1b1b;
  --paper-2:      #231f20;
  --paper-3:      #2b2728;
  --ink:          #ffffff;
  --ink-2:        #eeeeee;
  --muted:        #9a9a9a;
  --line:         #383536;
  --line-2:       #4a4647;
  --accent:       #76cdd8;
  --accent-soft:  rgba(118, 205, 216, .12);
  --grad:         linear-gradient(90deg, #00fff0 0%, #00f6ff 55%, #b896ff 100%);
  --known:        #4fd6c4;
  --known-bg:     rgba(79, 214, 196, .12);
  --review:       #ffc000;
  --review-bg:    rgba(255, 192, 0, .14);
  --code-bg:      #141313;
  --code-ink:     #eeeeee;
  --shadow:       none;

  --syn-keyword:  #b896ff;
  --syn-string:   #76cdd8;
  --syn-number:   #ffc000;
  --syn-comment:  #6f6a6b;
  --syn-func:     #00f6ff;
  --syn-prop:     #9fd8e0;
  --syn-type:     #d4b3ff;
  --syn-op:       #9a9a9a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--step-0);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* EPAM signature: gradient hairline pinned to the top of the page */
.topline {
  position: fixed; inset: 0 0 auto 0; height: 3px;
  background: var(--grad); z-index: 60;
}

/* ── Header ─────────────────────────────────────────────────── */
header {
  position: sticky; top: 0; z-index: 50;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  padding: 3px 0 0;
}
.header-inner {
  max-width: 1120px; margin: 0 auto;
  padding: 14px 24px;
  display: flex; align-items: center; gap: 28px; flex-wrap: wrap;
}
.wordmark {
  font-family: var(--mono); font-weight: 700; font-size: 15px;
  letter-spacing: -.02em; white-space: nowrap;
}
.wordmark span { color: var(--muted); }

nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button {
  font-family: var(--sans); font-size: 12px; font-weight: 900;
  letter-spacing: .1em; text-transform: uppercase;
  background: none; border: 0; border-radius: 0;
  color: var(--muted); padding: 8px 12px; cursor: pointer;
  position: relative;
}
nav button:hover { color: var(--ink); }
nav button[aria-current="true"] { color: var(--ink); }
nav button[aria-current="true"]::after {
  content: ""; position: absolute; left: 12px; right: 12px; bottom: 2px;
  height: 2px; background: var(--grad);
}

.header-meta { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.overall {
  display: flex; align-items: center; gap: 10px;
  font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted);
}
.overall .bar { width: 90px; }
.icon-btn {
  background: none; border: 1px solid var(--line-2); color: var(--muted);
  width: 32px; height: 32px; cursor: pointer; font-size: 14px; line-height: 1;
  display: grid; place-items: center; padding: 0;
}
.icon-btn:hover { border-color: var(--ink); color: var(--ink); }

/* ── Layout ─────────────────────────────────────────────────── */
main { max-width: 1120px; margin: 0 auto; padding: 40px 24px 120px; }

.eyebrow {
  font-size: 11px; font-weight: 900; letter-spacing: .16em;
  text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; gap: 10px;
}
.eyebrow::after {
  content: ""; flex: 1; height: 1px; background: var(--line);
}

h1 {
  font-size: var(--step-4); font-weight: 300; line-height: 1.03;
  letter-spacing: -.03em; margin: 18px 0 0; text-wrap: balance;
}
h1 b { font-weight: 900; }
h2 { font-size: var(--step-2); font-weight: 300; letter-spacing: -.02em; margin: 0 0 4px; }
h3 { font-size: var(--step-1); font-weight: 900; margin: 0 0 8px; letter-spacing: -.01em; }

.lede { color: var(--muted); max-width: 62ch; margin: 16px 0 0; font-size: var(--step-1); font-weight: 300; }

/* ── Progress bar ───────────────────────────────────────────── */
.bar { height: 3px; background: var(--line); position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--grad); transition: width .35s ease; }

/* ── Buttons ────────────────────────────────────────────────── */
.pill {
  font-family: var(--sans); font-size: 12px; font-weight: 900;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 13px 26px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line-2); background: transparent; color: var(--ink);
  transition: border-color .15s, background .15s, color .15s;
}
.pill:hover { border-color: var(--ink); }
.pill-primary {
  border: 0; color: #fff; background: var(--grad); position: relative;
}
:root[data-theme="dark"] .pill-primary,
.pill-primary.on-dark { color: #000; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .pill-primary { color: #000; }
}
.pill-primary:hover { filter: brightness(1.08); }
.pill-known { border-color: var(--known); color: var(--known); }
.pill-known:hover { background: var(--known-bg); border-color: var(--known); }
.pill-review { border-color: var(--review); color: var(--review); }
.pill-review:hover { background: var(--review-bg); border-color: var(--review); }
.pill:disabled { opacity: .35; cursor: not-allowed; }

.ghost {
  background: none; border: 0; color: var(--muted); cursor: pointer;
  font-family: var(--sans); font-size: 12px; font-weight: 900;
  letter-spacing: .08em; text-transform: uppercase; padding: 8px 0;
}
.ghost:hover { color: var(--ink); }

:where(button, a, [tabindex]):focus-visible {
  outline: 2px solid var(--accent); outline-offset: 3px;
}

/* ── Dashboard ──────────────────────────────────────────────── */
.deck-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
  gap: 1px; background: var(--line); border: 1px solid var(--line);
  margin-top: 32px;
}
.deck-card {
  background: var(--paper); padding: 22px 20px 18px; cursor: pointer;
  border: 0; text-align: left; font-family: var(--sans); color: var(--ink);
  display: flex; flex-direction: column; gap: 12px; min-height: 150px;
  transition: background .15s;
}
.deck-card:hover { background: var(--paper-2); }
.deck-card .title { font-size: var(--step-1); font-weight: 900; letter-spacing: -.01em; }
.deck-card .sub { font-size: var(--step--1); color: var(--muted); flex: 1; }
.deck-card .foot {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 11px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted);
}
.deck-card .foot .pct { color: var(--ink); font-variant-numeric: tabular-nums; }

.stat-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 40px;
}
.stat { background: var(--paper); padding: 20px; }
.stat .n { font-size: var(--step-3); font-weight: 300; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.stat .l { font-size: 11px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
.stat.is-review .n { color: var(--review); }
.stat.is-known .n { color: var(--known); }

.plan { margin-top: 56px; border-top: 1px solid var(--line); }
.plan-day {
  display: grid; grid-template-columns: 60px 1fr; gap: 20px;
  padding: 18px 0; border-bottom: 1px solid var(--line); align-items: baseline;
}
.plan-day .d {
  font-size: 11px; font-weight: 900; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums;
}
.plan-day .t { font-weight: 900; }
.plan-day .desc { color: var(--muted); font-size: var(--step--1); margin-top: 2px; }

/* ── Card trainer ───────────────────────────────────────────── */
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 24px 0 0; }
.chip {
  font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase;
  padding: 8px 14px; border: 1px solid var(--line-2); background: transparent;
  color: var(--muted); cursor: pointer; font-family: var(--sans); border-radius: 0;
  display: inline-flex; align-items: center; gap: 8px;
}
.chip:hover { border-color: var(--ink); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip .cnt { opacity: .6; font-variant-numeric: tabular-nums; }

.search {
  font-family: var(--sans); font-size: 12px; font-weight: 600;
  letter-spacing: .04em; padding: 8px 14px; min-width: 200px; flex: 1; max-width: 320px;
  border: 1px solid var(--line-2); background: transparent; color: var(--ink);
  border-radius: 0; appearance: none;
}
.search::placeholder { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 900; font-size: 11px; }
.search:focus { outline: none; border-color: var(--accent); }

.card-shell { margin-top: 28px; border: 1px solid var(--line-2); background: var(--paper); }
.card-head {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 14px 24px; border-bottom: 1px solid var(--line);
  font-size: 11px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted);
}
.card-head .counter { margin-left: auto; font-variant-numeric: tabular-nums; }
.tag { padding: 4px 9px; border: 1px solid currentColor; }
.tag-known { color: var(--known); background: var(--known-bg); }
.tag-review { color: var(--review); background: var(--review-bg); }

.card-body { padding: 32px 24px; }
.q {
  font-size: var(--step-2); font-weight: 300; letter-spacing: -.02em;
  line-height: 1.3; max-width: 34ch; text-wrap: balance;
}
.answer { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 24px; max-width: 68ch; }
.answer p { margin: 0 0 14px; }
.answer p:last-child { margin-bottom: 0; }
.answer ul, .answer ol { margin: 0 0 14px; padding-left: 20px; }
.answer li { margin-bottom: 7px; }
.answer strong { font-weight: 900; }
.answer code, .tip code, .task-body code {
  font-family: var(--mono); font-size: .86em; background: var(--paper-3);
  padding: 2px 5px; color: var(--code-ink);
}
.tip {
  margin-top: 22px; padding: 16px 18px; background: var(--accent-soft);
  border-left: 3px solid var(--accent); max-width: 68ch;
}
.tip .lbl {
  font-size: 11px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase;
  color: var(--accent); display: block; margin-bottom: 6px;
}
.tip p { margin: 0; font-size: var(--step--1); }

pre {
  background: var(--code-bg); color: var(--code-ink); padding: 18px 20px;
  overflow-x: auto; margin: 0 0 16px; border: 1px solid var(--line);
}
pre code {
  font-family: var(--mono); font-size: 13px; line-height: 1.65;
  background: none; padding: 0; white-space: pre;
}

.card-actions {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  padding: 18px 24px; border-top: 1px solid var(--line); background: var(--paper-2);
}
.card-actions .spacer { flex: 1; }
.kbd {
  font-family: var(--mono); font-size: 10px; border: 1px solid var(--line-2);
  padding: 2px 6px; color: var(--muted); margin-left: 6px;
}

.empty { padding: 60px 24px; text-align: center; color: var(--muted); }
.empty h3 { color: var(--ink); }

/* ── Livecoding ─────────────────────────────────────────────── */
.task-list { margin-top: 28px; border-top: 1px solid var(--line); }
.task-row {
  width: 100%; display: grid; grid-template-columns: 34px 1fr auto;
  gap: 16px; align-items: center; text-align: left;
  padding: 16px 4px; background: none; border: 0; border-bottom: 1px solid var(--line);
  cursor: pointer; font-family: var(--sans); color: var(--ink);
}
.task-row:hover { background: var(--paper-2); }
.task-row .num {
  font-family: var(--mono); font-size: 12px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.task-row .name { display: block; font-weight: 600; }
.task-row .why { display: block; font-size: var(--step--1); color: var(--muted); margin-top: 2px; }
.lvl {
  font-size: 10px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase;
  padding: 4px 8px; border: 1px solid var(--line-2); color: var(--muted); white-space: nowrap;
}
.lvl-must { border-color: var(--accent); color: var(--accent); }

.task-body { margin-top: 24px; max-width: 74ch; }
.task-body h3 { margin-top: 30px; }
.task-body p { margin: 0 0 14px; }
.task-body ul { padding-left: 20px; margin: 0 0 14px; }
.task-body li { margin-bottom: 6px; }
.hint {
  border-left: 3px solid var(--line-2); padding: 4px 0 4px 16px;
  color: var(--muted); font-size: var(--step--1); margin: 0 0 12px;
}
details.solution { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 20px; }
details.solution summary {
  cursor: pointer; font-size: 12px; font-weight: 900; letter-spacing: .1em;
  text-transform: uppercase; color: var(--accent); list-style: none;
}
details.solution summary::-webkit-details-marker { display: none; }
details.solution summary::before { content: "→ "; }
details.solution[open] summary::before { content: "↓ "; }
details.solution > div { margin-top: 20px; }

/* ── Рабочее место: редактор и результаты ───────────────────── */
.workbench { margin: 30px 0 34px; border: 1px solid var(--line-2); }
.workbench-head {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--paper-2);
}
.eyebrow-plain {
  font-size: 11px; font-weight: 900; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted);
}
.env-tag {
  font-size: 10px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase;
  padding: 3px 8px; border: 1px solid var(--line-2); color: var(--muted);
}
.editor-host { max-height: 460px; overflow: auto; background: var(--code-bg); }
.editor-host .cm-editor { height: 100%; }

.workbench-actions {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 14px 16px; border-top: 1px solid var(--line); background: var(--paper-2);
}
.workbench-actions .spacer { flex: 1; }
.kbd-hint { font-family: var(--mono); font-size: 11px; color: var(--muted); }

.run-output:not(:empty) { border-top: 1px solid var(--line); padding: 16px; }
.run-summary {
  display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px;
  padding-bottom: 12px; border-bottom: 1px solid var(--line);
}
.run-count {
  font-size: var(--step-2); font-weight: 300; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}
.run-summary.is-pass .run-count { color: var(--known); font-weight: 900; }
.run-label {
  font-size: 11px; font-weight: 900; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted);
}

.check { padding: 10px 0; border-bottom: 1px solid var(--line); }
.check:last-child { border-bottom: 0; }
.check-head { display: flex; gap: 10px; align-items: baseline; }
.check-mark { font-family: var(--mono); font-weight: 700; }
.check.is-pass .check-mark { color: var(--known); }
.check.is-fail .check-mark { color: var(--review); }
.check.is-pass .check-name { color: var(--muted); }
.check-name { font-size: var(--step--1); }
.check-error { margin: 6px 0 0 26px; font-size: var(--step--1); color: var(--review); }
.check-diff {
  margin: 8px 0 0 26px; display: grid; gap: 4px;
  font-family: var(--mono); font-size: 12px;
}
.check-diff code {
  background: var(--code-bg); padding: 3px 7px; display: inline-block;
  max-width: 100%; overflow-x: auto; color: var(--code-ink);
}
.diff-label {
  display: inline-block; min-width: 82px; color: var(--muted);
  font-family: var(--sans); font-size: 10px; font-weight: 900;
  letter-spacing: .1em; text-transform: uppercase;
}
.check-logs {
  margin: 8px 0 0 26px; padding: 8px 10px; font-size: 12px;
  background: var(--code-bg); border: 1px solid var(--line); overflow-x: auto;
}
.run-error { border-left: 3px solid var(--review); padding: 10px 14px; background: var(--review-bg); }
.run-error-title {
  font-size: 11px; font-weight: 900; letter-spacing: .1em;
  text-transform: uppercase; color: var(--review); margin-bottom: 6px;
}
.run-error p { margin: 0; font-size: var(--step--1); }

.task-row .solved { color: var(--known); font-family: var(--mono); }

/* ── Свободный ответ и разбор ───────────────────────────────── */
.answer-box { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 22px; }
.answer-box-head {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
}
.answer-hint { font-size: var(--step--1); color: var(--muted); }
.answer-field {
  width: 100%; font-family: var(--sans); font-size: var(--step-0); line-height: 1.55;
  padding: 14px 16px; border: 1px solid var(--line-2); background: var(--paper);
  color: var(--ink); border-radius: 0; resize: vertical;
}
.answer-field:focus { outline: none; border-color: var(--accent); }
.answer-field::placeholder { color: var(--muted); }
.answer-actions { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.answer-actions .spacer { flex: 1; }

.grade:not(:empty) { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 20px; }
.grade-waiting { color: var(--muted); font-size: var(--step--1); margin: 0; }
.grade-head { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
.grade-score {
  font-size: 3rem; font-weight: 300; line-height: 1; letter-spacing: -.04em;
  font-variant-numeric: tabular-nums;
}
.grade-score.is-good { color: var(--known); }
.grade-score.is-mid  { color: var(--review); }
.grade-score.is-bad  { color: var(--review); }
.grade-scale {

    id: 'js', title: 'JavaScript', sub: 'Event loop, замыкания, this, промисы — ядро любой секции.',
    cards: [
      { id: 'js1',
        q: 'Как работает event loop? Чем микрозадачи отличаются от макрозадач?',
        a: `<p>JS однопоточный, конкурентность строится на цикле событий. За один тик:</p>
        <ol>
          <li>Выполняется одна <strong>макрозадача</strong> — script, <code>setTimeout</code>, <code>setInterval</code>, I/O, обработчик события.</li>
          <li>Затем выполняется <strong>вся очередь микрозадач</strong> до опустошения — <code>Promise.then/catch/finally</code>, <code>queueMicrotask</code>, <code>MutationObserver</code>. Микрозадача, породившая микрозадачу, тоже отработает в этом же тике.</li>

        <p>Порядок: <code>A</code>, <code>F</code> синхронно → очередь <code>[C, E]</code> → выполняется <code>C</code>, только теперь <code>D</code> встаёт <strong>в конец</strong> очереди → <code>E</code> → <code>D</code> → макрозадача <code>B</code>.</p>`,

// A F C E D B`,

      { id: 'js3',
        q: 'Что такое замыкание и где ты реально его используешь?',
        a: `<p>Функция вместе со своим лексическим окружением: она «помнит» переменные области, где была создана, даже после выхода из неё.</p>
        <p>На практике: приватное состояние (фабрики, модули), <code>debounce</code>/<code>throttle</code>, мемоизация, каррирование, обработчики и колбэки, и весь механизм хуков React.</p>
        <p>Ключевая фраза: <strong>замыкание захватывает переменную, а не её значение</strong> — отсюда и баг с <code>var</code> в цикле, и stale closure в React.</p>`,

        q: 'Почему цикл с var выводит 3, 3, 3? Как починить двумя способами, не заменяя var на let?',
        a: `<p><code>var</code> функционально-областная, поэтому на весь цикл существует <strong>одна</strong> переменная <code>i</code>, и все три колбэка замкнулись на неё же. Синхронный цикл завершается до срабатывания таймеров, <code>i</code> к тому моменту равна 3.</p>
        <p>Чинится созданием отдельной переменной на итерацию: IIFE, либо передача значения аргументом. А <code>let</code> работает потому, что спецификация создаёт <strong>новую привязку на каждую итерацию</strong> цикла <code>for</code> — физически три разные переменные.</p>`,

}
// 2) третий аргумент setTimeout передаётся в колбэк
for (var i = 0; i < 3; i++) setTimeout(console.log, 0, i);`,

      { id: 'js5',
        q: 'Как определяется this? Назови правила в порядке приоритета.',
        a: `<p>Определяется <strong>в момент вызова</strong>, а не объявления:</p>
        <ol>
          <li><code>new Fn()</code> — this равен новому объекту.</li>

        <p>Потеря контекста: <code>const m = obj.method; m()</code> — this потерян, лечится <code>bind</code> или стрелкой.</p>`,

      { id: 'js6',
        q: 'Почему call и bind не работают со стрелочными функциями?',
        a: `<p>У стрелочных функций <strong>нет собственного this</strong> — они берут его лексически, из области, где были созданы, и это зафиксировано навсегда. <code>call</code>, <code>apply</code> и <code>bind</code> просто игнорируют переданный контекст, а <code>new</code> с ними бросает ошибку.</p>
        <p>Объектный литерал области видимости не создаёт, поэтому стрелка-«метод» видит this внешнего скоупа: в модуле ESM это <code>undefined</code>.</p>`,

        <p><code>class</code> — синтаксический сахар: методы кладутся в <code>ClassName.prototype</code>. <code>new Fn()</code> создаёт объект с прототипом <code>Fn.prototype</code> и вызывает <code>Fn</code> с this на нём.</p>`,

      { id: 'js8',
        q: 'Promise.all, allSettled, race, any — в чём разница и когда что?',
        a: `<ul>

      { id: 'js9',
        q: 'Что не так с этим кодом и как переписать?',
        a: `<p>Два уровня ответа. Первый, сеньорский: <strong>зачем вообще N запросов</strong> — попросить у бэкенда batch-эндпоинт <code>/api/users?ids=1,2,3</code>, это убирает N round-trip'ов.</p>
        <p>Второй, если бэк трогать нельзя: <code>await</code> внутри цикла делает запросы строго последовательными, общее время равно сумме задержек. Итерации независимы — значит запускаем параллельно через <code>Promise.all</code>, и время становится равно самому медленному запросу.</p>

      { id: 'js10',
        q: 'Почему нельзя просто запустить 500 запросов через Promise.all? Как ограничить параллелизм?',
        a: `<p>Проблемы: браузер держит ограниченное число соединений на домен (около 6 по HTTP/1.1), остальные висят в очереди; на бэке это всплеск нагрузки и лёгкий шанс словить rate limit или 429; плюс конкуренция за сеть с действительно важными запросами.</p>
        <p>Решение — <strong>пул</strong>: держим окно в N одновременных задач (обычно 5–10), освободился слот — берём следующую из очереди.</p>`,
        code: `async function promisePool(tasks, limit) {

      { id: 'js11',

      { id: 'js12',

        q: 'Чем == отличается от ===? Что выведет [] == ![] и почему?',

      { id: 'js14',
        q: 'Что такое hoisting и temporal dead zone?',
        a: `<p>Объявления обрабатываются до выполнения кода. <code>var</code> поднимается и инициализируется как <code>undefined</code>. <code>let</code> и <code>const</code> тоже поднимаются, но не инициализируются: обращение до объявления бросает <code>ReferenceError</code> — это и есть <strong>temporal dead zone</strong>.</p>

        a: `<p>Алгоритм — достижимость (mark-and-sweep): всё, до чего нельзя добраться от корней, удаляется. Счётчик ссылок не используется именно из-за циклов.</p>

        a: `<p>Событие идёт в три фазы: погружение от window к цели, цель, всплытие обратно. Слушатели по умолчанию срабатывают на всплытии; третий аргумент <code>capture: true</code> переводит на погружение.</p>
        <p><strong>Делегирование</strong>: один слушатель на контейнере вместо N на элементах — работает для динамически добавляемых элементов, экономит память. Внутри определяем цель через <code>event.target.closest(selector)</code>.</p>
        <p><code>preventDefault()</code> отменяет действие браузера по умолчанию (переход по ссылке, отправку формы). <code>stopPropagation()</code> останавливает дальнейшее распространение события. Это независимые вещи.</p>` },

      { id: 'js19',
        q: 'Чем debounce отличается от throttle и где применяется каждый?',
        a: `<p><strong>debounce</strong> — «подожди, пока перестанут дёргать, потом сделай один раз»: схлопывает серию вызовов в последний. Поисковые подсказки, автосохранение, валидация при вводе, resize.</p>
        <p><strong>throttle</strong> — «делай, но не чаще раза в N мс»: прореживает поток с постоянной частотой. Скролл, mousemove, drag-n-drop, отправка аналитики.</p>`,
        tip: 'Разница в одной фразе: debounce схлопывает серию в последний вызов, throttle прореживает поток. Обе — классические задачи на написание, см. раздел «Лайвкодинг».' },

      { id: 'js20',
        q: 'Что такое итерируемый объект и зачем нужны генераторы?',
        a: `<p>Протокол итератора — объект с методом <code>next()</code>, возвращающим <code>{value, done}</code>. Объект становится итерируемым, если у него есть <code>[Symbol.iterator]</code>: тогда работают <code>for..of</code>, спред и деструктуризация.</p>
        <p>Генераторы (<code>function*</code>, <code>yield</code>) — короткий способ написать итератор: функция приостанавливается на каждом <code>yield</code> и продолжает с того же места. Годятся для ленивых и бесконечных последовательностей; исторически на них строились корутины (redux-saga).</p>` },
    ]
  },

  {
    id: 'ts', title: 'TypeScript', sub: 'Narrowing, дженерики, utility types руками.',
    cards: [
      { id: 'ts1',
        q: 'interface или type — что выбрать и почему?',
        a: `<p>Почти взаимозаменяемы. <code>interface</code> умеет declaration merging (можно дополнять извне), описывает только объектные формы, чуть дружелюбнее в текстах ошибок. <code>type</code> умеет union, intersection, mapped и conditional типы, примитивы, кортежи.</p>
        <p>Практика: <code>interface</code> для публичных API и объектов, <code>type</code> для всего остального. Главное — консистентность внутри команды, а не догма.</p>` },

      { id: 'ts2',
        q: 'unknown против any — в чём принципиальная разница?',
        a: `<p><code>any</code> отключает проверку типов и «заражает» всё вокруг: любое обращение считается валидным. <code>unknown</code> означает «тип неизвестен» — с ним нельзя сделать ничего, пока не сузишь проверкой.</p>
        <p>Правило: всё, что приходит извне — ответ API, <code>JSON.parse</code>, данные из localStorage — это <code>unknown</code> плюс валидация (zod) или type guard.</p>` },

      { id: 'ts3',
        q: 'Что такое never и как сделать exhaustive check?',
        a: `<p><code>never</code> — тип недостижимого значения: функция, которая всегда бросает, или пустой union.</p>
        <p>Главное применение — проверка полноты <code>switch</code>: если в union добавили новый вариант и его не обработали, присваивание в <code>never</code> перестанет компилироваться. Ошибка ловится на этапе сборки, а не в проде.</p>`,
        code: `switch (shape.kind) {
  case 'circle': return Math.PI * shape.r ** 2;
  case 'square': return shape.side ** 2;
  default: {

    return _exhaustive;
  }
}` },

      { id: 'ts4',
        q: 'Что такое discriminated union и почему это главный паттерн для стейта?',
        a: `<p>Union объектов с общим полем-дискриминантом. Проверка этого поля автоматически сужает тип, и невозможные комбинации становятся непредставимыми.</p>
        <p>Классический выигрыш: нельзя прочитать <code>data</code>, не проверив, что статус <code>success</code>, и нет состояния «загружается и одновременно ошибка».</p>`,
        code: `type State =

  | { status: 'loading' }

  | { status: 'error'; error: string };`,

      { id: 'ts5',
        q: 'Напиши типобезопасную функцию pick.',
        a: `<p>Нужны два параметра типа: сам объект и ключи, ограниченные его ключами через <code>extends keyof T</code>. Возвращаемый тип собирается через <code>Pick</code>.</p>`,
        code: `function pick<T extends object, K extends keyof T>(obj: T, keys: K[]): Pick<T, K> {
  const result = {} as Pick<T, K>;
  for (const key of keys) result[key] = obj[key];
  return result;
}
pick({ id: 1, name: 'D', age: 30 }, ['id', 'name']); // { id: number; name: string }` },

      { id: 'ts6',
        q: 'Как устроены Partial, Pick и ReturnType изнутри?',
        a: `<p>На mapped types (перебор ключей) и conditional types с <code>infer</code> (вытащить тип из позиции). Уметь написать их руками — стандартный вопрос.</p>
        <p>Важный нюанс: conditional types <strong>дистрибутивны по union</strong> — применяются к каждому члену по отдельности. Именно поэтому работает <code>Exclude</code>.</p>`,
        code: `type MyPartial<T>    = { [K in keyof T]?: T[K] };
type MyRequired<T>   = { [K in keyof T]-?: T[K] };
type MyPick<T, K extends keyof T> = { [P in K]: T[P] };
type MyReturnType<T> = T extends (...args: any[]) => infer R ? R : never;
type MyExclude<T, U> = T extends U ? never : T;
type MyOmit<T, K extends keyof T> = MyPick<T, MyExclude<keyof T, K>>;` },

      { id: 'ts7',
        q: 'Зачем нужен satisfies и чем он отличается от аннотации и as?',
        a: `<p>Аннотация <code>const c: Config = {...}</code> проверяет соответствие, но <strong>расширяет</strong> тип до объявленного — конкретные литералы теряются. <code>as</code> вообще не проверяет, а насильно переопределяет.</p>
        <p><code>satisfies</code> проверяет соответствие типу и при этом <strong>сохраняет точный вывод</strong>: можно и опечатку в ключе поймать, и получить литеральные типы значений.</p>`,
        code: `const routes = {
  home: '/',
  user: '/users/:id',
} satisfies Record<string, string>;
// routes.home имеет тип '/', а не string` },

      { id: 'ts8',
        q: 'Что такое структурная типизация и как сделать номинальную?',
        a: `<p>TypeScript сравнивает типы по <strong>форме</strong>, а не по имени: два независимо объявленных типа с одинаковыми полями взаимозаменяемы. Отсюда и то, что <code>UserId</code> и <code>PostId</code>, оба <code>string</code>, можно перепутать.</p>
        <p>Номинальность эмулируется branded types: пересечение с невидимым «клеймом».</p>`,
        code: `type UserId = string & { readonly __brand: 'UserId' };
const toUserId = (v: string) => v as UserId;
// теперь обычная строка не пролезет туда, где ждут UserId` },

      { id: 'ts9',
        q: 'Почему as опасен?',
        a: `<p><code>as</code> — утверждение типа, а не приведение: он не проверяет и не меняет данные в рантайме, а просто заставляет компилятор замолчать. Если реальность не совпала, падать будет в проде и в другом месте.</p>
        <p>Легальные применения: сужение после проверки, которую компилятор не понимает, и построение объекта по кусочкам (<code>{} as T</code>). Всё остальное — повод пересмотреть типы или написать type guard.</p>` },

      { id: 'ts10',
        q: 'enum или union литералов? Какие настройки строгости включать?',
        a: `<p>Сейчас чаще предпочитают <code>as const</code> объект плюс union: не генерирует рантайм-код, лучше вытрясается из бандла, проще совместим с внешними данными. Числовые enum вдобавок принимают любое число — дыра.</p>
        <p>Из настроек: <code>strict: true</code> обязательно, дальше полезны <code>noUncheckedIndexedAccess</code> (доступ по индексу даёт <code>T | undefined</code>) и <code>exactOptionalPropertyTypes</code>.</p>`,
        code: `const Status = { Active: 'active', Blocked: 'blocked' } as const;
type Status = typeof Status[keyof typeof Status]; // 'active' | 'blocked'` },
    ]
  },

  {
    id: 'react', title: 'React и Next.js', sub: 'Рендеры, хуки, RSC, стратегии рендеринга.',
    cards: [
      { id: 'r1',
        q: 'Что происходит от setState до обновления DOM?',
        a: `<p>Три стадии. <strong>Render</strong> — React вызывает функцию компонента и получает новое дерево элементов (легковесных объектов-описаний, не DOM). <strong>Reconciliation</strong> — сравнение с предыдущим деревом: разный тип элемента означает пересоздание поддерева, одинаковый — обновление изменившихся пропсов, списки сопоставляются по <code>key</code>. <strong>Commit</strong> — минимальный набор мутаций реального DOM и запуск эффектов.</p>`,
        tip: 'С React 18 все setState батчатся автоматически, включая промисы и таймауты — один ререндер на синхронный блок.' },

      { id: 'r2',
        q: 'Что такое Fiber и конкурентный рендеринг?',
        a: `<p>Fiber — внутреннее представление, при котором рендер-фаза разбита на прерываемые единицы работы. React может приостановить низкоприоритетный рендер, обработать срочное обновление (ввод пользователя) и вернуться назад.</p>
        <p>Отсюда пользовательский API: <code>useTransition</code> помечает обновление как несрочное, <code>useDeferredValue</code> даёт «отстающее» значение. Тяжёлый список перерисовывается в фоне, поле ввода остаётся отзывчивым.</p>` },

      { id: 'r3',
        q: 'Зачем нужен key и почему нельзя использовать индекс массива?',
        a: `<p><code>key</code> — идентичность элемента между рендерами, по ней React понимает, что элемент тот же самый, а не новый на том же месте.</p>
        <p>Индекс ломается при вставке в начало, удалении и сортировке: у элементов сдвигаются ключи, React переиспользует не тот DOM-узел и не то состояние. Классический баг — значения в инпутах списка «переезжают» к соседям.</p>
        <p>Индекс допустим только для статичного списка, который никогда не меняет порядок и не фильтруется.</p>` },

      { id: 'r4',
        q: 'В каких случаях компонент ререндерится?',
        a: `<ul>
          <li>Изменился его собственный стейт.</li>
          <li>Отрендерился родитель — <strong>независимо от того, изменились ли пропсы</strong>. React не обязан их сравнивать, пока не попросишь.</li>
          <li>Изменилось значение контекста, который компонент читает.</li>
        </ul>
        <p>Частое заблуждение — «пропсы не поменялись, значит не ререндерится». Именно поэтому и существует <code>React.memo</code>.</p>` },

      { id: 'r5',
        q: 'memo, useMemo, useCallback — когда применять и почему не везде?',
        a: `<p><code>React.memo</code> пропускает рендер при поверхностно равных пропсах. <code>useMemo</code> кеширует результат вычисления, <code>useCallback</code> — ссылку на функцию, чтобы memo и массивы зависимостей вообще могли работать.</p>
        <p>Мемоизировать всё подряд вредно: у самой мемоизации есть цена (память, сравнение, сложность чтения), а один немемоизированный объектный пропс обнуляет весь эффект. Правильный порядок — сначала профилирование в React DevTools Profiler, потом точечная оптимизация.</p>`,
        tip: 'Упомяни React Compiler в React 19: он автоматизирует мемоизацию, и ручные useMemo постепенно становятся исключением, а не нормой.' },

      { id: 'r6',
        q: 'Как убрать лишние ререндеры без мемоизации?',
        a: `<p>Двумя структурными приёмами.</p>
        <p><strong>Композиция через children</strong>: если тяжёлое поддерево передано родителю как <code>children</code>, оно создаётся уровнем выше, и при ререндере родителя ссылка на элемент остаётся прежней — поддерево не перерисовывается.</p>
        <p><strong>State colocation</strong>: держать стейт максимально близко к месту использования. Часто «тормозящий список» лечится тем, что состояние поля ввода опускается в само поле, а не живёт в общем родителе.</p>` },

      { id: 'r7',
        q: 'Почему нельзя вызывать хуки в условиях и циклах?',
        a: `<p>React не знает имён хуков — он сопоставляет их между рендерами <strong>по порядку вызова</strong>, храня связный список на fiber-узле. Условный вызов сдвигает порядок, и на следующем рендере состояние одного хука достанется другому.</p>
        <p>Отсюда оба правила: вызывать только на верхнем уровне и только из компонентов или других хуков.</p>` },

      { id: 'r8',
        q: 'Для чего на самом деле нужен useEffect и когда он не нужен?',
        a: `<p>Эффект — это <strong>синхронизация с внешней системой</strong>: подписки, таймеры, ручные манипуляции с DOM, логирование, работа с браузерными API. Это не аналог lifecycle-методов.</p>
        <p>Не нужен, когда значение можно вычислить прямо при рендере (производный стейт), когда логика относится к обработчику события, и когда данные грузит библиотека серверного стейта. «Стейт, синхронизируемый эффектом с другим стейтом» — почти всегда лишний стейт.</p>` },

      { id: 'r9',
        q: 'Какие типичные ошибки бывают в useEffect?',
        a: `<ul>
          <li><strong>Гонка запросов</strong>: быстрые смены зависимости, ответы приходят не в том порядке. Лечится <code>AbortController</code> или флагом отмены в cleanup.</li>
          <li><strong>Нет cleanup</strong> у подписок и таймеров — утечка памяти и обновление размонтированного компонента.</li>
          <li><strong>Объект или функция в зависимостях</strong> — новая ссылка каждый рендер, эффект зацикливается.</li>
          <li><strong>Stale closure</strong> — колбэк захватил старое значение; лечится функциональным апдейтом или ref.</li>
        </ul>` },

      { id: 'r10',
        q: 'Чем useLayoutEffect отличается от useEffect?',
        a: `<p><code>useEffect</code> выполняется асинхронно после отрисовки — пользователь уже видит кадр. <code>useLayoutEffect</code> выполняется синхронно после мутаций DOM, но <strong>до отрисовки</strong>, блокируя её.</p>
        <p>Нужен там, где надо измерить элемент и тут же поправить стиль: позиционирование тултипов, автоскролл, измерение размеров. С обычным эффектом пользователь увидит промежуточный кадр — мигание.</p>` },

      { id: 'r11',
        q: 'Для чего нужен useRef?',
        a: `<p>Мутабельный контейнер, который живёт между рендерами и <strong>не вызывает ререндер</strong> при изменении.</p>
        <p>Кейсы: ссылка на DOM-узел, хранение id таймера или инстанса подписки, «предыдущее значение», обход stale closure, любые значения, нужные логике, но не влияющие на разметку.</p>
        <p>Правило: если значение должно попасть на экран — это стейт, если нет — это ref.</p>` },

      { id: 'r12',
        q: 'Когда обязателен функциональный апдейт setState?',
        a: `<p>Когда новое значение зависит от предыдущего. Из-за батчинга и замыканий несколько вызовов <code>setCount(count + 1)</code> подряд увидят одно и то же старое значение и дадут +1 вместо +3.</p>
        <p><code>setCount(c => c + 1)</code> получает актуальное значение из очереди обновлений. Бонус: колбэк не зависит от переменной из замыкания, значит его можно безопасно вызывать из таймеров и подписок.</p>` },

      { id: 'r13',
        q: 'Почему Context — не стейт-менеджер?',
        a: `<p>Context решает ровно одну задачу — доставку значения вниз без прокидывания пропсов. У него нет ни селекторов, ни сравнения: при смене значения <strong>ререндерятся все потребители</strong>, даже те, кому нужна лишь одна неизменившаяся часть.</p>
        <p>Смягчается разделением контекстов (отдельно данные, отдельно методы — методы стабильны и не вызывают лишних рендеров) и мемоизацией value. Для часто меняющегося состояния берут стор с селекторами.</p>` },

      { id: 'r14',
        q: 'Как выбрать стейт-менеджер?',
        a: `<p>Сначала классифицировать стейт, а не выбирать библиотеку:</p>
        <ul>
          <li><strong>Серверный</strong> (данные с API) — TanStack Query, SWR или RSC: кеш, инвалидация, дедупликация, повторные запросы. Складывать это в Redux — антипаттерн, потому что руками переписывается всё то же самое.</li>
          <li><strong>Клиентский глобальный</strong> (тема, корзина, сессия) — Zustand при небольшом объёме, Redux Toolkit для больших команд и строгих конвенций.</li>
          <li><strong>Локальный</strong> — useState и useReducer.</li>
          <li><strong>URL</strong> — тоже стейт: фильтры, вкладки, пагинация должны переживать перезагрузку и шариться ссылкой.</li>
        </ul>` },

      { id: 'r15',
        q: 'Что такое React Server Components и граница use client?',
        a: `<p>RSC выполняются только на сервере: их код <strong>не попадает в клиентский бандл</strong>, они могут напрямую обращаться к базе или внутреннему API и быть async-функциями. У них нет стейта, эффектов и обработчиков событий.</p>
        <p><code>'use client'</code> отмечает границу: этот модуль и всё, что он импортирует, уезжает в браузер. Серверный компонент может рендерить клиентский и передавать ему сериализуемые пропсы, а также прокидывать серверное поддерево через <code>children</code>.</p>`,
        tip: 'Уточни, что RSC и SSR ортогональны: SSR — это рендер HTML на запрос, RSC — где живёт код компонента и что уезжает в бандл.' },

      { id: 'r16',
        q: 'SSR, SSG, ISR, CSR — как выбрать под задачу?',
        a: `<ul>
          <li><strong>CSR</strong> — рендер в браузере: дёшево, но пустой HTML, плохо для SEO и медленный первый экран.</li>
          <li><strong>SSR</strong> — HTML на каждый запрос: свежие данные и SEO, но нагрузка на сервер и TTFB зависит от бэка.</li>

  { id: 't1', title: 'debounce(fn, ms)', must: true, why: 'Самая частая задача фронтенд-интервью',

            'Для this: возвращаем обычную функцию, внутри setTimeout — стрелку, вызываем через apply.'],
    code: `function debounce(fn, ms) {
  let timer;
  function debounced(...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), ms);
  }
  debounced.cancel = () => clearTimeout(timer);
  return debounced;
}`,
    notes: `<p>Возвращаем <strong>обычную</strong> функцию, чтобы у неё был свой <code>this</code> от места вызова, а внутри <code>setTimeout</code> — <strong>стрелку</strong>, чтобы она этот <code>this</code> унаследовала. В одной маленькой функции обе разновидности использованы осознанно, и про это любят спрашивать.</p>
    <p>Готовься к продолжению: вариант с немедленным первым вызовом (leading edge) и вопрос «чем отличается от throttle».</p>` },

  { id: 't2', title: 'throttle(fn, ms)', must: true, why: 'Идёт в паре с debounce',
    prompt: `<p>Верни функцию, которая вызывает <code>fn</code> не чаще одного раза в <code>ms</code> миллисекунд. Последний вызов внутри окна терять не надо.</p>`,
    hints: ['Запомнить время последнего вызова и сравнивать с текущим.',
            'Если окно ещё не истекло — поставить отложенный вызов на остаток окна, но только один.'],
    code: `function throttle(fn, ms) {
  let lastTime = 0;
  let timer = null;
  return function (...args) {
    const now = Date.now();
    const remaining = ms - (now - lastTime);
    if (remaining <= 0) {
      lastTime = now;
      fn.apply(this, args);
    } else if (!timer) {
      timer = setTimeout(() => {
        lastTime = Date.now();
        timer = null;
        fn.apply(this, args);
      }, remaining);
    }
  };
}`,
    notes: `<p>Простейший вариант без trailing-вызова тоже принимается, но тогда сам скажи, что последний вызов в окне теряется — это ровно тот компромисс, который интервьюер хочет услышать проговорённым.</p>` },

  { id: 't4', title: 'EventEmitter', must: true, why: 'Проверяет структуры данных и работу с подписками',
    prompt: `<p>Класс с методами <code>on</code>, <code>off</code>, <code>once</code>, <code>emit</code>.</p>`,
    hints: ['Map из события в Set колбэков: Set бесплатно даёт удаление и защиту от дублей.',

            'Хороший тон: пусть on возвращает функцию отписки.'],
    code: `class EventEmitter {
  #listeners = new Map();

  on(event, cb) {
    if (!this.#listeners.has(event)) this.#listeners.set(event, new Set());
    this.#listeners.get(event).add(cb);
    return () => this.off(event, cb);
  }

  off(event, cb) {
    this.#listeners.get(event)?.delete(cb);
  }

  once(event, cb) {
    const wrapper = (...args) => { this.off(event, wrapper); cb(...args); };
    this.on(event, wrapper);
  }

  emit(event, ...args) {
    // копия — на случай отписки прямо во время emit
    [...(this.#listeners.get(event) ?? [])].forEach(cb => cb(...args));
  }

  { id: 't5', title: 'deepClone(obj)', must: true, why: 'Классика на рекурсию и edge cases',
    prompt: `<p>Глубокое копирование объекта. Учти массивы, <code>Date</code>, <code>Map</code>, <code>Set</code> и циклические ссылки.</p>`,
    hints: ['Примитивы и null возвращаем как есть — это база рекурсии.',
            'Циклы: WeakMap «оригинал → копия», проверять до обхода полей.',
            'Копию класть в WeakMap ДО рекурсивного обхода, иначе цикл всё равно зациклится.'],
    code: `function deepClone(value, seen = new WeakMap()) {
  if (value === null || typeof value !== 'object') return value;
  if (seen.has(value)) return seen.get(value);
  if (value instanceof Date) return new Date(value);

  if (value instanceof Map) {
    const m = new Map(); seen.set(value, m);
    value.forEach((v, k) => m.set(deepClone(k, seen), deepClone(v, seen)));
    return m;
  }
  if (value instanceof Set) {
    const s = new Set(); seen.set(value, s);
    value.forEach(v => s.add(deepClone(v, seen)));
    return s;
  }

  const result = Array.isArray(value) ? [] : {};
  seen.set(value, result);
  for (const key of Object.keys(value)) {
    result[key] = deepClone(value[key], seen);
  }
  return result;
}`,

    <p>Для функции одного объектного аргумента изящнее <code>WeakMap</code>: кеш не мешает сборке мусора.</p>` },

  { id: 't9', title: 'curry(fn)', must: false, why: 'Проверяет понимание arity и замыканий',
    prompt: `<p>Сделай так, чтобы <code>curry(sum)(1)(2)(3)</code> и <code>curry(sum)(1, 2)(3)</code> давали одинаковый результат.</p>`,
    hints: ['fn.length — объявленная арность функции.',
            'Пока аргументов меньше — возвращаем функцию, накапливающую их дальше.'],
    code: `function curry(fn) {
  return function curried(...args) {
    if (args.length >= fn.length) return fn.apply(this, args);
    return (...next) => curried.apply(this, [...args, ...next]);
  };
}`,
    notes: `<p>Ограничение, которое стоит назвать самому: <code>fn.length</code> не считает параметры со значениями по умолчанию и rest-параметр, поэтому для таких функций каррирование по арности не работает.</p>` },

  { id: 't10', title: 'Function.prototype.bind своими руками', must: false, why: 'Глубокая проверка this',
    prompt: `<p>Реализуй <code>myBind</code> с поддержкой частичного применения аргументов.</p>`,
    hints: ['Сохранить исходную функцию в переменную — this внутри метода и есть она.',
            'Связанные аргументы идут перед аргументами вызова.'],
    code: `Function.prototype.myBind = function (ctx, ...bound) {
  const fn = this;
  return function (...args) {
    // при вызове через new контекст должен игнорироваться
    const isNew = this instanceof fn;
    return fn.apply(isNew ? this : ctx, [...bound, ...args]);
  };
};`,
    notes: `<p>Проверка на <code>new</code> — необязательная часть, но именно она показывает, что ты понимаешь настоящую семантику <code>bind</code>, а не просто заучил обёртку над <code>apply</code>.</p>` },

  { id: 't11', title: 'LRU-кеш', must: false, why: 'Единственный «алгоритм», который реально спрашивают фронтендам',
    prompt: `<p>Кеш фиксированной ёмкости: <code>get</code> и <code>put</code> за O(1). При переполнении вытесняется наименее недавно использованный элемент.</p>`,
    hints: ['Map хранит порядок вставки — это и есть порядок свежести.',
            'get должен переставлять элемент в конец: delete + set.',
            'Самый старый ключ — первый: map.keys().next().value.'],
    code: `class LRUCache {
  constructor(capacity) {
    this.capacity = capacity;
    this.map = new Map();
  }

  get(key) {
    if (!this.map.has(key)) return -1;
    const value = this.map.get(key);
    this.map.delete(key);
    this.map.set(key, value);   // переставить в конец = освежить
    return value;
  }

  put(key, value) {
    if (this.map.has(key)) {
      this.map.delete(key);
    } else if (this.map.size >= this.capacity) {
      this.map.delete(this.map.keys().next().value);  // вытеснить самый старый
    }
    this.map.set(key, value);
  }
}`,
    notes: `<p>Классическое решение — двусвязный список плюс хеш-таблица. Скажи, что знаешь его, но <code>Map</code> в JS уже даёт нужный порядок, поэтому городить список незачем.</p>` },

  { id: 't12', title: 'useDebounce и usePrevious', must: true, why: 'Кастомные хуки спрашивают почти всегда',
    prompt: `<p>Напиши хук, возвращающий значение с задержкой, и хук, возвращающий значение из предыдущего рендера.</p>`,
    hints: ['Вся суть useDebounce — в cleanup: он отменяет предыдущий таймер.',
            'usePrevious: ref обновляется в эффекте, то есть уже после рендера, поэтому во время рендера в нём лежит прошлое значение.'],
    code: `function useDebounce(value, ms) {
  const [debounced, setDebounced] = useState(value);
  useEffect(() => {
    const timer = setTimeout(() => setDebounced(value), ms);
    return () => clearTimeout(timer);
  }, [value, ms]);
  return debounced;
}

function usePrevious(value) {
  const ref = useRef();
  useEffect(() => { ref.current = value; });  // после рендера
  return ref.current;                         // значение прошлого рендера
}`,
    notes: `<p>В <code>usePrevious</code> у эффекта намеренно нет массива зависимостей — он должен срабатывать после каждого рендера.</p>` },

  { id: 't13', title: 'useFetch с отменой', must: true, why: 'Проверяет гонки запросов и cleanup',
    prompt: `<p>Хук загрузки данных: состояния загрузки, успеха и ошибки, отмена при размонтировании и при смене URL.</p>`,
    hints: ['AbortController создаётся внутри эффекта, abort вызывается в cleanup.',
            'AbortError нужно отфильтровать — это не ошибка загрузки, а наша собственная отмена.',
            'fetch не бросает на 4xx и 5xx — проверять res.ok вручную.'],
    code: `function useFetch(url) {
  const [state, setState] = useState({ status: 'loading', data: null, error: null });

  useEffect(() => {
    const controller = new AbortController();
    setState({ status: 'loading', data: null, error: null });

    fetch(url, { signal: controller.signal })
      .then((res) => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then((data) => setState({ status: 'success', data, error: null }))
      .catch((error) => {
        if (error.name !== 'AbortError') {
          setState({ status: 'error', data: null, error });
        }
      });

    return () => controller.abort();
  }, [url]);

  return state;
}`,
    notes: `<p>Два момента, за которые здесь и ставят балл: <code>fetch</code> реджектится только на сетевой ошибке, поэтому <code>res.ok</code> проверяем сами; и отмена в cleanup решает не только утечку, но и гонку — ответ на старый URL не затрёт новый.</p>
    <p>Финальная реплика: в продакшене это TanStack Query, а не свой хук — там уже есть кеш, дедупликация и повторы.</p>` },

  { id: 't14', title: 'Компонент Autocomplete', must: true, why: 'Собеседование целиком в одной задаче',
    prompt: `<p>Поле ввода с подсказками: дебаунс запроса, отмена предыдущего, навигация с клавиатуры, состояния загрузки и пустого результата.</p>`,
    hints: ['Собери из готовых кусков: useDebounce плюс эффект с AbortController.',
            'Клавиатура: ArrowUp / ArrowDown двигают активный индекс, Enter выбирает, Escape закрывает.',
            'Не забудь про доступность — это отличает senior-ответ.'],
    code: `function Autocomplete({ search, onSelect }) {
  const [query, setQuery] = useState('');
  const [items, setItems] = useState([]);
  const [active, setActive] = useState(-1);
  const debouncedQuery = useDebounce(query, 300);

  useEffect(() => {
    if (debouncedQuery.length < 2) { setItems([]); return; }
    const controller = new AbortController();
    search(debouncedQuery, controller.signal)
      .then((res) => { setItems(res); setActive(-1); })
      .catch((e) => { if (e.name !== 'AbortError') setItems([]); });
    return () => controller.abort();
  }, [debouncedQuery, search]);

  function onKeyDown(e) {
    if (e.key === 'ArrowDown') setActive((i) => Math.min(i + 1, items.length - 1));
    if (e.key === 'ArrowUp')   setActive((i) => Math.max(i - 1, 0));
    if (e.key === 'Enter' && items[active]) onSelect(items[active]);
    if (e.key === 'Escape') setItems([]);
  }

  return (
    <div role="combobox" aria-expanded={items.length > 0}>
      <input
        value={query}
        onChange={(e) => setQuery(e.target.value)}
        onKeyDown={onKeyDown}
        aria-activedescendant={active >= 0 ? 'opt-' + active : undefined}
      />
      <ul role="listbox">
        {items.map((item, i) => (
          <li
            key={item.id}
            id={'opt-' + i}
            role="option"
            aria-selected={i === active}
            onMouseDown={() => onSelect(item)}
          >
            {item.label}
          </li>
        ))}
      </ul>
    </div>
  );
}`,
    notes: `<p>Проговори улучшения, даже если не успел их написать: кеш «запрос → результаты», минимальная длина запроса, подсветка совпадения, состояния «ничего не найдено» и «ошибка», <code>onMouseDown</code> вместо <code>onClick</code> (иначе blur закроет список раньше выбора).</p>` },

  { id: 't15', title: 'flatten, chunk, groupBy', must: false, why: 'Разминочные задачи, должны занимать минуту',
    prompt: `<p>Три маленькие утилиты: развернуть вложенный массив на заданную глубину, разбить массив на куски по N, сгруппировать элементы по ключу.</p>`,
    hints: ['flatten проще всего через reduce с рекурсией.',
            'chunk — Array.from по числу кусков плюс slice.',
            'groupBy — reduce с накоплением в объект.'],
    code: `const flatten = (arr, depth = 1) =>
  depth <= 0
    ? arr.slice()
    : arr.reduce((acc, item) =>
        acc.concat(Array.isArray(item) ? flatten(item, depth - 1) : item), []);

const chunk = (arr, size) =>
  Array.from({ length: Math.ceil(arr.length / size) }, (_, i) =>
    arr.slice(i * size, i * size + size));

const groupBy = (arr, keyFn) =>
  arr.reduce((acc, item) => {
    const key = keyFn(item);
    (acc[key] ??= []).push(item);
    return acc;
  }, {});`,
    notes: `<p>На глубоко вложенных структурах рекурсия может переполнить стек — если спросят, покажи итеративный вариант flatten через стек и <code>pop</code>.</p>` },
];

/* ══ RESEARCH DATA ════════════════════════════════════════════
   Ниже сборщик (build.js) подставляет колоды, собранные из
   реальных банков вопросов. Без сборки приложение работает на
   базовом наборе — каждая вставка защищена typeof-проверкой. */

/*__RESEARCH_DATA__*/

/*__SANDBOX__*/

function mergeCards(deckId, cards) {
  if (!cards || !cards.length) return;
  const deck = DECKS.find(d => d.id === deckId);
  if (deck) deck.cards = deck.cards.concat(cards);
}

if (typeof DECK_JS_EXTRA    !== 'undefined') mergeCards('js',    DECK_JS_EXTRA);
if (typeof DECK_TS_EXTRA    !== 'undefined') mergeCards('ts',    DECK_TS_EXTRA);
if (typeof DECK_REACT_EXTRA !== 'undefined') mergeCards('react', DECK_REACT_EXTRA);
if (typeof DECK_WEB_EXTRA   !== 'undefined') mergeCards('web',   DECK_WEB_EXTRA);
if (typeof DECK_SD_EXTRA    !== 'undefined') mergeCards('sd',    DECK_SD_EXTRA);
if (typeof DECK_BEH_EXTRA   !== 'undefined') mergeCards('beh',   DECK_BEH_EXTRA);

if (typeof DECK_CSS !== 'undefined' && DECK_CSS.length) {
  const at = DECKS.findIndex(d => d.id === 'react') + 1;
  DECKS.splice(at, 0, {
    id: 'css',
    title: 'CSS и вёрстка',
    sub: 'Каскад, flex и grid, современный CSS, доступность.',
    cards: DECK_CSS,
  });
}

if (typeof TASKS_EXTRA !== 'undefined') TASKS.push(...TASKS_EXTRA);

/* Категории для задач из базового набора — у поздних есть своё поле cat */
const LEGACY_TASK_CAT = {
  t1: 'Утилиты', t2: 'Утилиты', t3: 'Асинхронность', t4: 'Утилиты', t5: 'Данные',
  t6: 'Асинхронность', t7: 'Асинхронность', t8: 'Утилиты', t9: 'Утилиты', t10: 'Утилиты',
  t11: 'Данные', t12: 'React', t13: 'React', t14: 'React', t15: 'Данные',
};
const taskCat = (task) => task.cat || LEGACY_TASK_CAT[task.id] || 'Утилиты';

/* ══ STATE ════════════════════════════════════════════════════ */

const STORAGE_KEY = 'fe-trainer-v1';
const ALL_CARDS = DECKS.flatMap(d => d.cards.map(c => ({ ...c, deck: d.id, deckTitle: d.title })));

let progress = {};          // cardId -> 'known' | 'review'
let taskCode = {};          // taskId -> код, написанный пользователем
let taskSolved = {};        // taskId -> true, когда все проверки прошли
let progressUpdatedAt = 0;
let db = null;

const ui = {
  view: 'dash',             // dash | cards | code | mock
  deck: 'js',
  index: 0,
  revealed: false,
  filter: 'all',            // all | new | review
  query: '',                // поиск по вопросам колоды
  drafts: {},               // черновики свободных ответов по карточкам
  task: null,
  cat: 'all',               // фильтр категорий в лайвкодинге
  mock: null,               // активная сессия мок-интервью
  mockDeck: 'all',
  mockSize: 10,
};

/* ── Persistence: localStorage always, db when the viewer grants it ── */

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    progress = parsed.progress || {};
    taskCode = parsed.taskCode || {};
    taskSolved = parsed.taskSolved || {};
    progressUpdatedAt = parsed.updatedAt || 0;
  } catch (e) { /* приватный режим или испорченные данные — начинаем с чистого листа */ }
}

function saveLocal() {
  try {
    localStorage.setItem(STORAGE_KEY,
      JSON.stringify({ progress, taskCode, taskSolved, updatedAt: progressUpdatedAt }));
  } catch (e) { /* запись недоступна — прогресс живёт только в этой вкладке */ }
}

let pushTimer = null;
function pushRemote() {
  if (!db) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => {
    db.doc('progress/state').set({ progress, taskCode, taskSolved, updatedAt: progressUpdatedAt })
      .then(() => setSync('синхронизировано'))
      .catch(() => setSync('локально'));
  }, 600);
}

function setSync(text) {
  const el = document.getElementById('syncState');
  if (el) el.textContent = text;
}

async function initRemote() {
  let cap = null;
  try {
    cap = window.claude && window.claude.use ? await window.claude.use('db') : null;
  } catch (e) { cap = null; }
  if (!cap) { setSync('локально'); return; }
  db = cap;
  try {
    const snap = await db.doc('progress/state').get();
    if (snap.exists) {
      const remote = snap.data() || {};
      if ((remote.updatedAt || 0) > progressUpdatedAt) {
        progress = remote.progress || {};
        taskCode = remote.taskCode || {};
        taskSolved = remote.taskSolved || {};
        progressUpdatedAt = remote.updatedAt || 0;
        saveLocal();
        render();
      } else if (progressUpdatedAt > (remote.updatedAt || 0)) {
        pushRemote();
      }
    } else if (progressUpdatedAt > 0) {
      pushRemote();
    }
    setSync('синхронизировано');
  } catch (e) {
    setSync('локально');
  }
}

function setStatus(cardId, status) {
  if (status === null) delete progress[cardId];
  else progress[cardId] = status;
  progressUpdatedAt = Date.now();
  saveLocal();
  pushRemote();
}

/* ── Derived stats ── */

function deckStats(deck) {
  const total = deck.cards.length;
  let known = 0, review = 0;
  for (const card of deck.cards) {
    if (progress[card.id] === 'known') known++;
    else if (progress[card.id] === 'review') review++;
  }
  return { total, known, review, pct: total ? Math.round((known / total) * 100) : 0 };
}

function overallStats() {
  const total = ALL_CARDS.length;
  let known = 0, review = 0;
  for (const card of ALL_CARDS) {
    if (progress[card.id] === 'known') known++;
    else if (progress[card.id] === 'review') review++;
  }
  return { total, known, review, pct: total ? Math.round((known / total) * 100) : 0 };
}

function visibleCards() {
  const deck = DECKS.find(d => d.id === ui.deck);
  if (!deck) return [];
  let cards = deck.cards;
  if (ui.filter === 'new')    cards = cards.filter(c => !progress[c.id]);
  if (ui.filter === 'review') cards = cards.filter(c => progress[c.id] === 'review');
  const query = ui.query.trim().toLowerCase();
  if (query) {
    cards = cards.filter(c =>
      c.q.toLowerCase().includes(query) || c.a.toLowerCase().includes(query));
  }
  return cards;
}

/* ══ RENDER ═══════════════════════════════════════════════════ */

const NAV = [
  { id: 'dash', label: 'Обзор' },
  { id: 'cards', label: 'Карточки' },
  { id: 'code', label: 'Лайвкодинг' },
  { id: 'mock', label: 'Мок-интервью' },
];

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function codeBlock(source) {
  const pre = el('pre');
  const code = el('code');
  code.textContent = source;          // textContent — код не интерпретируется как разметка
  pre.appendChild(code);
  return pre;
}

function renderNav() {
  const nav = document.getElementById('nav');
  nav.textContent = '';
  for (const item of NAV) {
    const btn = el('button', null, item.label);
    btn.setAttribute('aria-current', String(ui.view === item.id));
    btn.addEventListener('click', () => { ui.view = item.id; ui.task = null; render(); });
    nav.appendChild(btn);
  }
}

function renderHeaderProgress() {
  const s = overallStats();
  document.getElementById('overallPct').textContent = s.pct + '%';
  document.getElementById('overallBar').style.width = s.pct + '%';
}

/* ── Dashboard ── */

function viewDash() {
  const wrap = document.createDocumentFragment();
  const s = overallStats();

  wrap.appendChild(el('div', 'eyebrow', 'Подготовка к собеседованию'));

  const h1 = el('h1');
  h1.innerHTML = 'Senior Frontend<br><b>за шесть дней</b>';
  wrap.appendChild(h1);

  wrap.appendChild(el('p', 'lede',
    'Тренажёр по материалам подготовки: ' + ALL_CARDS.length + ' карточек с вопросами уровня сеньора и ' +
    TASKS.length + ' задач на лайвкодинг с разбором. Отвечай вслух, потом сверяйся — на интервью проваливаются на формулировках, а не на знаниях.'));

  const solvedCount = TASKS.filter(t => taskSolved[t.id]).length;
  const withTests = typeof TASK_TESTS !== 'undefined'
    ? TASKS.filter(t => TASK_TESTS[t.id]).length : 0;

  const stats = el('div', 'stat-row');
  const cells = [
    { n: s.known + ' / ' + s.total, l: 'Знаю уверенно', cls: 'is-known' },
    { n: String(s.review), l: 'На повтор', cls: 'is-review' },
    { n: solvedCount + ' / ' + (withTests || TASKS.length), l: 'Задач решено', cls: solvedCount ? 'is-known' : '' },
    { n: s.pct + '%', l: 'Общий прогресс', cls: '' },
  ];
  for (const c of cells) {
    const cell = el('div', 'stat' + (c.cls ? ' ' + c.cls : ''));
    cell.appendChild(el('div', 'n', c.n));
    cell.appendChild(el('div', 'l', c.l));
    stats.appendChild(cell);
  }
  wrap.appendChild(stats);

  const grid = el('div', 'deck-grid');
  for (const deck of DECKS) {
    const st = deckStats(deck);
    const card = el('button', 'deck-card');
    card.appendChild(el('div', 'title', deck.title));
    card.appendChild(el('div', 'sub', deck.sub));

    const foot = el('div', 'foot');
    foot.appendChild(el('span', null, st.known + ' из ' + st.total));
    foot.appendChild(el('span', 'pct', st.pct + '%'));
    card.appendChild(foot);

    const bar = el('div', 'bar');
    const fill = el('i');
    fill.style.width = st.pct + '%';
    bar.appendChild(fill);
    card.appendChild(bar);

    card.addEventListener('click', () => {
      ui.view = 'cards'; ui.deck = deck.id; ui.index = 0;
      ui.revealed = false; ui.filter = 'all';
      render();
    });
    grid.appendChild(card);
  }
  wrap.appendChild(grid);

  const plan = el('section', 'plan');
  const planHead = el('div', 'eyebrow', 'План интенсива');
  planHead.style.marginBottom = '8px';
  plan.insertBefore(planHead, plan.firstChild);
  for (const day of PLAN) {

}

function viewCards() {
  const wrap = document.createDocumentFragment();
  const deck = DECKS.find(d => d.id === ui.deck);

  wrap.appendChild(el('div', 'eyebrow', 'Карточки'));
  wrap.appendChild(el('h2', null, deck.title));

  const chips = el('div', 'chips');
  for (const d of DECKS) {
    const st = deckStats(d);
    const chip = el('button', 'chip');
    chip.appendChild(document.createTextNode(d.title));
    chip.appendChild(el('span', 'cnt', st.known + '/' + st.total));
    chip.setAttribute('aria-pressed', String(d.id === ui.deck));
    chip.addEventListener('click', () => {
      ui.deck = d.id; ui.index = 0; ui.revealed = false; render();
    });
    chips.appendChild(chip);
  }
  wrap.appendChild(chips);

  const filters = el('div', 'chips');
  const filterDefs = [
    { id: 'all', label: 'Все' },
    { id: 'new', label: 'Не пройдено' },
    { id: 'review', label: 'На повтор' },
  ];
  for (const f of filterDefs) {
    const chip = el('button', 'chip', f.label);
    chip.setAttribute('aria-pressed', String(f.id === ui.filter));
    chip.addEventListener('click', () => {
      ui.filter = f.id; ui.index = 0; ui.revealed = false; render();
    });
    filters.appendChild(chip);
  }

  const search = el('input', 'search');
  search.type = 'search';
  search.id = 'deckSearch';
  search.placeholder = 'Поиск по колоде';
  search.value = ui.query;
  search.setAttribute('aria-label', 'Поиск по вопросам колоды');
  search.addEventListener('input', () => {
    ui.query = search.value;
    ui.index = 0;
    ui.revealed = false;
    ui.focusSearch = true;
    render();
  });
  filters.appendChild(search);
  wrap.appendChild(filters);

  const cards = visibleCards();
  if (cards.length === 0) {
    const empty = el('div', 'card-shell');
    const inner = el('div', 'empty');
    inner.appendChild(el('h3', null, 'Здесь пусто'));
    inner.appendChild(el('p', null,
      ui.filter === 'review'
        ? 'Ни одна карточка этой колоды не отмечена на повтор.'
        : 'Все карточки этой колоды пройдены. Переключись на «Все», чтобы повторить.'));
    empty.appendChild(inner);
    wrap.appendChild(empty);
    return wrap;
  }

  if (ui.index >= cards.length) ui.index = 0;
  const card = cards[ui.index];
  wrap.appendChild(renderCard(card, cards.length, ui.index, () => {
    ui.index = (ui.index + 1) % cards.length;
    ui.revealed = false;
  }));
  return wrap;
}

function renderCard(card, total, index, advance, grade) {
  const shell = el('div', 'card-shell');

  const head = el('div', 'card-head');
  head.appendChild(el('span', null, card.deckTitle || DECKS.find(d => d.id === ui.deck).title));
  const status = progress[card.id];
  if (status === 'known')  head.appendChild(el('span', 'tag tag-known', 'Знаю'));
  if (status === 'review') head.appendChild(el('span', 'tag tag-review', 'На повтор'));
  head.appendChild(el('span', 'counter', (index + 1) + ' / ' + total));
  shell.appendChild(head);

  const body = el('div', 'card-body');
  body.appendChild(el('div', 'q', card.q));

  // Сначала сформулируй сам, потом сверяйся с эталоном — иначе тренировки не выходит
  if (sampleReady && !ui.revealed) {
    body.appendChild(buildAnswerBox(card, (score) => {
      setStatus(card.id, score >= 4 ? 'known' : 'review');
      renderHeaderProgress();
    }));
  }

  if (ui.revealed) {
    const answer = el('div', 'answer');
    answer.innerHTML = card.a;
    body.appendChild(answer);
    if (card.code) body.appendChild(codeBlock(card.code));
    if (card.tip) {
      const tip = el('div', 'tip');
      tip.appendChild(el('span', 'lbl', 'Что добавит очков'));
      const p = el('p');
      p.textContent = card.tip;
      tip.appendChild(p);
      body.appendChild(tip);
    }
  }
  shell.appendChild(body);

  const actions = el('div', 'card-actions');
  if (!ui.revealed) {
    const reveal = el('button', 'pill pill-primary', 'Показать ответ');
    reveal.addEventListener('click', () => { ui.revealed = true; render(); });
    actions.appendChild(reveal);
    actions.appendChild(el('span', 'spacer'));
  } else {
    const apply = (status) => {
      if (grade) grade(status);
      else { setStatus(card.id, status); advance(); }
      render();
    };
    const review = el('button', 'pill pill-review', 'Повторить');
    review.addEventListener('click', () => apply('review'));
    const known = el('button', 'pill pill-known', 'Знаю');
    known.addEventListener('click', () => apply('known'));
    actions.appendChild(review);
    actions.appendChild(known);
    actions.appendChild(el('span', 'spacer'));
  }

  if (advance) {
    const skip = el('button', 'ghost', 'Дальше →');
    skip.addEventListener('click', () => { advance(); render(); });
    actions.appendChild(skip);
  }
  shell.appendChild(actions);

  return shell;
}

let samplePromise = null;      // ленивое подключение возможности «спросить Claude»
let sampleReady = false;

function getSample() {
  if (!samplePromise) {
    samplePromise = (window.claude && window.claude.use)
      ? window.claude.use('sample').catch(() => null)
      : Promise.resolve(null);
    samplePromise.then((cap) => {
      // Блок свободного ответа появляется только когда возможность реально есть
      if (cap && !sampleReady) { sampleReady = true; render(); }
    });
  }
  return samplePromise;
}

const stripTags = (html) => html
  .replace(/<li>/g, '\n— ')
  .replace(/<\/p>|<br\s*\/?>/g, '\n')
  .replace(/<[^>]+>/g, '')
  .replace(/\n{2,}/g, '\n')
  .trim();

function gradePrompt(card, answer) {
  return [
    'Ты — технический интервьюер, который ведёт секцию по фронтенду на позицию senior.',
    'Оцени ответ кандидата на вопрос. Будь требовательным, но справедливым: это подготовка,',
    'и кандидату полезнее честная критика, чем похвала.',
    '',
    'ВОПРОС:',
    card.q,
    '',
    'ЭТАЛОННЫЙ ОТВЕТ (то, что рассчитывает услышать интервьюер):',
    stripTags(card.a),
    card.tip ? '\nНЮАНС, ДОБАВЛЯЮЩИЙ ОЧКОВ:\n' + card.tip : '',
    '',
    'ОТВЕТ КАНДИДАТА:',
    answer,
    '',
    'Верни СТРОГО JSON без разметки и пояснений вокруг, со структурой:',
    '{',
    '  "score": число от 0 до 5,',
    '  "verdict": "одна фраза: прошёл бы такой ответ на собеседовании или нет",',
    '  "correct": ["что кандидат назвал верно"],',
    '  "missing": ["что существенное упущено"],',
    '  "wrong": ["где ошибка или неточная формулировка"],',
    '  "phrasing": "как то же самое сформулировал бы сильный сеньор, 2-3 предложения"',
    '}',
    '',
    'Шкала: 5 — полный ответ с нюансами; 4 — верно, но без глубины; 3 — суть уловил,',
    'есть пробелы; 2 — поверхностно; 1 — почти мимо; 0 — неверно или пусто.',
    'Массивы могут быть пустыми. Пиши по-русски, кратко и по делу, без воды и без похвал.',

function renderGrade(container, grade) {
  container.textContent = '';

  const head = el('div', 'grade-head');
  const score = el('div', 'grade-score', String(grade.score));
  score.classList.add(grade.score >= 4 ? 'is-good' : grade.score >= 3 ? 'is-mid' : 'is-bad');
  head.appendChild(score);
  const verdict = el('div');
  verdict.appendChild(el('div', 'grade-scale', 'из 5'));
  verdict.appendChild(el('div', 'grade-verdict', grade.verdict || ''));
  head.appendChild(verdict);
  container.appendChild(head);

  const groups = [
    ['Названо верно', grade.correct, 'is-good'],
    ['Упущено', grade.missing, 'is-mid'],
    ['Неточно или неверно', grade.wrong, 'is-bad'],
  ];
  for (const [title, items, cls] of groups) {
    if (!Array.isArray(items) || !items.length) continue;
    const block = el('div', 'grade-block ' + cls);
    block.appendChild(el('div', 'grade-block-title', title));
    const list = el('ul');
    for (const item of items) list.appendChild(el('li', null, String(item)));
    block.appendChild(list);
    container.appendChild(block);
  }

  if (grade.phrasing) {
    const block = el('div', 'grade-phrasing');
    block.appendChild(el('div', 'grade-block-title', 'Как сказал бы сеньор'));
    block.appendChild(el('p', null, String(grade.phrasing)));

}

/** Поле свободного ответа с проверкой через Claude */
function buildAnswerBox(card, onGraded) {
  const wrap = el('section', 'answer-box');

  const head = el('div', 'answer-box-head');
  head.appendChild(el('span', 'eyebrow-plain', 'Ответь своими словами'));
  head.appendChild(el('span', 'answer-hint', 'проверит Claude по критериям карточки'));
  wrap.appendChild(head);

  const field = el('textarea', 'answer-field');
  field.rows = 5;
  field.placeholder = 'Отвечай так, как сказал бы вслух на интервью…';
  field.value = ui.drafts[card.id] || '';
  field.addEventListener('input', () => { ui.drafts[card.id] = field.value; });
  wrap.appendChild(field);

  const actions = el('div', 'answer-actions');
  const checkBtn = el('button', 'pill pill-primary', 'Проверить ответ');
  actions.appendChild(checkBtn);
  actions.appendChild(el('span', 'spacer'));
  wrap.appendChild(actions);

    result.textContent = '';

      const sample = await getSample();

      const grade = await sample.json(gradePrompt(card, answer), { modelTier: 'default' });
      renderGrade(result, grade);

    } catch (error) {
      result.textContent = '';
      const box = el('div', 'run-error');

      box.appendChild(el('p', null, String((error && error.message) || error)));
      result.appendChild(box);

    checkBtn.textContent = 'Проверить ещё раз';

  return wrap;
}
