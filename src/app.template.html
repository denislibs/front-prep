/* Частота вопроса на интервью: 3 — почти всегда, 2 — регулярно, 1 — редко.
   Внутри колоды карточки идут от частых к редким, чтобы за неделю до
   собеседования учить сначала то, что действительно спросят. Сортировка
   устойчивая: внутри одной частоты исходный порядок сохраняется. */
const FREQ_LABEL = { 3: 'Спрашивают часто', 2: 'Регулярно', 1: 'Редкий вопрос' };

if (typeof FREQUENCY !== 'undefined') {
  for (const deck of DECKS) {
    deck.cards.forEach((card, i) => {
      card.freq = FREQUENCY[card.id] || 2;
      card.order = i;
    });
    deck.cards.sort((a, b) => b.freq - a.freq || a.order - b.order);
  }
}

/* ── Persistence: localStorage always, db when the viewer grants it ── */

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    progress = parsed.progress || {};
    taskCode = parsed.taskCode || {};
    taskSolved = parsed.taskSolved || {};
    stories = parsed.stories || {};
    progressUpdatedAt = parsed.updatedAt || 0;
  } catch (e) { /* приватный режим или испорченные данные — начинаем с чистого листа */ }
}

function saveLocal() {
  try {
    localStorage.setItem(STORAGE_KEY,
      JSON.stringify({ progress, taskCode, taskSolved, stories, updatedAt: progressUpdatedAt }));
  } catch (e) { /* запись недоступна — прогресс живёт только в этой вкладке */ }
}

let storySaveTimer = null;
function scheduleStorySave() {
  clearTimeout(storySaveTimer);
  storySaveTimer = setTimeout(() => {
    progressUpdatedAt = Date.now();
    saveLocal();
    pushRemote();
  }, 800);
}

let pushTimer = null;
function pushRemote() {
  if (!db) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => {
    db.doc('progress/state').set({ progress, taskCode, taskSolved, stories, updatedAt: progressUpdatedAt })
      .then(() => setSync('синхронизировано'))
      .catch(() => setSync('локально'));
  }, 600);
}

function setSync(text) {
  const el = document.getElementById('syncState');
  if (el) el.textContent = text;
}

async function initRemote() {
  let cap = null;
  try {
    cap = window.claude && window.claude.use ? await window.claude.use('db') : null;
  } catch (e) { cap = null; }
  if (!cap) { setSync('локально'); return; }
  db = cap;
  try {
    const snap = await db.doc('progress/state').get();
    if (snap.exists) {
      const remote = snap.data() || {};
      if ((remote.updatedAt || 0) > progressUpdatedAt) {
        progress = remote.progress || {};
        taskCode = remote.taskCode || {};
        taskSolved = remote.taskSolved || {};
        stories = remote.stories || {};
        progressUpdatedAt = remote.updatedAt || 0;
        saveLocal();
        render();
      } else if (progressUpdatedAt > (remote.updatedAt || 0)) {
        pushRemote();
      }
    } else if (progressUpdatedAt > 0) {
      pushRemote();
    }
    setSync('синхронизировано');
  } catch (e) {
    setSync('локально');
  }
}

function setStatus(cardId, status) {
  if (status === null) delete progress[cardId];
  else progress[cardId] = status;
  progressUpdatedAt = Date.now();
  saveLocal();
  pushRemote();
}

/* ── Derived stats ── */

function deckStats(deck) {
  const total = deck.cards.length;
  let known = 0, review = 0;
  for (const card of deck.cards) {
    if (progress[card.id] === 'known') known++;
    else if (progress[card.id] === 'review') review++;
  }
  return { total, known, review, pct: total ? Math.round((known / total) * 100) : 0 };
}

function overallStats() {
  const total = ALL_CARDS.length;
  let known = 0, review = 0;
  for (const card of ALL_CARDS) {
    if (progress[card.id] === 'known') known++;
    else if (progress[card.id] === 'review') review++;
  }
  return { total, known, review, pct: total ? Math.round((known / total) * 100) : 0 };
}

function visibleCards() {
  const deck = DECKS.find(d => d.id === ui.deck);
  if (!deck) return [];
  let cards = deck.cards;
  if (ui.filter === 'new')    cards = cards.filter(c => !progress[c.id]);
  if (ui.filter === 'review') cards = cards.filter(c => progress[c.id] === 'review');
  if (ui.filter === 'often')  cards = cards.filter(c => c.freq === 3);
  const query = ui.query.trim().toLowerCase();
  if (query) {
    cards = cards.filter(c =>
      c.q.toLowerCase().includes(query) || c.a.toLowerCase().includes(query));
  }
  return cards;
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

/**
 * Вопрос ссылается на код? Тогда сниппет показываем сразу, а не после ответа.
 * Явное поле snippet у карточки всегда важнее этой эвристики.
 */
const CODE_QUESTION = /что (выведет|вернёт|напечатает|покажет|произойдёт)|этот код|код ниже|следующий код|порядок вывода|в каком порядке|что не так с этим|найди ошибк/i;
const mentionsCode = (question) => CODE_QUESTION.test(question);

/**
 * Подсветка статических блоков кода тем же парсером, что и в редакторе.
 * Разбираем один раз и раскладываем по span-ам с классами tok-*, а не поднимаем
 * экземпляр редактора на каждый фрагмент — их на странице бывают десятки.
 */
function highlightInto(container, source) {
  const ready = typeof CM !== 'undefined' && CM.highlightTree && CM.jsxLanguage;
  if (!ready) {
    container.textContent = source;   // пока без подсветки, но читаемо
    ensureEditor();                   // подъедет в фоне и перерисует
    return;
  }

  let cursor = 0;
  const append = (text, className) => {
    if (!text) return;
    if (className) {
      const span = document.createElement('span');
      span.className = className;
      span.textContent = text;
      container.appendChild(span);
    } else {
      container.appendChild(document.createTextNode(text));
    }
  };

  try {
    const tree = CM.jsxLanguage.parser.parse(source);
    CM.highlightTree(tree, CM.classHighlighter, (from, to, classes) => {
      append(source.slice(cursor, from), null);   // промежуток без токена
      append(source.slice(from, to), classes);
      cursor = to;
    });
  } catch (e) {
    container.textContent = source;               // разбор не удался — отдаём как есть
    return;
  }
  append(source.slice(cursor), null);
}

function codeBlock(source) {
  const pre = el('pre');
  const code = el('code');
  highlightInto(code, source);
  pre.appendChild(code);
  return pre;
}

function renderNav() {
  const nav = document.getElementById('nav');
  nav.textContent = '';
  for (const item of NAV) {
    const btn = el('button', null, item.label);
    btn.setAttribute('aria-current', String(ui.view === item.id));
    btn.addEventListener('click', () => {
      ui.view = item.id;
      ui.task = null;
      if (item.id !== 'quiz') ui.quiz = null;
      render();
    });
    nav.appendChild(btn);
  }
}

/**

 * вместо «вот 440 карточек, разбирайся».
 * Приоритет: сначала то, что отмечено на повтор, потом непройденные
 * частые вопросы, дальше редкие.
 */
function buildSession() {
  const all = DECKS.flatMap(d => d.cards.map(c => ({ ...c, deck: d.id, deckTitle: d.title })));
  const weight = (c) => (progress[c.id] === 'review' ? 100 : 0) + (c.freq || 2) * 10;

  const pending = all
    .filter(c => progress[c.id] !== 'known')
    .sort((a, b) => weight(b) - weight(a));

  const unsolved = TASKS.filter(t => !taskSolved[t.id] &&
    (typeof TASK_TESTS !== 'undefined' && TASK_TESTS[t.id]));

  return {
    cards: pending.slice(0, 8),
    review: pending.filter(c => progress[c.id] === 'review').length,
    tasks: unsolved.filter(t => t.must).slice(0, 2),
    quizDeck: pending.length ? pending[0].deck : 'all',
  };
}

function renderSession(wrap) {
  const plan = buildSession();
  if (!plan.cards.length && !plan.tasks.length) return;

  const head = el('div', 'eyebrow', 'Что делать сейчас');
  head.style.marginTop = '48px';
  wrap.appendChild(head);

  const note = el('p', 'session-note');
  note.textContent = plan.review
    ? 'Начни с того, что отмечено на повтор — таких вопросов ' + plan.review +
      '. Дальше идут частые из непройденных.'
    : 'Вопросы отсортированы по частоте: сверху то, что спрашивают почти на каждом интервью.';
  wrap.appendChild(note);

  const grid = el('div', 'session');

  const cardsBox = el('button', 'session-card');
  cardsBox.appendChild(el('div', 'session-kicker', 'Карточки'));
  cardsBox.appendChild(el('div', 'session-n', String(plan.cards.length)));
  cardsBox.appendChild(el('div', 'session-what', plan.cards[0]
    ? 'Начать с: ' + plan.cards[0].q.slice(0, 64) : ''));
  cardsBox.addEventListener('click', () => {
    const card = plan.cards[0];
    ui.view = 'cards'; ui.deck = card.deck; ui.filter = 'all'; ui.query = '';
    ui.listMode = false; ui.revealed = false;
    const deck = DECKS.find(d => d.id === card.deck);
    ui.index = Math.max(0, deck.cards.findIndex(c => c.id === card.id));
    render();
  });
  grid.appendChild(cardsBox);

  if (plan.tasks.length) {
    const taskBox = el('button', 'session-card');
    taskBox.appendChild(el('div', 'session-kicker', 'Задача руками'));
    taskBox.appendChild(el('div', 'session-n', String(plan.tasks.length)));
    taskBox.appendChild(el('div', 'session-what', plan.tasks[0].title));
    taskBox.addEventListener('click', () => {
      ui.view = 'code'; ui.task = plan.tasks[0].id; render();
    });
    grid.appendChild(taskBox);
  }

  if (typeof QUIZ !== 'undefined' && QUIZ.length) {
    const quizBox = el('button', 'session-card');
    quizBox.appendChild(el('div', 'session-kicker', 'Тест на проверку'));
    quizBox.appendChild(el('div', 'session-n', '10'));
    quizBox.appendChild(el('div', 'session-what', 'Вопросы вперемешку, ошибки уйдут на повтор'));
    quizBox.addEventListener('click', () => {
      ui.view = 'quiz'; ui.quizDeck = 'all'; ui.quizSize = 10; ui.quiz = null;
      startQuiz(); render();
    });
    grid.appendChild(quizBox);
  }

  wrap.appendChild(grid);
}

function viewCards() {
  const wrap = document.createDocumentFragment();
  const deck = DECKS.find(d => d.id === ui.deck);

  wrap.appendChild(el('div', 'eyebrow', 'Карточки'));
  wrap.appendChild(el('h2', null, deck.title));

  const chips = el('div', 'chips');
  for (const d of DECKS) {
    const st = deckStats(d);
    const chip = el('button', 'chip');
    chip.appendChild(document.createTextNode(d.title));
    chip.appendChild(el('span', 'cnt', st.known + '/' + st.total));
    chip.setAttribute('aria-pressed', String(d.id === ui.deck));
    chip.addEventListener('click', () => {
      ui.deck = d.id; ui.index = 0; ui.revealed = false; render();
    });
    chips.appendChild(chip);
  }
  wrap.appendChild(chips);

  const filters = el('div', 'chips');
  const filterDefs = [
    { id: 'all', label: 'Все' },
    { id: 'often', label: 'Частые' },
    { id: 'new', label: 'Не пройдено' },
    { id: 'review', label: 'На повтор' },
  ];
  for (const f of filterDefs) {
    const chip = el('button', 'chip', f.label);
    chip.setAttribute('aria-pressed', String(f.id === ui.filter));
    chip.addEventListener('click', () => {
      ui.filter = f.id; ui.index = 0; ui.revealed = false; render();
    });
    filters.appendChild(chip);
  }

  const search = el('input', 'search');
  search.type = 'search';
  search.id = 'deckSearch';
  search.placeholder = 'Поиск по колоде';
  search.value = ui.query;
  search.setAttribute('aria-label', 'Поиск по вопросам колоды');
  search.addEventListener('input', () => {
    ui.query = search.value;
    ui.index = 0;
    ui.revealed = false;
    ui.focusSearch = true;
    render();
  });
  filters.appendChild(search);
  wrap.appendChild(filters);

  const cards = visibleCards();

  // Список вопросов: при 85 карточках в колоде листать по одной бессмысленно
  const modeChips = el('div', 'chips');
  for (const mode of [['card', 'Карточка'], ['list', 'Список']]) {
    const chip = el('button', 'chip', mode[1]);
    chip.setAttribute('aria-pressed', String(ui.listMode === (mode[0] === 'list')));
    chip.addEventListener('click', () => { ui.listMode = mode[0] === 'list'; render(); });
    modeChips.appendChild(chip);
  }
  if (cards.length) {
    modeChips.appendChild(el('span', 'chips-note',
      cards.length + (ui.listMode ? ' вопросов в списке' : ' вопросов в колоде')));
  }
  wrap.appendChild(modeChips);

  if (ui.listMode && cards.length) {
    wrap.appendChild(renderCardList(cards));
    return wrap;
  }

  if (cards.length === 0) {
    const empty = el('div', 'card-shell');
    const inner = el('div', 'empty');
    inner.appendChild(el('h3', null, 'Здесь пусто'));
    inner.appendChild(el('p', null,
      ui.filter === 'review'
        ? 'Ни одна карточка этой колоды не отмечена на повтор.'
        : 'Все карточки этой колоды пройдены. Переключись на «Все», чтобы повторить.'));
    empty.appendChild(inner);
    wrap.appendChild(empty);
    return wrap;
  }

  if (ui.index >= cards.length) ui.index = 0;
  const card = cards[ui.index];
  wrap.appendChild(renderCard(card, cards.length, ui.index, () => {
    ui.index = (ui.index + 1) % cards.length;
    ui.revealed = false;
  }));
  return wrap;
}

/** Список вопросов колоды с переходом к любому из них */
function renderCardList(cards) {
  const list = el('div', 'task-list');

  cards.forEach((card, i) => {
    const status = progress[card.id];
    const row = el('button', 'task-row');

    row.appendChild(status === 'known'
      ? el('span', 'solved', '✓')
      : status === 'review'
        ? el('span', 'to-review', '●')
        : el('span', 'num', String(i + 1).padStart(2, '0')));

    const mid = el('span');
    mid.appendChild(el('span', 'name', card.q));
    const words = card.a.replace(/<[^>]+>/g, ' ').split(/\s+/).filter(Boolean).length;
    mid.appendChild(el('span', 'why',
      (card.snippet ? 'с кодом · ' : '') + 'разбор на ' + words + ' слов'));
    row.appendChild(mid);

    if (card.freq) row.appendChild(el('span', 'freq freq-' + card.freq, FREQ_LABEL[card.freq]));
    row.appendChild(el('span', 'lvl' + (status === 'review' ? ' lvl-review' : ''),
      status === 'known' ? 'Знаю' : status === 'review' ? 'На повтор' : 'Открыть'));

    row.addEventListener('click', () => {
      ui.index = i;
      ui.listMode = false;
      ui.revealed = false;
      render();
    });
    list.appendChild(row);
  });

  return list;
}

function renderCard(card, total, index, advance, grade) {
  const shell = el('div', 'card-shell');

  const head = el('div', 'card-head');
  head.appendChild(el('span', null, card.deckTitle || DECKS.find(d => d.id === ui.deck).title));
  if (card.freq) head.appendChild(el('span', 'freq freq-' + card.freq, FREQ_LABEL[card.freq]));
  const status = progress[card.id];
  if (status === 'known')  head.appendChild(el('span', 'tag tag-known', 'Знаю'));
  if (status === 'review') head.appendChild(el('span', 'tag tag-review', 'На повтор'));
  head.appendChild(el('span', 'counter', (index + 1) + ' / ' + total));
  shell.appendChild(head);

  const body = el('div', 'card-body');
  body.appendChild(el('div', 'q', card.q));

  // Код, на который ссылается сам вопрос, обязан быть виден до ответа —
  // иначе спрашивать «что выведет этот код» попросту не о чем
  const questionCode = card.snippet || (mentionsCode(card.q) ? card.code : null);
  if (questionCode) body.appendChild(codeBlock(questionCode));

  // Сначала сформулируй сам, потом сверяйся с эталоном — иначе тренировки не выходит
  if (sampleReady && !ui.revealed) {
    body.appendChild(buildAnswerBox(card, (score) => {
      setStatus(card.id, score >= 4 ? 'known' : 'review');
      renderHeaderProgress();
    }));
  }

  if (ui.revealed) {
    const answer = el('div', 'answer');
    answer.innerHTML = card.a;
    body.appendChild(answer);
    if (card.code && card.code !== questionCode) body.appendChild(codeBlock(card.code));
    if (card.tip) {
      const tip = el('div', 'tip');
      tip.appendChild(el('span', 'lbl', 'Что добавит очков'));
      const p = el('p');
      p.textContent = card.tip;
      tip.appendChild(p);
      body.appendChild(tip);
    }
  }
  shell.appendChild(body);

  const actions = el('div', 'card-actions');
  if (!ui.revealed) {
    const reveal = el('button', 'pill pill-primary', 'Показать ответ');
    reveal.addEventListener('click', () => { ui.revealed = true; render(); });
    actions.appendChild(reveal);
    actions.appendChild(el('span', 'spacer'));
  } else {
    const apply = (status) => {
      if (grade) grade(status);
      else { setStatus(card.id, status); advance(); }
      render();
    };
    const review = el('button', 'pill pill-review', 'Повторить');
    review.addEventListener('click', () => apply('review'));
    const known = el('button', 'pill pill-known', 'Знаю');
    known.addEventListener('click', () => apply('known'));
    actions.appendChild(review);
    actions.appendChild(known);
    actions.appendChild(el('span', 'spacer'));
  }

  if (advance) {
    if (ui.view === 'cards') {
    const toList = el('button', 'ghost', '☰ К списку');
    toList.addEventListener('click', () => { ui.listMode = true; render(); });
    actions.appendChild(toList);
  }

  const skip = el('button', 'ghost', 'Дальше →');
    skip.addEventListener('click', () => { advance(); render(); });
    actions.appendChild(skip);
  }

  // Подсказка живёт в панели карточки, а не в полосе поверх страницы:
  // она нужна ровно здесь и не отъедает низ экрана на каждом разделе
  if (ui.view === 'cards' || ui.view === 'mock') {
    actions.appendChild(el('span', 'kbd-hint',
      ui.revealed ? '1 — повторить · 2 — знаю · ← → листать' : 'Space — показать ответ'));
  }
  shell.appendChild(actions);

  return shell;
}

let samplePromise = null;      // ленивое подключение возможности «спросить Claude»
let sampleReady = false;

function getSample() {
  if (!samplePromise) {
    samplePromise = (window.claude && window.claude.use)
      ? window.claude.use('sample').catch(() => null)
      : Promise.resolve(null);
    samplePromise.then((cap) => {
      // Блок свободного ответа появляется только когда возможность реально есть
      if (cap && !sampleReady) { sampleReady = true; render(); }
    });
  }
  return samplePromise;
}

/* ── Ответ голосом ──────────────────────────────────────────────
   Речь распознаёт сам браузер (Web Speech API): в Chrome работает,
   в Safari частично, в Firefox нет. Кнопка появляется только там,
   где API доступен — в остальных случаях остаётся обычный ввод. */

const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
const voiceAvailable = () => Boolean(SpeechRecognitionCtor);

function createDictation(onText, onStop) {
  const recognition = new SpeechRecognitionCtor();
  recognition.lang = 'ru-RU';
  recognition.continuous = true;
  recognition.interimResults = true;

  let settled = '';   // распознанное окончательно, промежуточное дописывается сверху
  recognition.onresult = (event) => {
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const chunk = event.results[i][0].transcript;
      if (event.results[i].isFinal) settled += chunk;
      else interim += chunk;
    }
    onText((settled + interim).trim());
  };
  recognition.onerror = (event) => onStop(event.error);
  recognition.onend = () => onStop(null);

  return {
    start: () => recognition.start(),
    stop: () => recognition.stop(),
    seed: (text) => { settled = text ? text + ' ' : ''; },
  };
}

/** Поле свободного ответа с проверкой через Claude */
function buildAnswerBox(card, onGraded) {
  const wrap = el('section', 'answer-box');

  const head = el('div', 'answer-box-head');
  head.appendChild(el('span', 'eyebrow-plain', 'Ответь своими словами'));
  head.appendChild(el('span', 'answer-hint', 'проверит Claude по критериям карточки'));
  wrap.appendChild(head);

  const field = el('textarea', 'answer-field');
  field.rows = 5;
  field.placeholder = 'Отвечай так, как сказал бы вслух на интервью…';
  field.value = ui.drafts[card.id] || '';
  field.addEventListener('input', () => { ui.drafts[card.id] = field.value; });
  wrap.appendChild(field);

  const actions = el('div', 'answer-actions');
  const checkBtn = el('button', 'pill pill-primary', 'Проверить ответ');
  actions.appendChild(checkBtn);

  // Ответ голосом: на интервью ты говоришь, а не печатаешь, и длина
  // сказанного — отдельная проблема, поэтому рядом идёт секундомер
  if (voiceAvailable()) {
    const micBtn = el('button', 'pill pill-mic', '● Говорить');
    const timerLabel = el('span', 'voice-timer');
    let dictation = null;
    let ticking = null;
    let startedAt = 0;

    const stopDictation = (error) => {
      clearInterval(ticking);
      ticking = null;
      dictation = null;
      micBtn.classList.remove('is-recording');
      micBtn.textContent = '● Говорить';
      if (error && error !== 'aborted' && error !== 'no-speech') {
        timerLabel.textContent = 'микрофон недоступен';
      }
    };

    micBtn.addEventListener('click', () => {
      if (dictation) { dictation.stop(); return; }
      try {
        dictation = createDictation(
          (text) => { field.value = text; ui.drafts[card.id] = text; },
          stopDictation
        );
      } catch (e) {
        timerLabel.textContent = 'распознавание недоступно';
        return;
      }
      dictation.seed(field.value.trim());
      startedAt = Date.now();
      timerLabel.textContent = '0:00';
      ticking = setInterval(() => {
        const sec = Math.floor((Date.now() - startedAt) / 1000);
        timerLabel.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
        timerLabel.classList.toggle('over', sec > 90);
      }, 500);
      micBtn.classList.add('is-recording');
      micBtn.textContent = '■ Стоп';
      dictation.start();
    });

    actions.appendChild(micBtn);
    actions.appendChild(timerLabel);
  }

  actions.appendChild(el('span', 'spacer'));
  wrap.appendChild(actions);

  const result = el('div', 'grade');
  wrap.appendChild(result);

  checkBtn.addEventListener('click', async () => {
    const answer = field.value.trim();
    if (!answer) { field.focus(); return; }

    checkBtn.disabled = true;
    checkBtn.textContent = 'Проверяю…';
    result.textContent = '';
    result.appendChild(el('p', 'grade-waiting', 'Интервьюер читает ответ…'));

    try {
      const sample = await getSample();
      if (!sample) throw new Error('Проверка недоступна в этом окружении');
      const grade = await sample.json(gradePrompt(card, answer), { modelTier: 'default' });
      renderGrade(result, grade);
      if (typeof grade.score === 'number' && onGraded) onGraded(grade.score);
    } catch (error) {
      result.textContent = '';
      const box = el('div', 'run-error');
      box.appendChild(el('div', 'run-error-title', 'Не получилось проверить'));
      box.appendChild(el('p', null, String((error && error.message) || error)));
      result.appendChild(box);
    }

    checkBtn.disabled = false;
    checkBtn.textContent = 'Проверить ещё раз';
  });

  return wrap;
}

/* ── Догрузка тяжёлых библиотек ─────────────────────────────────
   В самодостаточной сборке всё уже внутри страницы и функции ниже
   отдают управление сразу. В сборке для Pages React с транспайлером
   (1.2 МБ) и редактор (400 КБ) лежат отдельными файлами и приезжают
   только когда действительно нужны. */

const lazyLoads = new Map();

function loadScriptOnce(url) {
  if (!lazyLoads.has(url)) {
    lazyLoads.set(url, new Promise((resolve, reject) => {
      const tag = document.createElement('script');
      tag.src = url;
      tag.onload = () => resolve();
      tag.onerror = () => reject(new Error('Не удалось загрузить ' + url));
      document.head.appendChild(tag);
    }));
  }
  return lazyLoads.get(url);
}

const lazyAssets = () => (typeof LAZY_ASSETS !== 'undefined' ? LAZY_ASSETS : null);

/** React и транспайлер JSX — нужны только задачам с DOM и React */
async function ensureSandboxLibs() {
  if (SANDBOX_SOURCES.react) return true;
  const assets = lazyAssets();
  if (!assets) return false;
  await loadScriptOnce(assets.sandbox);
  return Boolean(SANDBOX_SOURCES.react);
}

/** Редактор кода; он же даёт подсветку статических блоков */
let editorLoading = null;
function ensureEditor() {
  if (typeof CM !== 'undefined') return Promise.resolve(true);
  const assets = lazyAssets();
  if (!assets) return Promise.resolve(false);
  if (!editorLoading) {
    // После загрузки перерисовываем: уже показанный код получит подсветку
    editorLoading = loadScriptOnce(assets.editor).then(() => { render(); return true; },
                                                       () => false);
  }
  return editorLoading;
}

/* ── Редактор кода ──────────────────────────────────────────── */

let editor = null;          // текущий экземпляр CodeMirror
let running = false;

/** Тема редактора живёт на CSS-переменных приложения, поэтому светлая и тёмная работают сами */
function editorTheme() {
  const { EditorView, HighlightStyle, syntaxHighlighting, tags } = CM;
  const theme = EditorView.theme({
    '&': { backgroundColor: 'var(--code-bg)', color: 'var(--code-ink)', fontSize: '13px' },
    '.cm-content': { fontFamily: 'var(--mono)', padding: '14px 0', caretColor: 'var(--accent)' },
    '.cm-gutters': {
      backgroundColor: 'var(--code-bg)', color: 'var(--muted)',
      border: 'none', borderRight: '1px solid var(--line)', fontFamily: 'var(--mono)',
    },
    '.cm-activeLine': { backgroundColor: 'var(--accent-soft)' },
    '.cm-activeLineGutter': { backgroundColor: 'transparent', color: 'var(--ink)' },
    '.cm-cursor': { borderLeftColor: 'var(--accent)' },
    '&.cm-focused': { outline: 'none' },
    '.cm-selectionBackground, ::selection': { backgroundColor: 'var(--accent-soft)' },
    '.cm-scroller': { lineHeight: '1.6' },
  });

  const highlight = HighlightStyle.define([
    { tag: tags.keyword, color: 'var(--syn-keyword)' },
    { tag: [tags.string, tags.special(tags.string)], color: 'var(--syn-string)' },
    { tag: [tags.number, tags.bool, tags.null], color: 'var(--syn-number)' },
    { tag: tags.comment, color: 'var(--syn-comment)', fontStyle: 'italic' },
    { tag: [tags.function(tags.variableName), tags.function(tags.propertyName)], color: 'var(--syn-func)' },
    { tag: [tags.propertyName, tags.attributeName], color: 'var(--syn-prop)' },
    { tag: [tags.typeName, tags.className, tags.tagName], color: 'var(--syn-type)' },
    { tag: tags.operator, color: 'var(--syn-op)' },
  ]);

  return [theme, syntaxHighlighting(highlight)];
}

function createEditor(parent, initial, onRun) {
  const {
    EditorView, EditorState, keymap, lineNumbers, highlightActiveLine,
    defaultKeymap, indentWithTab, history, historyKeymap, javascript,
    bracketMatching, indentUnit, closeBrackets, closeBracketsKeymap,
  } = CM;

  const runKeymap = keymap.of([{
    key: 'Mod-Enter',
    run: () => { onRun(); return true; },
  }]);

  return new EditorView({
    parent,
    state: EditorState.create({
      doc: initial,
      extensions: [
        lineNumbers(),
        highlightActiveLine(),
        history(),
        bracketMatching(),
        closeBrackets(),
        indentUnit.of('  '),
        javascript({ jsx: true }),
        runKeymap,
        keymap.of([...closeBracketsKeymap, ...defaultKeymap, ...historyKeymap, indentWithTab]),
        editorTheme(),
        EditorView.lineWrapping,
      ],
    }),
  });
}

function renderResults(container, payload) {
  container.textContent = '';

  if (!payload.ok) {
    const box = el('div', 'run-error');
    box.appendChild(el('div', 'run-error-title', 'Не удалось выполнить'));
    box.appendChild(el('p', null, payload.error));
    container.appendChild(box);
    return;
  }

  const results = payload.results;
  const passed = results.filter(r => r.passed).length;
  const allPassed = passed === results.length;

  const summary = el('div', 'run-summary' + (allPassed ? ' is-pass' : ''));
  summary.appendChild(el('span', 'run-count', passed + ' из ' + results.length));
  summary.appendChild(el('span', 'run-label',
    allPassed ? 'все проверки пройдены' : 'проверок пройдено'));
  container.appendChild(summary);

  for (const result of results) {
    const row = el('div', 'check' + (result.passed ? ' is-pass' : ' is-fail'));
    const head = el('div', 'check-head');
    head.appendChild(el('span', 'check-mark', result.passed ? '✓' : '✗'));
    head.appendChild(el('span', 'check-name', result.name));
    row.appendChild(head);

    if (!result.passed) {
      row.appendChild(el('p', 'check-error', result.error));
      if (result.hasDiff) {
        const diff = el('div', 'check-diff');
        const got = el('div');
        got.appendChild(el('span', 'diff-label', 'получено'));
        got.appendChild(el('code', null, result.actual));
        const want = el('div');
        want.appendChild(el('span', 'diff-label', 'ожидалось'));
        want.appendChild(el('code', null, result.expected));
        diff.appendChild(got);
        diff.appendChild(want);
        row.appendChild(diff);
      }
    }

    if (result.logs && result.logs.length) {
      const logs = el('pre', 'check-logs');
      logs.textContent = result.logs.join('\n');
      row.appendChild(logs);
    }
    container.appendChild(row);
  }
}

/** Рабочее место: редактор, кнопки запуска и панель результатов */
function buildWorkbench(task, suite, interview) {
  const wrap = el('section', 'workbench');

  /* Строка вкладки — как в редакторе: имя файла и среда исполнения */
  const head = el('div', 'workbench-head');
  const tab = el('span', 'file-tab');
  tab.textContent = task.id + (suite.env === 'react' ? '.jsx' : '.js');
  head.appendChild(tab);
  const envLabel = { worker: 'JavaScript', dom: 'DOM', react: 'React' }[suite.env] || suite.env;
  head.appendChild(el('span', 'env-tag', envLabel));
  head.appendChild(el('span', 'spacer'));

  const fullBtn = el('button', 'icon-btn', 'Развернуть');
  fullBtn.title = 'Редактор во весь экран';
  fullBtn.addEventListener('click', () => {
    const on = wrap.classList.toggle('is-full');
    document.body.classList.toggle('ws-locked', on);
    fullBtn.textContent = on ? 'Свернуть' : 'Развернуть';
    if (editor) editor.requestMeasure();
  });
  head.appendChild(fullBtn);
  wrap.appendChild(head);

  const host = el('div', 'editor-host');
  wrap.appendChild(host);

  /* Тянущаяся граница: высоту редактора подбираешь под задачу */
  const grip = el('div', 'editor-grip');
  grip.title = 'Потяни, чтобы изменить высоту редактора';
  grip.addEventListener('pointerdown', (event) => {
    event.preventDefault();
    grip.setPointerCapture(event.pointerId);
    const startY = event.clientY;
    const startH = host.getBoundingClientRect().height;
    const move = (e) => {
      host.style.height = Math.max(180, Math.min(900, startH + e.clientY - startY)) + 'px';
      if (editor) editor.requestMeasure();
    };
    const up = () => {
      grip.removeEventListener('pointermove', move);
      grip.removeEventListener('pointerup', up);
    };
    grip.addEventListener('pointermove', move);
    grip.addEventListener('pointerup', up);
  });
  wrap.appendChild(grip);

  const output = el('div', 'run-output');

  const actions = el('div', 'workbench-actions');
  const runBtn = el('button', 'pill pill-primary', 'Запустить проверки');
  const resetBtn = el('button', 'ghost', 'Сбросить');
  actions.appendChild(runBtn);
  actions.appendChild(resetBtn);
  actions.appendChild(el('span', 'spacer'));
  actions.appendChild(el('span', 'kbd-hint', 'Ctrl/Cmd + Enter'));
  wrap.appendChild(actions);

  /* В режиме обучения проверки видно заранее — понятно, что от тебя хотят.
     В режиме интервью их нет: на секции список тестов тебе тоже не покажут. */
  if (!interview) {
    const preview = el('div', 'cases-preview');
    preview.appendChild(el('span', 'eyebrow-plain', 'Что проверяем'));
    const list = el('ol', 'cases-list');
    for (const testCase of suite.cases) list.appendChild(el('li', null, testCase.name));
    preview.appendChild(list);
    wrap.appendChild(preview);
  } else {
    output.appendChild(el('p', 'run-idle', 'Проверки скрыты. Запусти — и увидишь, что не сошлось.'));
  }
  wrap.appendChild(output);

  async function run() {
    if (running || !editor) return;
    running = true;
    runBtn.textContent = 'Выполняется…';
    runBtn.disabled = true;
    output.textContent = '';

    const code = editor.state.doc.toString();
    taskCode[task.id] = code;
    progressUpdatedAt = Date.now();
    saveLocal();
    pushRemote();

    let payload;
    try {
      payload = await SANDBOX.run(code, suite);
    } catch (error) {
      payload = { ok: false, error: String((error && error.message) || error) };
    }

    renderResults(output, payload);

    const solved = payload.ok && payload.results.every(r => r.passed);
    if (solved && !taskSolved[task.id]) {
      taskSolved[task.id] = true;
      progressUpdatedAt = Date.now();
      saveLocal();
      pushRemote();
      renderHeaderProgress();
      tab.classList.add('is-solved');
    }

    running = false;
    runBtn.textContent = 'Запустить';
    runBtn.disabled = false;
  }

  runBtn.addEventListener('click', run);
  resetBtn.addEventListener('click', () => {
    if (!editor) return;
    editor.dispatch({
      changes: { from: 0, to: editor.state.doc.length, insert: suite.starter || '' },
    });
    output.textContent = '';
    editor.focus();
  });

  // CodeMirror монтируется после вставки в документ — иначе он не измерит себя
  // Редактор монтируется после вставки в документ и после загрузки библиотеки:
  // иначе он не измерит себя, а в разделённой сборке его ещё может не быть
  ensureEditor().then(() => {
    if (!host.isConnected || typeof CM === 'undefined') return;
    if (editor) { editor.destroy(); editor = null; }
    editor = createEditor(host, taskCode[task.id] || suite.starter || '', run);
  });

  return wrap;
}

/* ── Рабочее место для задачи ────────────────────────────────────
   Два режима. В режиме интервью условие свёрнуто в одну строку,
   проверки скрыты до запуска, подсказки за кнопкой со счётчиком,
   а сверху идёт таймер — так, как это происходит на секции.
   В режиме обучения всё открыто: условие рядом, проверки видно
   заранее, подсказки под рукой. */

function viewTask(task) {
  const wrap = document.createDocumentFragment();
  const suite = typeof TASK_TESTS !== 'undefined' ? TASK_TESTS[task.id] : null;
  const interview = ui.codeMode === 'interview';

  /* Шапка: назад, название, режим, таймер */
  const bar = el('div', 'ws-bar');

  const back = el('button', 'ghost', '← Задачи');
  back.addEventListener('click', () => { stopTaskTimer(); ui.task = null; render(); });
  bar.appendChild(back);

  const title = el('div', 'ws-title');
  title.appendChild(el('span', 'ws-name', task.title));
  const meta = el('span', 'ws-meta');
  meta.textContent = taskCat(task) + (suite ? ' · ' + suite.cases.length + ' проверок' : '');
  title.appendChild(meta);
  bar.appendChild(title);

  if (taskSolved[task.id]) bar.appendChild(el('span', 'tag tag-known', 'Решено'));

  const modes = el('div', 'ws-modes');
  for (const mode of [['interview', 'Интервью'], ['learn', 'Обучение']]) {
    const chip = el('button', 'chip', mode[1]);
    chip.setAttribute('aria-pressed', String(ui.codeMode === mode[0]));
    chip.addEventListener('click', () => {
      ui.codeMode = mode[0];
      try { localStorage.setItem(CODE_MODE_KEY, mode[0]); } catch (e) { /* приватный режим */ }
      render();
    });
    modes.appendChild(chip);
  }
  bar.appendChild(modes);

  if (interview) {
    const timer = el('div', 'ws-timer');
    timer.id = 'taskTimer';
    timer.textContent = '0:00';
    bar.appendChild(timer);
  }
  wrap.appendChild(bar);

  /* Условие: развёрнутое в обучении, свёрнутое на интервью */
  const brief = el('details', 'ws-brief');
  brief.open = !interview;
  const summary = el('summary', null, interview ? 'Условие задачи' : 'Условие');
  brief.appendChild(summary);
  const prompt = el('div', 'task-body');
  prompt.innerHTML = task.prompt;
  brief.appendChild(prompt);
  wrap.appendChild(brief);

  /* Рабочая область */
  if (suite) {
    wrap.appendChild(buildWorkbench(task, suite, interview));
  } else {
    const empty = el('p', 'hint', 'Для этой задачи автотестов пока нет — решай в редакторе на своей стороне.');
    wrap.appendChild(empty);
  }

  /* Подсказки: на интервью открываются по одной и это видно */
  const hintsBox = el('section', 'ws-hints');
  const opened = ui.hintsOpen[task.id] || 0;
  const hintsHead = el('div', 'ws-hints-head');
  hintsHead.appendChild(el('span', 'eyebrow-plain', 'Подсказки'));
  hintsHead.appendChild(el('span', 'ws-hints-count', opened + ' из ' + task.hints.length));
  hintsBox.appendChild(hintsHead);

  for (let i = 0; i < Math.min(opened, task.hints.length); i++) {
    hintsBox.appendChild(el('p', 'hint', task.hints[i]));
  }
  if (opened < task.hints.length) {
    const more = el('button', 'ghost', opened ? 'Ещё подсказку' : 'Открыть подсказку');
    more.addEventListener('click', () => {
      ui.hintsOpen[task.id] = opened + 1;
      render();
    });
    hintsBox.appendChild(more);
  }
  wrap.appendChild(hintsBox);

  /* Решение — всегда под замком раскрытия */
  const details = el('details', 'solution');
  details.appendChild(el('summary', null, 'Показать решение'));
  const solutionBody = el('div');
  solutionBody.appendChild(codeBlock(task.code));
  const notes = el('div', 'task-body');
  notes.innerHTML = task.notes;
  solutionBody.appendChild(notes);
  details.appendChild(solutionBody);
  wrap.appendChild(details);

  if (interview) startTaskTimer(task.id);
  return wrap;
}

let taskTimerHandle = null;
let taskStartedAt = 0;
let taskTimerFor = null;

function startTaskTimer(taskId) {
  // Перерисовка не сбрасывает счёт, переход к другой задаче — сбрасывает
  if (taskTimerHandle && taskTimerFor === taskId) return;
  stopTaskTimer();
  taskTimerFor = taskId;
  taskStartedAt = Date.now();
  taskTimerHandle = setInterval(() => {
    const node = document.getElementById('taskTimer');
    if (!node) return;
    const sec = Math.floor((Date.now() - taskStartedAt) / 1000);
    node.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    // Двадцать пять минут — типичный лимит на задачу в реальной секции
    node.classList.toggle('over', sec > 25 * 60);
  }, 500);
}

function stopTaskTimer() {
  clearInterval(taskTimerHandle);
  taskTimerHandle = null;
  taskTimerFor = null;
}

/* ── Livecoding ── */

function viewCode() {
  const wrap = document.createDocumentFragment();

  if (ui.task) {
    return viewTask(TASKS.find(t => t.id === ui.task));
  }

  wrap.appendChild(el('div', 'eyebrow', 'Лайвкодинг'));
  wrap.appendChild(el('h2', null, 'Задачи с разбором'));
  wrap.appendChild(el('p', 'lede',
    'Пиши решение в редакторе и запускай — автотесты покажут, что именно не работает. Сначала решай сам и проговаривай ход мысли вслух: если не помнишь готовое решение, раскладывай задачу на требования, «нужно отложить вызов — значит setTimeout» уже даёт половину ответа.'));

  const cats = ['all', ...new Set(TASKS.map(taskCat))];
  const catChips = el('div', 'chips');
  for (const cat of cats) {
    const count = cat === 'all' ? TASKS.length : TASKS.filter(t => taskCat(t) === cat).length;
    const chip = el('button', 'chip');
    chip.appendChild(document.createTextNode(cat === 'all' ? 'Все' : cat));
    chip.appendChild(el('span', 'cnt', String(count)));
    chip.setAttribute('aria-pressed', String(cat === ui.cat));
    chip.addEventListener('click', () => { ui.cat = cat; render(); });
    catChips.appendChild(chip);
  }
  wrap.appendChild(catChips);

  const shown = ui.cat === 'all' ? TASKS : TASKS.filter(t => taskCat(t) === ui.cat);
  const list = el('div', 'task-list');
  shown.forEach((task, i) => {
    const row = el('button', 'task-row');
    row.appendChild(taskSolved[task.id]
      ? el('span', 'solved', '✓')
      : el('span', 'num', String(i + 1).padStart(2, '0')));

    const mid = el('span');
    mid.appendChild(el('span', 'name', task.title));
    const hasTests = typeof TASK_TESTS !== 'undefined' && TASK_TESTS[task.id];
    mid.appendChild(el('span', 'why',
      hasTests ? task.why + ' · ' + TASK_TESTS[task.id].cases.length + ' автотестов' : task.why));
    row.appendChild(mid);

    row.appendChild(el('span', 'lvl' + (task.must ? ' lvl-must' : ''), task.must ? 'Обязательно' : 'Полезно'));
    row.addEventListener('click', () => { ui.task = task.id; render(); });
    list.appendChild(row);
  });
  wrap.appendChild(list);
  return wrap;
}

/* ── Свои истории для поведенческой секции ──────────────────────
   Шесть историй закрывают почти все поведенческие вопросы. Колода
   даёт каркас, но отвечать придётся своим опытом — поэтому здесь он
   и живёт: пишешь, проверяешь через Claude, репетируешь вслух. */

const STORY_SLOTS = [
  { id: 'hard', title: 'Сложная техническая задача',
    hint: 'Самое трудное, что делал. Заодно закрывает вопрос «проект, которым гордишься».' },
  { id: 'conflict', title: 'Конфликт или несогласие',
    hint: 'Спор по техрешению: как аргументировал, чем кончилось. Важно уважение к оппоненту и данные вместо эмоций.' },
  { id: 'fail', title: 'Провал или ошибка',
    hint: 'Уронил прод, ошибся в оценке, выбрал не ту технологию. Главное — что изменил в процессе после этого.' },
  { id: 'mentor', title: 'Менторство и влияние',
    hint: 'Растил джуна, внедрил процесс, улучшил жизнь команде. Влияние за пределами своего кода.' },

    hint: 'Улучшил что-то без указания сверху, с обоснованием ценности для бизнеса.' },
];

const STORY_FIELDS = [
  { id: 's', label: 'Ситуация', hint: 'Контекст в двух предложениях: где, когда, что за продукт.' },
  { id: 't', label: 'Задача', hint: 'Что нужно было сделать и почему это была твоя ответственность.' },
  { id: 'a', label: 'Действия', hint: 'Что сделал именно ты. «Я», а не «мы». Это самая длинная часть.' },
  { id: 'r', label: 'Результат', hint: 'Чем кончилось, желательно с цифрами. И чему это тебя научило.' },
];

/** Речь идёт примерно 130 слов в минуту — по объёму видно, уложишься ли */
function storyMinutes(story) {
  const words = STORY_FIELDS
    .map(f => (story[f.id] || '').split(/\s+/).filter(Boolean).length)
    .reduce((a, b) => a + b, 0);
  return { words, minutes: words / 130 };
}

function storyPrompt(slot, story) {
  return [
    'Ты — интервьюер, который ведёт поведенческую секцию на позицию senior frontend.',
    'Кандидат подготовил историю по схеме STAR. Разбери её строго, но по делу.',
    '',

/* ── Тесты с вариантами ответа ──────────────────────────────── */

const quizPool = () => (typeof QUIZ !== 'undefined' ? QUIZ : []);

function startQuiz() {
  const pool = ui.quizDeck === 'all'
    ? quizPool()
    : quizPool().filter(q => q.deck === ui.quizDeck);

  ui.quiz = {
    queue: shuffle(pool).slice(0, ui.quizSize),
    pos: 0,
    picked: null,      // выбранный вариант текущего вопроса, null пока не ответил
    results: [],
    retried: new Set(),
    startedAt: Date.now(),
    done: false,
  };
}

function answerQuiz(index) {
  const session = ui.quiz;
  if (!session || session.picked !== null) return;   // ответ уже дан
  const item = session.queue[session.pos];
  session.picked = index;
  const correct = index === item.correct;
  session.results.push({ item, picked: index, correct });

  // Промах возвращается в конец очереди: вопрос закрыт, только когда отвечен верно
  if (!correct && !session.retried.has(item.id)) {
    session.retried.add(item.id);
    session.queue.push(item);
  }

  // Ошибка в тесте — повод вернуться к карточке, поэтому помечаем на повтор
  if (index !== item.correct && item.cardId) setStatus(item.cardId, 'review');
  renderHeaderProgress();
}

function nextQuiz() {
  const session = ui.quiz;
  if (!session) return;
  session.pos++;
  session.picked = null;
  if (session.pos >= session.queue.length) session.done = true;
}

/** Открыть карточку, на которой основан вопрос теста */
function openCardById(cardId) {
  for (const deck of DECKS) {
    const index = deck.cards.findIndex(c => c.id === cardId);
    if (index < 0) continue;
    ui.view = 'cards';
    ui.deck = deck.id;
    ui.index = index;
    ui.filter = 'all';
    ui.query = '';
    ui.listMode = false;
    ui.revealed = true;
    ui.quiz = null;
    render();
    return true;
  }
  return false;
}

function viewQuiz() {
  const wrap = document.createDocumentFragment();
  wrap.appendChild(el('div', 'eyebrow', 'Тесты'));

  const pool = quizPool();
  if (!pool.length) {
    wrap.appendChild(el('h2', null, 'Тестов пока нет'));
    wrap.appendChild(el('p', 'lede',
      'Файлы с вопросами кладутся в research/quiz-*.js и подхватываются сборкой.'));
    return wrap;
  }

  /* ── Настройка ── */
  if (!ui.quiz) {
    wrap.appendChild(el('h2', null, 'Проверь себя'));
    wrap.appendChild(el('p', 'lede',
      'Вопрос и четыре варианта — здесь нельзя схитрить перед собой, как с карточками. ' +
      'После ответа сразу разбор: почему верный вариант верный и в чём подвох неверного. ' +
      'Ошибся — вопрос из карточки автоматически уходит на повтор.'));

    const decksWithQuiz = [...new Set(pool.map(q => q.deck))];
    wrap.appendChild(el('div', 'field-label', 'Раздел'));
    const deckChips = el('div', 'chips');
    const options = [{ id: 'all', title: 'Все разделы' },
      ...decksWithQuiz.map(id => ({ id, title: (DECKS.find(d => d.id === id) || {}).title || id }))];
    for (const option of options) {
      const count = option.id === 'all' ? pool.length : pool.filter(q => q.deck === option.id).length;
      const chip = el('button', 'chip');
      chip.appendChild(document.createTextNode(option.title));
      chip.appendChild(el('span', 'cnt', String(count)));
      chip.setAttribute('aria-pressed', String(option.id === ui.quizDeck));
      chip.addEventListener('click', () => { ui.quizDeck = option.id; render(); });
      deckChips.appendChild(chip);
    }
    wrap.appendChild(deckChips);

    wrap.appendChild(el('div', 'field-label', 'Сколько вопросов'));
    const sizeChips = el('div', 'chips');
    for (const size of [10, 20, 40]) {
      const chip = el('button', 'chip', String(size));
      chip.setAttribute('aria-pressed', String(size === ui.quizSize));
      chip.addEventListener('click', () => { ui.quizSize = size; render(); });
      sizeChips.appendChild(chip);
    }
    wrap.appendChild(sizeChips);

    const start = el('button', 'pill pill-primary', 'Начать тест');
    start.style.marginTop = '32px';
    start.addEventListener('click', () => { startQuiz(); render(); });
    wrap.appendChild(start);
    return wrap;
  }

  /* ── Итоги ── */
  if (ui.quiz.done) {
    // Считаем по вопросам, а не по попыткам: повторный верный ответ
    // на уже проваленный вопрос не превращает промах в успех
    const first = new Map();
    for (const r of ui.quiz.results) if (!first.has(r.item.id)) first.set(r.item.id, r);
    const attempts = [...first.values()];
    const right = attempts.filter(r => r.correct).length;
    const total = attempts.length;
    const pct = total ? Math.round((right / total) * 100) : 0;
    const wrong = attempts.filter(r => !r.correct);

    wrap.appendChild(el('h2', null, 'Тест пройден'));

    const stats = el('div', 'stat-row');
    for (const cell of [
      { n: right + ' / ' + total, l: 'Верных ответов', cls: pct >= 70 ? 'is-known' : 'is-review' },
      { n: pct + '%', l: 'Результат', cls: '' },
      { n: String(wrong.length), l: 'Ушло на повтор', cls: wrong.length ? 'is-review' : '' },
    ]) {
      const box = el('div', 'stat' + (cell.cls ? ' ' + cell.cls : ''));
      box.appendChild(el('div', 'n', cell.n));
      box.appendChild(el('div', 'l', cell.l));
      stats.appendChild(box);
    }
    wrap.appendChild(stats);

    if (wrong.length) {
      const head = el('div', 'eyebrow', 'Разобрать ошибки');
      head.style.marginTop = '48px';
      wrap.appendChild(head);

      const list = el('div', 'task-list');
      for (const result of wrong) {
        const row = el('button', 'task-row');
        row.appendChild(el('span', 'to-review', '●'));
        const mid = el('span');
        mid.appendChild(el('span', 'name', result.item.q));
        mid.appendChild(el('span', 'why',
          'ты выбрал: ' + result.item.options[result.picked] +
          '  ·  верно: ' + result.item.options[result.item.correct]));
        row.appendChild(mid);
        row.appendChild(el('span', 'lvl', 'К разбору'));
        row.addEventListener('click', () => {
          if (!openCardById(result.item.cardId)) {
            ui.quiz = null;
            render();
          }
        });
        list.appendChild(row);
      }
      wrap.appendChild(list);
    } else {
      wrap.appendChild(el('p', 'lede', 'Ни одной ошибки. Возьми другой раздел или больше вопросов.'));
    }

    const again = el('button', 'pill pill-primary', 'Ещё тест');
    again.style.marginTop = '36px';
    again.addEventListener('click', () => { ui.quiz = null; render(); });
    wrap.appendChild(again);
    return wrap;
  }

  /* ── Вопрос ── */
  const session = ui.quiz;
  const item = session.queue[session.pos];
  const answered = session.picked !== null;

  const head = el('div', 'mock-head');
  head.appendChild(el('div', 'quiz-counter', (session.pos + 1) + ' / ' + session.queue.length));
  const deckTitle = (DECKS.find(d => d.id === item.deck) || {}).title || item.deck;
  head.appendChild(el('div', 'mock-note', deckTitle));
  const stop = el('button', 'ghost', 'Завершить');
  stop.style.marginLeft = 'auto';
  stop.addEventListener('click', () => {
    if (session.results.length) session.done = true;
    else ui.quiz = null;
    render();
  });
  head.appendChild(stop);
  wrap.appendChild(head);

  const bar = el('div', 'bar');
  const fill = el('i');
  fill.style.width = Math.round((session.pos / session.queue.length) * 100) + '%';
  bar.appendChild(fill);
  wrap.appendChild(bar);

  const shell = el('div', 'card-shell');
  const body = el('div', 'card-body');
  body.appendChild(el('div', 'q', item.q));
  if (item.snippet) body.appendChild(codeBlock(item.snippet));

  const optionList = el('div', 'options');
  item.options.forEach((text, i) => {
    const option = el('button', 'option');
    if (answered && i === item.correct) option.classList.add('is-correct');
    if (answered && i === session.picked && !session.results[session.results.length - 1].correct) {
      option.classList.add('is-wrong');
    }
    option.disabled = answered;
    option.appendChild(el('span', 'option-key', String.fromCharCode(65 + i)));
    option.appendChild(el('span', 'option-text', text));
    option.addEventListener('click', () => { answerQuiz(i); render(); });
    optionList.appendChild(option);
  });
  body.appendChild(optionList);

  if (answered) {
    const verdict = session.results[session.results.length - 1].correct;
    const box = el('div', 'quiz-why' + (verdict ? ' is-correct' : ' is-wrong'));
    box.appendChild(el('div', 'quiz-verdict', verdict ? 'Верно' : 'Неверно'));
    const why = el('div', 'answer');
    why.innerHTML = item.why;
    box.appendChild(why);
    body.appendChild(box);
  }
  shell.appendChild(body);

  const actions = el('div', 'card-actions');
  if (answered) {
    const next = el('button', 'pill pill-primary',
      session.pos + 1 >= session.queue.length ? 'Показать итоги' : 'Следующий вопрос');
    next.addEventListener('click', () => { nextQuiz(); render(); });
    actions.appendChild(next);

    if (item.cardId) {
      const toCard = el('button', 'ghost', 'Открыть разбор в карточках');
      toCard.addEventListener('click', () => openCardById(item.cardId));
      actions.appendChild(toCard);
    }
  } else {
    actions.appendChild(el('span', 'kbd-hint', 'Выбери вариант — или нажми 1, 2, 3, 4'));
  }
  actions.appendChild(el('span', 'spacer'));
  shell.appendChild(actions);
  wrap.appendChild(shell);

  return wrap;
}

/* ── Mock interview ── */

function shuffle(items) {
  const copy = items.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function startMock() {
  let pool = ui.mockDeck === 'all'
    ? ALL_CARDS
    : ALL_CARDS.filter(c => c.deck === ui.mockDeck);

  // Сначала то, что ещё не закрыто: непройденное и отмеченное на повтор
  const weak = pool.filter(c => progress[c.id] !== 'known');
  if (weak.length >= ui.mockSize) pool = weak;

  ui.mock = {
    queue: shuffle(pool).slice(0, ui.mockSize),
    pos: 0,
    results: [],
    startedAt: Date.now(),
    questionAt: Date.now(),
    done: false,
  };
  ui.revealed = false;
}

function gradeMock(status) {
  const session = ui.mock;
  if (!session || session.done) return;
  const card = session.queue[session.pos];
  setStatus(card.id, status);
  session.results.push({ card, status, seconds: Math.round((Date.now() - session.questionAt) / 1000) });
  session.pos++;
  if (session.pos >= session.queue.length) {
    session.done = true;
  } else {
    session.questionAt = Date.now();
  }
  ui.revealed = false;
}

    ];

      const cell = el('div', 'stat' + (c.cls ? ' ' + c.cls : ''));
      cell.appendChild(el('div', 'n', c.n));
      cell.appendChild(el('div', 'l', c.l));
      stats.appendChild(cell);
    }
    wrap.appendChild(stats);

    if (review.length) {

        mid.appendChild(el('span', 'why', result.card.deckTitle + ' · ответ занял ' + result.seconds + ' с'));
        row.appendChild(mid);

          ui.deck = result.card.deck;

      const done = el('p', 'lede');
      done.textContent = 'Все вопросы секции закрыты уверенно. Возьми другой раздел или увеличь количество вопросов.';
      wrap.appendChild(done);
    }

    const again = el('button', 'pill pill-primary', 'Ещё секция');
    again.style.marginTop = '36px';
    again.addEventListener('click', () => { ui.mock = null; render(); });
    wrap.appendChild(again);
    return wrap;
  }

  /* ── Идёт сессия ── */
  const session = ui.mock;
  const card = session.queue[session.pos];

  const head = el('div', 'mock-head');
  const timer = el('div', 'timer', '0:00');
  timer.id = 'mockTimer';
  head.appendChild(timer);
  head.appendChild(el('div', 'mock-note',
    'Вопрос ' + (session.pos + 1) + ' из ' + session.queue.length + ' · ' + card.deckTitle));

  const stop = el('button', 'ghost', 'Завершить');
  stop.style.marginLeft = 'auto';
  stop.addEventListener('click', () => {
    if (session.results.length) session.done = true;
    else ui.mock = null;
    render();
  });
  head.appendChild(stop);
  wrap.appendChild(head);

  const bar = el('div', 'bar');
  const fill = el('i');
  fill.style.width = Math.round((session.pos / session.queue.length) * 100) + '%';
  bar.appendChild(fill);
  wrap.appendChild(bar);

  wrap.appendChild(renderCard(card, session.queue.length, session.pos, null, gradeMock));
  return wrap;
}

function tickTimer() {
  const node = document.getElementById('mockTimer');
  if (!node || !ui.mock || ui.mock.done) return;
  const seconds = Math.floor((Date.now() - ui.mock.questionAt) / 1000);
  const mm = Math.floor(seconds / 60);
  const ss = String(seconds % 60).padStart(2, '0');
  node.textContent = mm + ':' + ss;
  node.classList.toggle('over', seconds > 90);
}

/* ── Адресная строка ────────────────────────────────────────────
   Роутинг на хеше, а не на History API: приложение — один статический
   файл на GitHub Pages, и путь вида /cards/js/js2 отдал бы 404 при
   перезагрузке. Хеш работает без серверных правил.
   В адресе стоит id карточки, а не её номер: порядок меняется при
   сортировке по частоте, id — нет, поэтому ссылка не протухает. */

let routeLocked = false;   // защита от эха: мы сами меняем хеш

function routeFor() {
  if (ui.view === 'cards') {
    const deck = DECKS.find(d => d.id === ui.deck);
    const card = deck && visibleCards()[ui.index];
    const tail = ui.listMode ? '/list' : card ? '/' + card.id : '';
    return '#/cards/' + ui.deck + tail;
  }
  if (ui.view === 'code') return '#/code' + (ui.task ? '/' + ui.task : '');
  if (ui.view === 'quiz') return '#/quiz';
  if (ui.view === 'mock') return '#/mock';
  if (ui.view === 'stories') return '#/stories';
  return '#/';
}

function syncUrl() {
  const next = routeFor();
  if (location.hash === next) return;
  routeLocked = true;
  history.replaceState(null, '', next);
  routeLocked = false;
}

/** Восстанавливает состояние из адреса. Возвращает false, если адрес не разобран. */
function applyRoute(hash) {
  const parts = (hash || '').replace(/^#\/?/, '').split('/').filter(Boolean);
  const [section, a, b] = parts;

  if (!section || section === 'dash') { ui.view = 'dash'; return true; }

  if (section === 'cards') {
    ui.view = 'cards';
    if (a && DECKS.some(d => d.id === a)) ui.deck = a;
    ui.listMode = b === 'list';
    ui.revealed = false;
    if (b && b !== 'list') {
      const cards = visibleCards();
      const index = cards.findIndex(c => c.id === b);
      if (index >= 0) ui.index = index;
    }
    return true;
  }

  if (section === 'code') {
    ui.view = 'code';
    ui.task = (a && TASKS.some(t => t.id === a)) ? a : null;
    return true;
  }

  if (['quiz', 'mock', 'stories'].includes(section)) {
    ui.view = section;
    return true;
  }
  return false;
}

window.addEventListener('hashchange', () => {
  if (routeLocked) return;         // хеш поменяли мы сами — перерисовывать нечего
  if (applyRoute(location.hash)) render();
});

function render() {
  renderNav();
  renderHeaderProgress();
  syncUrl();
  // Ушли с задачи — снимаем таймер и полноэкранный режим редактора
  if (ui.view !== 'code' || !ui.task) stopTaskTimer();
  document.body.classList.remove('ws-locked');
  const app = document.getElementById('app');
  app.textContent = '';
  if (ui.view === 'dash')  app.appendChild(viewDash());
  if (ui.view === 'cards') app.appendChild(viewCards());
  if (ui.view === 'code')  app.appendChild(viewCode());
  if (ui.view === 'quiz')  app.appendChild(viewQuiz());
  if (ui.view === 'mock')  app.appendChild(viewMock());
  if (ui.view === 'stories') app.appendChild(viewStories());

  if (ui.focusSearch) {
    ui.focusSearch = false;
    const input = document.getElementById('deckSearch');
    if (input) {
      input.focus();
      const end = input.value.length;
      try { input.setSelectionRange(end, end); } catch (e) { /* не все типы поддерживают каретку */ }
    }
    return;   // при вводе в поиск страницу не прокручиваем
  }
  window.scrollTo({ top: 0, behavior: 'instant' });
  announceView();
}

/**
 * Сообщает скринридеру, что показано сейчас. Без этого смена карточки
 * или вопроса теста проходит для незрячего пользователя молча:
 * содержимое подменилось, но фокус и объявления не сдвинулись.
 */
function announceView() {
  const node = document.getElementById('announcer');
  if (!node) return;
  let message = '';

  if (ui.view === 'cards' && !ui.listMode) {
    const cards = visibleCards();
    const card = cards[ui.index];
    if (card) {
      message = 'Вопрос ' + (ui.index + 1) + ' из ' + cards.length + '. ' + card.q +
        (ui.revealed ? '. Ответ показан.' : '');
    }
  } else if (ui.view === 'quiz' && ui.quiz && !ui.quiz.done) {
    const session = ui.quiz;
    const item = session.queue[session.pos];
    message = 'Вопрос ' + (session.pos + 1) + ' из ' + session.queue.length + '. ' + item.q;
    if (session.picked !== null) {
      const last = session.results[session.results.length - 1];
      message = (last.correct ? 'Верно. ' : 'Неверно. ') + 'Правильный ответ: ' +
        item.options[item.correct] + '.';
    }
  } else {
    const section = NAV.find(n => n.id === ui.view);
    if (section) message = 'Раздел: ' + section.label;
  }

  if (message && node.textContent !== message) node.textContent = message;
}

/* ══ INTERACTION ══════════════════════════════════════════════ */

document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (t && typeof t.matches === 'function' && t.matches('input, textarea')) return;
  // В тесте цифры выбирают вариант, пробел листает дальше
  if (ui.view === 'quiz' && ui.quiz && !ui.quiz.done) {
    const isSpace = e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar';
    if (ui.quiz.picked === null && ['1', '2', '3', '4'].includes(e.key)) {
      answerQuiz(Number(e.key) - 1);
      render();
    } else if (ui.quiz.picked !== null && (isSpace || e.key === 'Enter')) {
      e.preventDefault();
      nextQuiz();
      render();
    }
    return;
  }

  const mockActive = ui.view === 'mock' && ui.mock && !ui.mock.done;
  if (ui.view !== 'cards' && !mockActive) return;
  if (ui.listMode) return;   // в режиме списка карточка не листается

  let card, advance, cards = [];
  if (mockActive) {
    card = ui.mock.queue[ui.mock.pos];
    advance = null;
  } else {
    cards = visibleCards();
    if (!cards.length) return;
    card = cards[ui.index];
    advance = () => { ui.index = (ui.index + 1) % cards.length; ui.revealed = false; };
  }

  const applyGrade = (status) => {
    if (mockActive) gradeMock(status);
    else { setStatus(card.id, status); advance(); }
    render();
  };

  const isSpace = e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar';
  if (isSpace || e.key === 'Enter') {
    e.preventDefault();
    if (!ui.revealed) { ui.revealed = true; render(); }
    else if (advance) { advance(); render(); }
  } else if (e.key === '1' && ui.revealed) {
    applyGrade('review');
  } else if (e.key === '2' && ui.revealed) {
    applyGrade('known');
  } else if (e.key === 'ArrowRight' && advance) {
    advance(); render();
  } else if (e.key === 'ArrowLeft' && advance) {
    ui.index = (ui.index - 1 + cards.length) % cards.length;
    ui.revealed = false;
    render();
  }
});

document.getElementById('themeBtn').addEventListener('click', () => {
  const root = document.documentElement;
  const current = root.getAttribute('data-theme');
  const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const next = current ? (current === 'dark' ? 'light' : 'dark') : (systemDark ? 'light' : 'dark');
  root.setAttribute('data-theme', next);
});

/* ══ BOOT ═════════════════════════════════════════════════════ */

document.documentElement.lang = 'ru';

loadLocal();
applyRoute(location.hash);   // адрес разбираем до первой отрисовки, иначе render его затрёт
render();
getSample();          // если возможность есть, блок свободного ответа появится сам
setSync('локально');
initRemote();
setInterval(tickTimer, 250);
</script>
