<meta charset="utf-8">
<title>Frontend Interview Trainer</title>
<!--__VENDOR__-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,300;0,6..12,400;0,6..12,600;0,6..12,900&family=JetBrains+Mono:wght@400;700&display=swap">

<style>
/* ── Design tokens ─────────────────────────────────────────────
   Palette lifted from epam.com CSS custom properties:
   #000 / #1b1b1b / #231f20 / #eee / #737373 / #bbb / #0047ff
   gradients: #0078c2→#0047ff→#8453d2 (light), #00fff0→#00f6ff→#b896ff (dark)
   Type: museo-sans → Nunito Sans (closest free relative) ───── */

:root {
  --paper:        #ffffff;
  --paper-2:      #f5f5f5;
  --paper-3:      #eeeeee;
  --ink:          #000000;
  --ink-2:        #231f20;
  --muted:        #737373;
  --line:         #d9d9d9;
  --line-2:       #bbbbbb;
  --accent:       #0047ff;
  --accent-soft:  rgba(0, 71, 255, .08);
  --grad:         linear-gradient(90deg, #0078c2 0%, #0047ff 55%, #8453d2 100%);
  --known:        #007a6e;
  --known-bg:     rgba(0, 122, 110, .1);
  --review:       #8a5a00;
  --review-bg:    rgba(255, 192, 0, .18);
  --code-bg:      #f5f5f5;
  --code-ink:     #231f20;
  --shadow:       0 1px 0 rgba(0,0,0,.04);

  --syn-keyword:  #8453d2;
  --syn-string:   #0078c2;
  --syn-number:   #b5480a;
  --syn-comment:  #8a8a8a;
  --syn-func:     #0047ff;
  --syn-prop:     #006b7d;
  --syn-type:     #7a2fb0;
  --syn-op:       #737373;

  --step--1: .78rem;
  --step-0:  1rem;
  --step-1:  1.25rem;
  --step-2:  1.6rem;
  --step-3:  2.2rem;
  --step-4:  3.4rem;

  --sans: museo-sans, "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:        #1b1b1b;
    --paper-2:      #231f20;
    --paper-3:      #2b2728;
    --ink:          #ffffff;
    --ink-2:        #eeeeee;
    --muted:        #9a9a9a;
    --line:         #383536;
    --line-2:       #4a4647;
    --accent:       #76cdd8;
    --accent-soft:  rgba(118, 205, 216, .12);
    --grad:         linear-gradient(90deg, #00fff0 0%, #00f6ff 55%, #b896ff 100%);
    --known:        #4fd6c4;
    --known-bg:     rgba(79, 214, 196, .12);
    --review:       #ffc000;
    --review-bg:    rgba(255, 192, 0, .14);
    --code-bg:      #141313;
    --code-ink:     #eeeeee;
    --shadow:       none;

    --syn-keyword:  #b896ff;
    --syn-string:   #76cdd8;
    --syn-number:   #ffc000;
    --syn-comment:  #6f6a6b;
    --syn-func:     #00f6ff;
    --syn-prop:     #9fd8e0;
    --syn-type:     #d4b3ff;
    --syn-op:       #9a9a9a;
  }
}

:root[data-theme="dark"] {
  --paper:        #1b1b1b;
  --paper-2:      #231f20;
  --paper-3:      #2b2728;
  --ink:          #ffffff;
  --ink-2:        #eeeeee;
  --muted:        #9a9a9a;
  --line:         #383536;
  --line-2:       #4a4647;
  --accent:       #76cdd8;
  --accent-soft:  rgba(118, 205, 216, .12);
  --grad:         linear-gradient(90deg, #00fff0 0%, #00f6ff 55%, #b896ff 100%);
  --known:        #4fd6c4;
  --known-bg:     rgba(79, 214, 196, .12);
  --review:       #ffc000;
  --review-bg:    rgba(255, 192, 0, .14);
  --code-bg:      #141313;
  --code-ink:     #eeeeee;
  --shadow:       none;

  --syn-keyword:  #b896ff;
  --syn-string:   #76cdd8;
  --syn-number:   #ffc000;
  --syn-comment:  #6f6a6b;
  --syn-func:     #00f6ff;
  --syn-prop:     #9fd8e0;
  --syn-type:     #d4b3ff;
  --syn-op:       #9a9a9a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--step-0);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* EPAM signature: gradient hairline pinned to the top of the page */
.topline {
  position: fixed; inset: 0 0 auto 0; height: 3px;
  background: var(--grad); z-index: 60;
}

/* ── Header ─────────────────────────────────────────────────── */
header {
  position: sticky; top: 0; z-index: 50;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  padding: 3px 0 0;
}
.header-inner {
  max-width: 1120px; margin: 0 auto;
  padding: 14px 24px;
  display: flex; align-items: center; gap: 28px; flex-wrap: wrap;
}
.wordmark {
  font-family: var(--mono); font-weight: 700; font-size: 15px;
  letter-spacing: -.02em; white-space: nowrap;
}
.wordmark span { color: var(--muted); }

nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button {
  font-family: var(--sans); font-size: 12px; font-weight: 900;
  letter-spacing: .1em; text-transform: uppercase;
  background: none; border: 0; border-radius: 0;
  color: var(--muted); padding: 8px 12px; cursor: pointer;
  position: relative;
}
nav button:hover { color: var(--ink); }
nav button[aria-current="true"] { color: var(--ink); }
nav button[aria-current="true"]::after {
  content: ""; position: absolute; left: 12px; right: 12px; bottom: 2px;
  height: 2px; background: var(--grad);
}

.header-meta { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.overall {
  display: flex; align-items: center; gap: 10px;
  font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted);
}
.overall .bar { width: 90px; }
.icon-btn {
  background: none; border: 1px solid var(--line-2); color: var(--muted);
  width: 32px; height: 32px; cursor: pointer; font-size: 14px; line-height: 1;
  display: grid; place-items: center; padding: 0;
}
.icon-btn:hover { border-color: var(--ink); color: var(--ink); }

/* ── Layout ─────────────────────────────────────────────────── */
main { max-width: 1120px; margin: 0 auto; padding: 40px 24px 64px; }

.eyebrow {
  font-size: 11px; font-weight: 900; letter-spacing: .16em;
  text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; gap: 10px;
}
.eyebrow::after {
  content: ""; flex: 1; height: 1px; background: var(--line);
}

h1 {
  font-size: var(--step-4); font-weight: 300; line-height: 1.03;
  letter-spacing: -.03em; margin: 18px 0 0; text-wrap: balance;
}
h1 b { font-weight: 900; }
h2 { font-size: var(--step-2); font-weight: 300; letter-spacing: -.02em; margin: 0 0 4px; }
h3 { font-size: var(--step-1); font-weight: 900; margin: 0 0 8px; letter-spacing: -.01em; }

.lede { color: var(--muted); max-width: 62ch; margin: 16px 0 0; font-size: var(--step-1); font-weight: 300; }

/* ── Progress bar ───────────────────────────────────────────── */
.bar { height: 3px; background: var(--line); position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--grad); transition: width .35s ease; }

/* ── Buttons ────────────────────────────────────────────────── */
.pill {
  font-family: var(--sans); font-size: 12px; font-weight: 900;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 13px 26px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line-2); background: transparent; color: var(--ink);
  transition: border-color .15s, background .15s, color .15s;
}
.pill:hover { border-color: var(--ink); }
.pill-primary {
  border: 0; color: #fff; background: var(--grad); position: relative;
}
:root[data-theme="dark"] .pill-primary,
.pill-primary.on-dark { color: #000; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .pill-primary { color: #000; }
}
.pill-primary:hover { filter: brightness(1.08); }
.pill-known { border-color: var(--known); color: var(--known); }
.pill-known:hover { background: var(--known-bg); border-color: var(--known); }
.pill-review { border-color: var(--review); color: var(--review); }
.pill-review:hover { background: var(--review-bg); border-color: var(--review); }
.pill:disabled { opacity: .35; cursor: not-allowed; }

.ghost {
  background: none; border: 0; color: var(--muted); cursor: pointer;
  font-family: var(--sans); font-size: 12px; font-weight: 900;
  letter-spacing: .08em; text-transform: uppercase; padding: 8px 0;
}
.ghost:hover { color: var(--ink); }

:where(button, a, [tabindex]):focus-visible {
  outline: 2px solid var(--accent); outline-offset: 3px;
}

/* ── Dashboard ──────────────────────────────────────────────── */
.deck-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
  gap: 1px; background: var(--line); border: 1px solid var(--line);
  margin-top: 32px;
}
.deck-card {
  background: var(--paper); padding: 22px 20px 18px; cursor: pointer;
  border: 0; text-align: left; font-family: var(--sans); color: var(--ink);
  display: flex; flex-direction: column; gap: 12px; min-height: 150px;
  transition: background .15s;
}
.deck-card:hover { background: var(--paper-2); }
.deck-card .title { font-size: var(--step-1); font-weight: 900; letter-spacing: -.01em; }
.deck-card .sub { font-size: var(--step--1); color: var(--muted); flex: 1; }
.deck-card .foot {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 11px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted);
}
.deck-card .foot .pct { color: var(--ink); font-variant-numeric: tabular-nums; }

.stat-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 40px;
}
.stat { background: var(--paper); padding: 20px; }
.stat .n { font-size: var(--step-3); font-weight: 300; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.stat .l { font-size: 11px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
.stat.is-review .n { color: var(--review); }
.stat.is-known .n { color: var(--known); }

.session-note { color: var(--muted); font-size: var(--step--1); margin: 14px 0 0; max-width: 64ch; }
.session {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 20px;
}
.session-card {
  background: var(--paper); padding: 20px; border: 0; cursor: pointer;
  text-align: left; font-family: var(--sans); color: var(--ink);
  display: flex; flex-direction: column; gap: 8px; transition: background .15s;
}
.session-card:hover { background: var(--paper-2); }
.session-kicker {
  font-size: 11px; font-weight: 900; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted);
}
.session-n {
  font-size: var(--step-3); font-weight: 300; line-height: 1;
  letter-spacing: -.03em; font-variant-numeric: tabular-nums;
}
.session-what { font-size: var(--step--1); color: var(--muted); }

.plan { margin-top: 56px; border-top: 1px solid var(--line); }
.plan-day {
  display: grid; grid-template-columns: 60px 1fr; gap: 20px;
  padding: 18px 0; border-bottom: 1px solid var(--line); align-items: baseline;
}
.plan-day .d {
  font-size: 11px; font-weight: 900; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums;
}
.plan-day .t { font-weight: 900; }
.plan-day .desc { color: var(--muted); font-size: var(--step--1); margin-top: 2px; }

/* ── Card trainer ───────────────────────────────────────────── */
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 24px 0 0; }
.chip {
  font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase;
  padding: 8px 14px; border: 1px solid var(--line-2); background: transparent;
  color: var(--muted); cursor: pointer; font-family: var(--sans); border-radius: 0;
  display: inline-flex; align-items: center; gap: 8px;
}
.chip:hover { border-color: var(--ink); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip .cnt { opacity: .6; font-variant-numeric: tabular-nums; }

.search {
  font-family: var(--sans); font-size: 12px; font-weight: 600;
  letter-spacing: .04em; padding: 8px 14px; min-width: 200px; flex: 1; max-width: 320px;
  border: 1px solid var(--line-2); background: transparent; color: var(--ink);
  border-radius: 0; appearance: none;
}
.search::placeholder { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 900; font-size: 11px; }
.search:focus { outline: none; border-color: var(--accent); }

.card-shell { margin-top: 28px; border: 1px solid var(--line-2); background: var(--paper); }
.card-head {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 14px 24px; border-bottom: 1px solid var(--line);
  font-size: 11px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted);
}
.card-head .counter { margin-left: auto; font-variant-numeric: tabular-nums; }
.tag { padding: 4px 9px; border: 1px solid currentColor; }
.tag-known { color: var(--known); background: var(--known-bg); }
.tag-review { color: var(--review); background: var(--review-bg); }

.card-body { padding: 32px 24px; }
.q {
  font-size: var(--step-2); font-weight: 300; letter-spacing: -.02em;
  line-height: 1.3; max-width: 34ch; text-wrap: balance;
}
.answer { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 24px; max-width: 68ch; }
.answer h4 {
  font-size: 11px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); margin: 26px 0 10px; display: flex; align-items: center; gap: 10px;
}
.answer h4::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.answer h4:first-child { margin-top: 0; }
.answer p { margin: 0 0 14px; }
.answer pre { margin: 16px 0; }
.answer p:last-child { margin-bottom: 0; }
.answer ul, .answer ol { margin: 0 0 14px; padding-left: 20px; }
.answer li { margin-bottom: 7px; }
.answer strong { font-weight: 900; }
.answer code, .tip code, .task-body code {
  font-family: var(--mono); font-size: .86em; background: var(--paper-3);
  padding: 2px 5px; color: var(--code-ink);
}
.tip {
  margin-top: 22px; padding: 16px 18px; background: var(--accent-soft);
  border-left: 3px solid var(--accent); max-width: 68ch;
}
.tip .lbl {
  font-size: 11px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase;
  color: var(--accent); display: block; margin-bottom: 6px;
}
.tip p { margin: 0; font-size: var(--step--1); }

pre {
  background: var(--code-bg); color: var(--code-ink); padding: 18px 20px;
  overflow-x: auto; margin: 0 0 16px; border: 1px solid var(--line);
}
pre code {
  font-family: var(--mono); font-size: 13px; line-height: 1.65;
  background: none; padding: 0; white-space: pre;
}

/* Подсветка синтаксиса: классы tok-* расставляет парсер CodeMirror.
   Цвета берутся из тех же переменных, что и в редакторе, поэтому
   статический блок кода и песочница выглядят одинаково в обеих темах. */
.tok-keyword,
.tok-modifier,
.tok-controlKeyword,
.tok-operatorKeyword,
.tok-definitionKeyword,
.tok-moduleKeyword     { color: var(--syn-keyword); }
.tok-string,
.tok-string2,
.tok-special           { color: var(--syn-string); }
.tok-number,
.tok-bool,
.tok-null,
.tok-atom              { color: var(--syn-number); }
.tok-comment,
.tok-lineComment,
.tok-blockComment,
.tok-docComment        { color: var(--syn-comment); font-style: italic; }
.tok-function,
.tok-macroName         { color: var(--syn-func); }
.tok-propertyName,
.tok-attributeName     { color: var(--syn-prop); }
.tok-typeName,
.tok-className,
.tok-tagName,
.tok-namespace         { color: var(--syn-type); }
.tok-operator,
.tok-punctuation,
.tok-separator,
.tok-bracket,
.tok-derefOperator     { color: var(--syn-op); }
.tok-variableName      { color: var(--code-ink); }
.tok-definition        { color: var(--syn-func); }
.tok-invalid           { color: var(--review); }

.card-actions {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  padding: 18px 24px; border-top: 1px solid var(--line); background: var(--paper-2);
}
.card-actions .spacer { flex: 1; }
.kbd {
  font-family: var(--mono); font-size: 10px; border: 1px solid var(--line-2);
  padding: 2px 6px; color: var(--muted); margin-left: 6px;
}

.empty { padding: 60px 24px; text-align: center; color: var(--muted); }
.empty h3 { color: var(--ink); }

/* ── Livecoding ─────────────────────────────────────────────── */
.task-list { margin-top: 28px; border-top: 1px solid var(--line); }
.task-row {
  /* Четвёртая колонка — под метку частоты; у задач лайвкодинга она пустует */
  width: 100%; display: grid; grid-template-columns: 34px 1fr auto auto;
  gap: 16px; align-items: center; text-align: left;
  padding: 16px 4px; background: none; border: 0; border-bottom: 1px solid var(--line);
  cursor: pointer; font-family: var(--sans); color: var(--ink);
}
.task-row:hover { background: var(--paper-2); }
.task-row .num {
  font-family: var(--mono); font-size: 12px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.task-row .name { display: block; font-weight: 600; }
.task-row .why { display: block; font-size: var(--step--1); color: var(--muted); margin-top: 2px; }
.lvl {
  font-size: 10px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase;
  padding: 4px 8px; border: 1px solid var(--line-2); color: var(--muted); white-space: nowrap;
}
.lvl-must { border-color: var(--accent); color: var(--accent); }

.task-body { margin-top: 24px; max-width: 74ch; }
.task-body h3 { margin-top: 30px; }
.task-body p { margin: 0 0 14px; }
.task-body ul { padding-left: 20px; margin: 0 0 14px; }
.task-body li { margin-bottom: 6px; }
.hint {
  border-left: 3px solid var(--line-2); padding: 4px 0 4px 16px;
  color: var(--muted); font-size: var(--step--1); margin: 0 0 12px;
}
details.solution { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 20px; }
details.solution summary {
  cursor: pointer; font-size: 12px; font-weight: 900; letter-spacing: .1em;
  text-transform: uppercase; color: var(--accent); list-style: none;
}
details.solution summary::-webkit-details-marker { display: none; }
details.solution summary::before { content: "→ "; }
details.solution[open] summary::before { content: "↓ "; }
details.solution > div { margin-top: 20px; }

/* ── Рабочее место: редактор и результаты ───────────────────── */
/* ── Рабочее место задачи ─────────────────────────────────────── */

.ws-bar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 0 0 16px; margin-bottom: 18px; border-bottom: 1px solid var(--line);
}
.ws-title { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.ws-name { font-size: var(--step-1); font-weight: 700; letter-spacing: -.01em; }
.ws-meta { font-size: 12px; color: var(--muted); }

.ws-modes { display: flex; gap: 0; border: 1px solid var(--line-2); }
.ws-modes .chip { border: 0; border-right: 1px solid var(--line-2); }
.ws-modes .chip:last-child { border-right: 0; }

.ws-timer {
  font-family: var(--mono); font-size: 20px; font-weight: 700;
  font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  padding: 4px 12px; border: 1px solid var(--line-2); min-width: 78px; text-align: center;
}
.ws-timer.over { color: var(--accent); border-color: var(--accent); }

.ws-brief { margin-bottom: 8px; }
.ws-brief > summary {
  cursor: pointer; font-size: 11px; font-weight: 900; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted); padding: 8px 0;
}
.ws-brief[open] > summary { margin-bottom: 6px; }

.ws-hints { margin: 26px 0; padding: 16px; border: 1px solid var(--line); background: var(--paper-2); }
.ws-hints-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.ws-hints-count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ws-hints .hint:last-of-type { margin-bottom: 12px; }

/* Вкладка файла — чтобы редактор читался как редактор, а не как поле ввода */
.file-tab {
  font-family: var(--mono); font-size: 12px; padding: 4px 10px;
  border: 1px solid var(--line-2); border-bottom-color: transparent;

const DECKS = [
  {
    id: 'js', title: 'JavaScript', sub: 'Event loop, замыкания, this, промисы — ядро любой секции.',
    cards: [
      { id: 'js1',
        q: 'Как работает event loop? Чем микрозадачи отличаются от макрозадач?',
        a: `<h4>Коротко</h4>
        <p>JS исполняется в одном потоке, конкурентность даёт цикл событий. Он повторяет один и тот же оборот: берёт <strong>одну</strong> макрозадачу, выполняет её до конца, затем полностью вычерпывает очередь микрозадач и только после этого браузер может нарисовать кадр. Микрозадачи всегда идут раньше следующей макрозадачи.</p>

        <h4>Как это работает</h4>
        <ol>
          <li>Из очереди задач берётся одна <strong>макрозадача</strong>: выполнение самого скрипта, колбэк <code>setTimeout</code> или <code>setInterval</code>, обработчик события, завершение I/O.</li>
          <li>Когда стек вызовов пуст, движок <strong>дренирует всю очередь микрозадач</strong> — <code>Promise.then/catch/finally</code>, продолжение после <code>await</code>, <code>queueMicrotask</code>, <code>MutationObserver</code>. Микрозадача, породившая новую микрозадачу, отработает в этом же тике: очередь дренируется до пустоты, а не по одной штуке.</li>
          <li>Если подошло время кадра, запускается фаза рендера: resize и scroll, IntersectionObserver, колбэки <code>requestAnimationFrame</code>, затем style, layout, paint, composite.</li>
          <li>В остаток кадра, если он есть, попадает <code>requestIdleCallback</code>.</li>
        </ol>

        <h4>Почему так</h4>
        <p>Две очереди нужны, чтобы реакция на разрешённый промис догоняла код <strong>до</strong> отрисовки: между микрозадачами кадра не бывает, поэтому пользователь не увидит полусогласованное состояние UI. Цена — микрозадачи имеют неограниченный приоритет над рендером и вводом.</p>

        <h4>Подводные камни</h4>
        <ul>
          <li>Рекурсивный <code>queueMicrotask</code> или бесконечная цепочка <code>.then</code> — очередь не пустеет, кадр не рисуется никогда. Вкладка «живая», но замерла: это microtask starvation.</li>
          <li><code>setTimeout(fn, 0)</code> не значит «сразу»: после пяти вложенных вызовов включается клэмпинг до 4 мс, а на фоновой вкладке таймеры троттлятся примерно до раза в секунду.</li>
          <li>Любой синхронный кусок дольше 50 мс — long task: клик не обработается и кадр не отрисуется, метрика INP проваливается.</li>
          <li><code>await</code> не отдаёт управление рендеру, если промис уже разрешён — это по-прежнему микрозадача.</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>«Где в этой схеме requestAnimationFrame?» — отдельная фаза перед отрисовкой, не макро- и не микрозадача; на скрытой вкладке не вызывается вовсе, в отличие от таймеров. «Как разрезать тяжёлый цикл?» — отдавать управление макрозадачей по бюджету времени (<code>await scheduler.yield()</code>, <code>MessageChannel</code>, в крайнем случае <code>setTimeout</code>), а совсем тяжёлое считать в Web Worker.</p>`,
        code: `console.log(1);
setTimeout(() => console.log(2), 0);        // макрозадача
Promise.resolve().then(() => console.log(3)); // микрозадача
queueMicrotask(() => console.log(5));         // микрозадача
console.log(4);
// 1, 4, 3, 5, 2 — весь синхронный код, затем все микрозадачи, затем таймер

// разрезание длинной работы по бюджету, а не по количеству
async function chunked(items, work) {
  let start = performance.now();
  for (const item of items) {
    work(item);
    if (performance.now() - start > 5) {
      await new Promise(r => setTimeout(r, 0)); // отдали кадр браузеру
      start = performance.now();
    }
  }
}`,
        tip: 'Сильный ответ формулирует границу так: «отрисовка возможна только между макрозадачами и никогда посреди дренажа микрозадач». Отсюда сразу следует и microtask starvation, и почему для yield-а нужен setTimeout, а не queueMicrotask.' },

      { id: 'js2',
        q: 'Почему в цепочке .then каждое звено — отдельная микрозадача? Что выведет этот код?',
        snippet: `console.log('A');
setTimeout(() => console.log('B'), 0);
Promise.resolve()
  .then(() => console.log('C'))
  .then(() => console.log('D'));
queueMicrotask(() => console.log('E'));
console.log('F');`,
        a: `<h4>Коротко</h4>
        <p>Вывод: <strong>A F C E D B</strong>. Каждое звено <code>.then</code> — самостоятельная микрозадача, и колбэк следующего звена попадает в очередь только в тот момент, когда разрешится промис предыдущего. Поэтому <code>queueMicrotask</code>, поставленный синхронно, обгоняет второе звено цепочки.</p>

        <h4>Как это работает</h4>
        <ol>
          <li>Синхронно печатается <code>A</code>, планируется таймер <code>B</code>, строится цепочка, ставится <code>E</code>, печатается <code>F</code>.</li>
          <li><code>.then(C)</code> подписан на уже разрешённый промис, поэтому колбэк <code>C</code> ставится в очередь микрозадач немедленно. <code>.then(D)</code> подписан на промис, который <strong>вернёт</strong> первый <code>then</code>, а он пока pending — колбэка <code>D</code> в очереди нет вообще.</li>
          <li>Очередь после синхронного кода: <code>[C, E]</code>.</li>
          <li>Выполняется <code>C</code>. Его промис резолвится, и только теперь <code>D</code> встаёт в <strong>конец</strong> очереди: <code>[E, D]</code>.</li>
          <li>Выполняется <code>E</code>, затем <code>D</code>. Очередь пуста, тик закончился — приходит очередь макрозадачи <code>B</code>.</li>

        <h4>Почему так</h4>

        code: `// приватное состояние: count недоступен снаружи

        <h4>Как это работает</h4>
        <p>Спред перебирает собственные перечислимые свойства и присваивает их значения новому объекту. Значение свойства-объекта — это ссылка, поэтому <code>copy.address === original.address</code>. Мутация вложенного объекта видна обеим «копиям» — отсюда классический баг «изменил в форме, а поменялось и в списке».</p>
        <p><code>structuredClone</code> использует алгоритм структурного клонирования из спецификации HTML — тот же, что применяется при <code>postMessage</code> в воркер. Он рекурсивно копирует данные, ведёт внутреннюю карту уже скопированных объектов и поэтому корректно переживает <strong>циклические ссылки</strong>, а также умеет <code>Date</code>, <code>RegExp</code>, <code>Map</code>, <code>Set</code>, <code>ArrayBuffer</code>, <code>Blob</code>, типизированные массивы.</p>

        <h4>Почему так</h4>
        <p>Поверхностное копирование дёшево и в 90% случаев достаточно: в React и Redux иммутабельно обновляют только изменившуюся ветку, а неизменённые поддеревья намеренно переиспользуют по ссылке — именно на этом работает сравнение по <code>Object.is</code> и мемоизация. Глубокая копия ломает это: всё становится «новым», и мемоизация перестаёт срабатывать.</p>

        <h4>Подводные камни</h4>
        <ul>
          <li><code>JSON.parse(JSON.stringify(x))</code>: теряет <code>undefined</code>, функции и символы, превращает <code>Date</code> в строку, <code>Map</code> и <code>Set</code> в пустые объекты, <code>NaN</code> и <code>Infinity</code> в <code>null</code>, а на цикле бросает <code>TypeError</code>. Медленнее structuredClone на больших данных.</li>
          <li><code>structuredClone</code> бросает <code>DataCloneError</code> на функциях, DOM-узлах, классах (прототип теряется, останутся только поля) и символах.</li>
          <li>Спред копирует только <strong>собственные перечислимые</strong> свойства: геттеры вычисляются и превращаются в обычные значения, прототип не переносится.</li>
          <li>Глубокая копия большого стора — это и время, и мусор для GC. Обычно правильнее иммутабельное обновление ветки (или Immer со структурным разделением).</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>«Как написать deepClone руками?» — рекурсия плюс <code>WeakMap</code> «оригинал → копия» для защиты от циклов. «Почему WeakMap, а не Map?» — чтобы карта не удерживала клонируемые объекты после завершения. «Что быстрее?» — <code>structuredClone</code> обычно быстрее JSON-трюка и точно корректнее.</p>`,
        code: `const user = { name: 'D', address: { city: 'Москва' } };

const shallow = { ...user };
shallow.address.city = 'Питер';
user.address.city;              // 'Питер' — объект общий

const deep = structuredClone(user);   // Date, Map, Set, циклы — всё ок
deep.address.city = 'Казань';
user.address.city;                    // 'Питер' — не задет

// руками: WeakMap спасает от бесконечной рекурсии на циклах
function deepClone(value, seen = new WeakMap()) {
  if (value === null || typeof value !== 'object') return value;
  if (seen.has(value)) return seen.get(value);
  const copy = Array.isArray(value) ? [] : {};
  seen.set(value, copy);
  for (const [k, v] of Object.entries(value)) copy[k] = deepClone(v, seen);
  return copy;
}`,

        <h4>Как это работает</h4>
        <ol>
          <li>При входе в область движок выполняет шаг instantiation: собирает объявления и заводит для каждого слот в записи окружения.</li>

          <li>Function expression и стрелка, присвоенные в переменную, ведут себя как обычные переменные: с <code>var</code> будет <code>undefined is not a function</code>, с <code>const</code> — <code>ReferenceError</code>.</li>
        </ol>
        <p>Важно: TDZ — про <strong>время</strong>, а не про строку. Функция, объявленная выше и вызванная ниже объявления <code>let</code>, отработает нормально.</p>

        <h4>Почему так</h4>
        <p>Hoisting у <code>var</code> — следствие ранних решений: переменные жили в объекте области видимости, и создать их надо было заранее. TDZ добавили специально, чтобы <code>const</code> нельзя было прочитать до присваивания (иначе константа имела бы наблюдаемое значение <code>undefined</code>) и чтобы ошибки порядка объявлений падали громко, а не молча давали <code>undefined</code>.</p>

      { id: 'js19',
        q: 'Чем debounce отличается от throttle и где применяется каждый?',
        a: `<h4>Коротко</h4>
        <p><strong>debounce</strong> — «подожди, пока перестанут дёргать, и сделай один раз»: серия вызовов схлопывается в один, обычно последний. <strong>throttle</strong> — «делай, но не чаще раза в N мс»: поток прореживается с постоянной частотой, промежуточные события отбрасываются. Debounce может не вызваться вообще, throttle вызывается регулярно.</p>

        <h4>Как это работает</h4>
        <p><code>debounce(fn, ms)</code> хранит id таймера в замыкании. Каждый вызов сбрасывает предыдущий таймер и ставит новый, поэтому <code>fn</code> выполнится только через <code>ms</code> тишины. Вариант с <code>leading: true</code> вызывает функцию сразу на первом событии и глушит остальные — так делают защиту от двойного клика.</p>
        <p><code>throttle(fn, ms)</code> запоминает время последнего вызова и пропускает события, пока не истёк интервал. У него два края: <strong>leading</strong> (вызов сразу) и <strong>trailing</strong> (гарантированный вызов с последними аргументами в конце серии). Без trailing последнее событие серии теряется — на скролле это значит, что финальная позиция не обработается.</p>

        <h4>Почему так</h4>
        <ul>
          <li><strong>debounce</strong>: поисковые подсказки (150–300 мс), автосохранение, валидация при вводе, обработка <code>resize</code>, отправка формы — везде, где важен только конечный результат.</li>
          <li><strong>throttle</strong>: <code>scroll</code>, <code>mousemove</code>, drag-n-drop, индикатор «печатает», отправка аналитики — везде, где важна непрерывность реакции.</li>
        </ul>
        <p>Плата за debounce — задержка отклика: слишком большой интервал ощущается как тормоз. Плата за throttle — потеря промежуточных данных.</p>

        <h4>Подводные камни</h4>
        <ul>
          <li><strong>Создание внутри рендера</strong>: <code>onChange={debounce(fn, 300)}</code> в React создаёт новую функцию с новым таймером на каждый рендер — дебаунс не работает вовсе. Нужен <code>useMemo</code>, <code>useRef</code> или готовый хук.</li>
          <li><strong>Нет cancel</strong>: отложенный вызов срабатывает после размонтирования. Реализация обязана отдавать <code>cancel()</code>, а компонент — звать его в cleanup.</li>

          <li>Для скролла и видимости часто вообще не нужен throttle — правильнее <code>IntersectionObserver</code> или <code>requestAnimationFrame</code>.</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>«Напиши debounce» — классическая задача, см. раздел «Лайвкодинг». «Как сделать и leading, и trailing?» — флаги в опциях: запоминать, был ли вызов за интервал. «Что выбрать для автокомплита?» — debounce на ввод плюс отмена предыдущего запроса.</p>`,
        code: `function debounce(fn, ms) {
  let t;
  const wrapped = function (...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), ms);
  };
  wrapped.cancel = () => clearTimeout(t);   // без этого — вызов после unmount
  return wrapped;
}

function throttle(fn, ms) {
  let last = 0, timer = null, lastArgs;
  return function (...args) {
    lastArgs = args;
    const now = Date.now();
    if (now - last >= ms) { last = now; fn.apply(this, args); }
    else if (!timer) {                       // trailing: не теряем конец серии
      timer = setTimeout(() => {
        timer = null; last = Date.now(); fn.apply(this, lastArgs);
      }, ms - (now - last));
    }
  };
}

// в React обёртку создаём один раз

useEffect(() => onSearch.cancel, [onSearch]);`,

      { id: 'js20',
        q: 'Что такое итерируемый объект и зачем нужны генераторы?',
        a: `<h4>Коротко</h4>
        <p>Два разных протокола. <strong>Итератор</strong> — объект с методом <code>next()</code>, возвращающим <code>{value, done}</code>. <strong>Итерируемый</strong> — объект с методом <code>[Symbol.iterator]()</code>, который возвращает итератор. Наличие второго включает <code>for...of</code>, спред, деструктуризацию, <code>Array.from</code>, <code>Promise.all</code>. Генератор — короткий способ написать и то, и другое сразу.</p>

        <h4>Как это работает</h4>
        <p><code>for...of</code> вызывает <code>[Symbol.iterator]()</code>, получает итератор и дёргает <code>next()</code>, пока не придёт <code>done: true</code>. При выходе из цикла через <code>break</code>, <code>return</code> или исключение вызывается <code>iterator.return()</code> — это точка, где итератор может освободить ресурсы.</p>
        <p>Вызов функции-генератора <strong>не выполняет её тело</strong>: он возвращает объект-генератор, который одновременно и итератор, и итерируемое. Каждый <code>next()</code> исполняет тело до ближайшего <code>yield</code>, отдаёт значение и <strong>замораживает кадр стека</strong> с сохранением всех локальных переменных. Обратный канал тоже есть: аргумент <code>next(v)</code> становится значением выражения <code>yield</code> внутри генератора, а <code>throw()</code> бросает исключение в точку паузы.</p>

        <h4>Почему так</h4>
        <p>Протокол позволяет любому объекту участвовать в языковых конструкциях без наследования от массива — так работают <code>Map</code>, <code>Set</code>, <code>NodeList</code>, строки (по кодовым точкам, а не по UTF-16-единицам). Генераторы дают <strong>ленивость</strong>: значение вычисляется в момент запроса, поэтому можно описать бесконечную последовательность, поток чтения файла или постраничный обход API без загрузки всего в память. Плата — генераторы заметно медленнее обычного цикла и хуже читаются в отладке.</p>

        <h4>Подводные камни</h4>
        <ul>
          <li>Обычный объект <strong>не итерируем</strong>: <code>for...of</code> по нему бросит <code>TypeError</code>. Нужны <code>Object.entries</code>, <code>keys</code> или <code>values</code>.</li>
          <li><code>for...in</code> — это не итерация, а обход ключей, включая унаследованные. Для массивов даёт строковые индексы.</li>
          <li>Генератор одноразовый: пройденный до конца, он больше ничего не отдаст. Если объект должен переиспользоваться, <code>[Symbol.iterator]</code> обязан возвращать <strong>новый</strong> итератор при каждом вызове.</li>
          <li>Спред и <code>Array.from</code> на бесконечном генераторе повесят вкладку.</li>
          <li>Внутри <code>for await...of</code> нужен уже другой протокол — <code>[Symbol.asyncIterator]</code> и <code>async function*</code>.</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>«Где генераторы применяют на практике?» — постраничный обход API через <code>async function*</code>, чтение потоков, redux-saga (эффекты как yield-значения, что делает логику тестируемой без моков), генерация id. «Чем отличается <code>yield*</code>?» — делегирует другому итерируемому, удобно для рекурсивного обхода дерева.</p>`,
        code: `// делаем объект итерируемым
const range = {
  from: 1, to: 3,
  *[Symbol.iterator]() {
    for (let v = this.from; v <= this.to; v++) yield v;
  },
};
[...range];                      // [1, 2, 3]

// ленивая бесконечная последовательность
function* ids() { let i = 0; while (true) yield ++i; }
const gen = ids();
gen.next().value;                // 1

// постраничный обход API без загрузки всего в память
async function* pages(url) {
  let next = url;
  while (next) {
    const res = await fetch(next);
    const page = await res.json();
    yield* page.items;           // делегируем массиву
    next = page.nextUrl;
  }
}
for await (const item of pages('/api/items')) render(item);`,
        tip: 'Разведи два протокола явно — путаница «итератор против итерируемого» слышна сразу. И приведи практический кейс с async-генератором для пагинации: он показывает, что ты применял это, а не читал про Фибоначчи.' },

        <ul>

        <p>«Напиши <code>omit</code>» — <code>K extends keyof T</code> и возврат <code>Omit&lt;T, K&gt;</code>, то есть <code>Pick&lt;T, Exclude&lt;keyof T, K&gt;&gt;</code>. «Почему <code>Omit</code> не проверяет лишние ключи?» — он объявлен через <code>keyof any</code>, поэтому опечатка проходит; в своей версии ставь <code>K extends keyof T</code>. «Как типизировать <code>get(obj, path)</code> с вложенным путём?» — рекурсивным conditional type по шаблонному литералу.</p>`,
        code: `function pick<T extends object, K extends keyof T>(
  obj: T,
  keys: readonly K[],
): Pick<T, K> {
  const result = {} as Pick<T, K>;   // оправданный as: цикл заполнит все ключи
  for (const key of keys) result[key] = obj[key];
  return result;
}

const user = { id: 1, name: 'D', age: 30 };
pick(user, ['id', 'name']);   // { id: number; name: string }
pick(user, ['nope']);         // Error: 'nope' не входит в keyof

// зеркальный omit — со строгим ограничением, в отличие от встроенного Omit
function omit<T extends object, K extends keyof T>(obj: T, keys: readonly K[]): Omit<T, K> {

      { id: 'ts6',
        q: 'Как устроены Partial, Pick и ReturnType изнутри?',
        a: `<h4>Коротко</h4>
        <p>На двух механизмах. <strong>Mapped types</strong> перебирают ключи (<code>[K in keyof T]</code>) и позволяют навешивать или снимать модификаторы <code>?</code> и <code>readonly</code>. <strong>Conditional types</strong> (<code>T extends U ? X : Y</code>) вместе с <code>infer</code> вытаскивают тип из позиции — например тип возврата из сигнатуры функции. Написать их руками — стандартная проверка на интервью.</p>

        <h4>Как это работает</h4>
        <ul>
          <li><code>Partial&lt;T&gt;</code> — <code>{ [K in keyof T]?: T[K] }</code>. Модификатор <code>?</code> добавляется, <code>-?</code> снимает его (<code>Required</code>), то же с <code>readonly</code> и <code>-readonly</code> (<code>Mutable</code>).</li>
          <li><code>Pick&lt;T, K&gt;</code> — <code>{ [P in K]: T[P] }</code>: перебор идёт не по всем ключам, а по переданному union.</li>
          <li><code>ReturnType&lt;T&gt;</code> — <code>T extends (...a: any) =&gt; infer R ? R : never</code>. <code>infer R</code> объявляет переменную типа, которую компилятор связывает при сопоставлении.</li>
          <li><strong>Дистрибутивность</strong>: если проверяемый тип — голый параметр, conditional применяется к каждому члену union по отдельности. <code>Exclude&lt;'a'|'b', 'a'&gt;</code> раскладывается в <code>('a' extends 'a' ? never : 'a') | ('b' extends 'a' ? never : 'b')</code> и даёт <code>'b'</code>. Отключается обёрткой в кортеж: <code>[T] extends [U]</code>.</li>
          <li><code>as</code> внутри mapped type переименовывает ключи, а возврат <code>never</code> — отфильтровывает их. На этом строят <code>Getters</code> и выборку по типу значения.</li>
        </ul>

        <h4>Почему так</h4>
        <p>Утилиты не встроены в компилятор магически — они объявлены в <code>lib.es5.d.ts</code> теми же средствами, что доступны тебе. Это значит, что под свою доменную задачу можно написать точную утилиту вместо приведения через <code>as</code>. Плата: сложные рекурсивные типы заметно замедляют <code>tsc</code> и дают нечитаемые сообщения об ошибках.</p>

        <h4>Подводные камни</h4>
        <ul>
          <li><code>Partial</code> заразителен: он <strong>не рекурсивен</strong>, вложенные объекты остаются обязательными. <code>DeepPartial</code> пишут руками.</li>
          <li>Дистрибутивность по <code>never</code>: <code>Exclude&lt;never, 'a'&gt;</code> это <code>never</code>, потому что union пуст и раскладывать нечего. Регулярный источник «пустых» типов.</li>
          <li>Mapped type над union распределяется не так, как ожидают: <code>Partial&lt;A | B&gt;</code> станет <code>Partial&lt;A&gt; | Partial&lt;B&gt;</code>, дискриминант при этом станет опциональным и сужение сломается.</li>
          <li>Рекурсия глубже примерно 50 уровней упирается в лимит инстанцирования типов.</li>
          <li><code>keyof</code> над union даёт только <strong>общие</strong> ключи — частая причина «поле пропало».</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>«Как отключить дистрибутивность?» — обернуть обе стороны в кортеж. «Напиши <code>DeepReadonly</code>» — рекурсивный mapped type с проверкой на объект. «Зачем <code>as</code> в mapped type?» — переименование ключей и фильтрация через <code>never</code>.</p>`,
        code: `type MyPartial<T>  = { [K in keyof T]?: T[K] };
type MyRequired<T> = { [K in keyof T]-?: T[K] };
type MyMutable<T>  = { -readonly [K in keyof T]: T[K] };
type MyPick<T, K extends keyof T> = { [P in K]: T[P] };
type MyReturnType<T> = T extends (...args: any[]) => infer R ? R : never;
type MyExclude<T, U> = T extends U ? never : T;
type MyOmit<T, K extends keyof T> = MyPick<T, MyExclude<keyof T, K>>;

// рекурсия: Partial вглубь
type DeepPartial<T> = T extends object ? { [K in keyof T]?: DeepPartial<T[K]> } : T;

// переименование ключей и фильтрация через never
type Getters<T> = { [K in keyof T as \`get\${Capitalize<string & K>}\`]: () => T[K] };
type OnlyStrings<T> = { [K in keyof T as T[K] extends string ? K : never]: T[K] };

// отключение дистрибутивности
type IsUnion<T> = [T] extends [infer U] ? false : true;`,
        tip: 'Обязательно проговори дистрибутивность — именно на ней ловят: почему Exclude работает, а NonNullable<never> даёт never. И назови цену: рекурсивные типы тормозят tsc и дают нечитаемые ошибки.' },

      { id: 'ts7',
        q: 'Зачем нужен satisfies и чем он отличается от аннотации и as?',
        a: `<h4>Коротко</h4>
        <p>Три операции с разной силой. <strong>Аннотация</strong> <code>const c: Config = {...}</code> проверяет соответствие, но <strong>расширяет</strong> тип переменной до объявленного — конкретные литералы теряются. <strong><code>as</code></strong> ничего не проверяет и просто переопределяет тип. <strong><code>satisfies</code></strong> (TS 4.9) проверяет соответствие и при этом сохраняет точный выведенный тип.</p>

        <h4>Как это работает</h4>
        <p><code>satisfies</code> — оператор проверки без изменения типа выражения. Компилятор сначала выводит тип литерала как обычно (со всеми литеральными значениями и точным набором ключей), затем проверяет, что этот тип присваиваем указанному. Если да — переменная получает <strong>выведенный</strong> тип, а не указанный.</p>
        <p>Разница видна сразу: с аннотацией <code>Record&lt;string, string&gt;</code> тип <code>routes.home</code> станет <code>string</code>, а <code>keyof typeof routes</code> — просто <code>string</code>, и автодополнение пропадёт. С <code>satisfies</code> тип <code>routes.home</code> останется <code>'/'</code>, а <code>keyof</code> даст union реальных ключей.</p>
        <p>При этом <code>satisfies</code> ловит и опечатки, и лишние ключи, и неверные значения — то есть даёт ровно ту проверку, ради которой обычно и ставят аннотацию.</p>

        <h4>Почему так</h4>
        <p>До 4.9 приходилось выбирать: либо проверка (аннотация), либо точность (<code>as const</code> без проверки). Типовые жертвы — конфиги маршрутов, палитры темы, словари обработчиков, мапы «ключ → компонент». <code>satisfies</code> закрывает разрыв. Плата: это чисто компиляторная конструкция, в рантайме её нет, и от невалидных данных извне она не защищает.</p>

        <h4>Подводные камни</h4>
        <ul>
          <li><code>satisfies</code> сам по себе <strong>не делает значения readonly</strong> и не сужает до литералов там, где вывод по умолчанию широкий. Для массивов и вложенных объектов часто нужна связка <code>as const satisfies T</code>.</li>
          <li>Порядок важен: <code>as const satisfies T</code>, а не наоборот.</li>
          <li><code>as</code> с несовместимым типом требует двойного приведения через <code>unknown</code> — это сигнал, что типы неверны, а не повод так писать.</li>
          <li>Аннотация всё ещё нужна там, где надо намеренно <strong>расширить</strong> тип: например, переменная-состояние, которой позже присвоят другое значение из union.</li>
          <li>В параметре функции <code>satisfies</code> не поможет — там тип задаёт сигнатура.</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>«Чем отличается от <code>as const</code>?» — <code>as const</code> делает всё <code>readonly</code> и литеральным, но ничего не проверяет; <code>satisfies</code> проверяет, но не замораживает. «Когда всё-таки аннотация?» — когда переменная должна принимать более широкий набор значений в дальнейшем. «Влияет ли на бандл?» — нет, стирается полностью.</p>`,
        code: `// аннотация: проверяет, но теряет литералы
const a: Record<string, string> = { home: '/', user: '/users/:id' };
// a.home: string; keyof typeof a: string — автодополнения нет

// satisfies: проверяет и сохраняет точность
const routes = {
  home: '/',
  user: '/users/:id',
} satisfies Record<string, string>;
// routes.home: '/'; keyof typeof routes: 'home' | 'user'

// ошибку в значении ловит так же, как аннотация
const bad = { home: 42 } satisfies Record<string, string>;  // Error

// связка для конфигов: заморозить и проверить
const theme = {
  colors: ['red', 'blue'],
  spacing: 8,
} as const satisfies { colors: readonly string[]; spacing: number };

// as ничего не проверяет
const lie = {} as { id: number };   // упадёт в рантайме`,
        tip: 'Покажи выигрыш на конкретике: с satisfies keyof typeof конфига даёт union реальных ключей, и роутер с автодополнением получается бесплатно. Добавь про порядок «as const satisfies T» — на нём часто спотыкаются.' },

      { id: 'ts8',
        q: 'Что такое структурная типизация и как сделать номинальную?',
        a: `<h4>Коротко</h4>
        <p>TypeScript сравнивает типы по <strong>форме</strong>, а не по имени: если у значения есть все нужные поля подходящих типов, оно подходит — независимо от того, как объявлено. Отсюда и главная практическая дыра: <code>UserId</code> и <code>PostId</code>, оба <code>string</code>, свободно подставляются друг вместо друга. Номинальность эмулируют branded types.</p>

        <h4>Как это работает</h4>
        <p>При проверке присваиваемости компилятор сопоставляет члены: у источника должны быть все члены цели совместимых типов. Лишние члены допустимы — кроме случая <strong>object literal freshness</strong>, когда литерал присваивается напрямую и лишние свойства считаются ошибкой (эту проверку легко обойти через промежуточную переменную).</p>
        <p>Branded type — пересечение примитива с невидимым «клеймом»: <code>string &amp; { readonly __brand: 'UserId' }</code>. Такого значения в рантайме не существует, поэтому создать его можно только через явную функцию с <code>as</code>, которая и становится единственной точкой валидации. Обычная строка в позицию <code>UserId</code> уже не пройдёт, а <code>UserId</code> в позицию <code>string</code> — пройдёт, что и нужно.</p>

        <h4>Почему так</h4>
        <p>Структурность выбрана намеренно: TypeScript надстраивается над JavaScript, где объекты создаются литералами и никаких деклараций классов может не быть вовсе. Номинальность потребовала бы «регистрации» типов и сломала бы совместимость с существующим кодом. Плата — компилятор не различает сущности с одинаковой формой: деньги и проценты, идентификаторы разных сущностей, «сырую» и «санитизированную» строку.</p>

        <h4>Подводные камни</h4>
        <ul>
          <li>Брендирование <strong>не бесплатно</strong>: нужна функция-конструктор, и весь код должен ходить через неё, иначе смысла нет.</li>
          <li>Бренд стирается при сериализации: после <code>JSON.parse</code> это снова обычная строка, проверять надо заново.</li>
          <li>Классы тоже структурны: класс с приватным полем (<code>private</code> или <code>#field</code>) — редкое исключение, там сравнение становится по сути номинальным.</li>
          <li>Функции сравниваются <strong>бивариантно</strong> для методов и контравариантно по параметрам для свойств-функций при <code>strictFunctionTypes</code> — источник неожиданных «совместимых» колбэков.</li>
          <li>Опциональное поле не спасает от путаницы: тип с лишним необязательным полем всё равно совместим.</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>«Где брендирование реально окупается?» — деньги в копейках против рублей, id разных сущностей, санитизированный HTML, валидированный email. «Есть ли номинальность из коробки?» — нет, только приватные поля класса как побочный эффект. «Чем это лучше отдельного класса-обёртки?» — нулевая цена в рантайме: бренд полностью стирается.</p>`,
        code: `// структурность: разные имена, одна форма — взаимозаменяемы
interface Point { x: number; y: number }
interface Vector { x: number; y: number }
const p: Point = { x: 1, y: 2 };
const v: Vector = p;              // ok, никакой ошибки

// проблема: два string перепутать нечем
function getPost(userId: string, postId: string) {}
getPost(postId, userId);          // компилируется, баг в проде

// branded types: номинальность за ноль байт рантайма
type Brand<T, B extends string> = T & { readonly __brand: B };
type UserId = Brand<string, 'UserId'>;
type PostId = Brand<string, 'PostId'>;

const toUserId = (v: string): UserId => {

  return v as UserId;
};

declare function getPost2(userId: UserId, postId: PostId): void;
getPost2('abc' as PostId, 'abc' as UserId);   // Error — типы не перепутать`,
        tip: 'Не ограничивайся определением структурной типизации — покажи, какую реальную ошибку она пропускает и как бренд её закрывает. Упомяни, что приватное поле класса — единственная номинальность из коробки.' },

      { id: 'ts9',
        q: 'Почему as опасен?',
        a: `<h4>Коротко</h4>
        <p><code>as</code> — это <strong>утверждение</strong> типа, а не приведение. Он ничего не проверяет и не меняет данные в рантайме: он только сообщает компилятору «поверь мне». Если реальность не совпала, ошибка не исчезает, а переезжает в прод и всплывает далеко от места, где ты соврал.</p>

        <h4>Как это работает</h4>
        <p>Компилятор разрешает <code>x as T</code>, если <code>T</code> и тип <code>x</code> хоть как-то пересекаются — то есть одно присваиваемо другому. При полной несовместимости он потребует двойного приведения <code>x as unknown as T</code>; именно это и есть индикатор, что происходит что-то не то. После утверждения всё дальнейшее выводится из объявленного типа, поэтому автодополнение показывает поля, которых может не быть.</p>

        <h4>Почему так</h4>
        <p>Утверждения нужны там, где разработчик знает больше компилятора: результат <code>querySelector</code>, ключи <code>Object.keys</code>, поэтапное построение объекта. Отказаться от них полностью нельзя. Плата — каждое <code>as</code> это непроверяемое допущение, и в отличие от <code>any</code> оно выглядит аккуратно, поэтому проходит ревью.</p>

        <h4>Подводные камни</h4>
        <ul>
          <li><strong>Ответ API как <code>as User</code></strong> — самый частый и самый дорогой случай: типизация есть, гарантии нет. Нужен разбор схемой (zod, valibot) или type guard.</li>

          <li>Тесты часто становятся кладбищем <code>as</code>: <code>{} as User</code> в моке скрывает изменение контракта.</li>

        <h4>Что спросят следом</h4>
        <p>«Когда <code>as</code> уместен?» — сужение после проверки, которую компилятор не понимает; поэтапная сборка объекта (<code>{} as T</code> с последующим заполнением всех полей); работа с DOM после явной проверки на <code>null</code>; фабрика branded type. «Чем заменить?» — type guard с <code>v is T</code>, функция-assert с <code>asserts v is T</code>, схема с рантайм-валидацией. «Что безопаснее для DOM?» — <code>instanceof HTMLInputElement</code>: это и проверка, и сужение.</p>`,
        code: `// опасно: типизация без гарантии

        <h4>Как это работает</h4>
        <ol>

          <li>Дальше — догрузка шрифтов и изображений, выполнение JS, при SSR гидратация, и только после неё страница становится интерактивной.</li>
        </ol>

        <h4>Почему так</h4>
        <p>Блокировки не прихоть: без CSSOM браузер нарисовал бы нестилизованный контент (FOUC), а синхронный скрипт может вызвать <code>document.write</code> и изменить сам поток разбора. Плата — каждый блокирующий ресурс напрямую добавляется ко времени первого экрана.</p>

        <h4>Подводные камни</h4>
        <ul>
          <li><strong>Шрифты</strong>: обнаруживаются только после разбора CSS, поэтому текст ждёт их до 3 секунд. Лечится <code>font-display: swap</code>, <code>preload</code> и подгонкой метрик fallback.</li>
          <li><strong>Цепочка редиректов</strong> и отсутствие HSTS добавляют лишние round-trip до первого байта.</li>
          <li><code>@import</code> внутри CSS сериализует загрузку: файл обнаружится только после разбора первого.</li>
          <li>Инлайн-скрипт в <code>&lt;head&gt;</code> блокирует парсер и ждёт весь CSS выше себя.</li>
          <li>Слишком много <code>preload</code> вредит: они конкурируют за канал с действительно важным ресурсом.</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>«Чем <code>async</code> отличается от <code>defer</code>?» — <code>async</code> выполняется сразу по загрузке, порядок не гарантирован; <code>defer</code> — после разбора HTML, в порядке объявления. «Что такое preload scanner?» — вторичный парсер, находящий ресурсы, пока основной заблокирован. «Где здесь измерять?» — Navigation Timing и вкладка Network с фильтром по TTFB и Waterfall.</p>`,

  <style>/* стили первого экрана */</style>

  <!-- остальной CSS не блокирует первый кадр -->
  <link rel="stylesheet" href="/rest.css" media="print" onload="this.media='all'">

  <!-- LCP-картинка: качаем как можно раньше, без lazy -->
  <link rel="preload" as="image" href="/hero.avif" fetchpriority="high">

</head>`,
        tip: 'Не пересказывай цепочку целиком — сразу назови критический путь: CSS блокирует рендер, синхронный JS блокирует парсер и ждёт CSSOM. Отсюда и рецепты: критический CSS инлайном, defer, preload LCP-ресурса.' },

      { id: 'w2',
        q: 'Reflow, repaint, composite — в чём разница и почему анимируют transform?',
        a: `<h4>Коротко</h4>
        <p>Три стадии отрисовки разной стоимости. Изменение геометрии запускает <strong>layout</strong> — пересчёт положения элементов, самое дорогое и каскадное. Изменение цвета или тени — только <strong>paint</strong>. Изменение <code>transform</code> и <code>opacity</code> обрабатывается на стадии <strong>composite</strong>, на GPU, без участия главного потока. Поэтому анимируют именно их.</p>

        <h4>Как это работает</h4>
        <p>Каждый кадр браузер проходит конвейер: recalculate style → layout → paint → composite. Свойство определяет, с какого шага конвейер запустится. <code>width</code>, <code>top</code>, <code>margin</code>, <code>font-size</code> меняют геометрию, значит нужен layout, и дальше по цепочке paint и composite. <code>background-color</code> и <code>box-shadow</code> геометрию не трогают — layout пропускается. <code>transform</code> и <code>opacity</code> применяются к уже растрированному слою, поэтому композитор делает их сам, в отдельном потоке, и анимация не спотыкается даже при загруженном главном потоке.</p>
        <p><code>will-change: transform</code> или <code>translateZ(0)</code> заранее выносят элемент в собственный слой. Это ускоряет анимацию, но каждый слой стоит видеопамяти, поэтому свойство ставят перед анимацией и снимают после.</p>

        <h4>Почему так</h4>
        <p>Layout каскаден: изменение ширины одного блока сдвигает соседей и может затронуть всё поддерево, а иногда и предков. Композитинг же работает с готовыми текстурами — это буквально перемножение матриц на GPU. Разница в стоимости кадра — порядки. Плата за слои — память и риск «взрыва слоёв», когда их сотни.</p>

        <h4>Подводные камни</h4>
        <ul>
          <li><strong>Layout thrashing</strong>: чередование чтения (<code>offsetHeight</code>, <code>getBoundingClientRect</code>, <code>scrollTop</code>, <code>getComputedStyle</code>) и записи стилей в цикле. Каждое чтение после записи форсирует синхронный пересчёт, и цикл на 100 элементов даёт 100 layout. Лечится разделением на фазу чтения и фазу записи или переносом записи в <code>requestAnimationFrame</code>.</li>
          <li>Анимация <code>height</code> для раскрывающегося блока — layout на каждый кадр; используй <code>transform: scaleY</code> или современный <code>interpolate-size</code>.</li>
          <li><code>box-shadow</code> и <code>filter: blur</code> на большой области дороги в paint, хотя layout не вызывают.</li>
          <li><code>will-change</code>, оставленный навсегда, съедает память и может замедлить страницу.</li>
          <li>Анимация <code>transform</code> у элемента без своего слоя всё равно вызывает paint — проверяй в Layers.</li>
        </ul>

        <h4>Что спросят следом</h4>
        <p>«Как это увидеть?» — вкладка Performance: длинные фиолетовые полосы Layout, слой Rendering с галками Paint flashing и Layer borders. «Какие свойства безопасны?» — сверяться со списком на csstriggers; безопасны практически только <code>transform</code>, <code>opacity</code> и <code>filter</code>. «А FLIP?» — приём, где вычисляют дельту позиций и анимируют её трансформом вместо анимации самой геометрии.</p>`,
        code: `// layout thrashing: 100 принудительных пересчётов
for (const el of items) {
  el.style.height = el.offsetHeight + 10 + 'px';   // чтение после записи
}

// правильно: сначала все чтения, потом все записи
const heights = items.map(el => el.offsetHeight);   // фаза чтения
requestAnimationFrame(() => {
  items.forEach((el, i) => { el.style.height = heights[i] + 10 + 'px'; });
});

/* дорого: layout на каждом кадре */
.slide { transition: left .3s; left: 0; }

/* дёшево: только composite */

/* слой готовим перед анимацией и снимаем после */

        tip: 'Назови конкретный инструмент: Performance-запись и Paint flashing в панели Rendering. И упомяни layout thrashing своими словами — «чтение после записи форсирует синхронный пересчёт»: это то, что реально ловят на проде.' },

      { id: 'w3',
        q: 'Что такое LCP и как его улучшить?',
        a: `<h4>Коротко</h4>
        <p>Largest Contentful Paint — момент отрисовки самого крупного элемента в видимой области: обычно герой-картинка, видео-постер или крупный заголовок. Порог: <strong>хорошо до 2.5 с</strong>, требует улучшения до 4 с, дальше плохо; считается по 75-му перцентилю реальных пользователей.</p>

        <h4>Как это работает</h4>
        <p>LCP раскладывается на четыре части, и оптимизировать надо ту, что доминирует:</p>
        <ol>
          <li><strong>TTFB</strong> — время до первого байта. Лечится CDN, кешем на сервере, статикой вместо SSR.</li>
          <li><strong>Resource load delay</strong> — промежуток между приходом HTML и началом загрузки LCP-ресурса. Самая частая беда: картинка обнаруживается поздно, потому что её задаёт CSS или JS. Лечится <code>preload</code>, <code>fetchpriority="high"</code> и наличием картинки прямо в HTML.</li>
          <li><strong>Resource load time</strong> — сама загрузка. Лечится форматом (AVIF, WebP), <code>srcset</code> с нужными размерами и сжатием.</li>
          <li><strong>Element render delay</strong> — ресурс уже есть, но не нарисован: мешает блокирующий CSS или JS, либо элемент рендерит клиентский JS.</li>
        </ol>

        <h4>Почему так</h4>

          <li>Клиентский рендеринг: LCP не наступит, пока не выполнится бандл и не придут данные.</li>

      { id: 'w4',
        q: 'Что такое INP и как его улучшить?',
        a: `<h4>Коротко</h4>
        <p>Interaction to Next Paint — метрика отзывчивости: время от взаимодействия пользователя до отрисовки визуального отклика. Берётся практически худшее взаимодействие за визит, а не среднее. Порог: <strong>хорошо до 200 мс</strong>, до 500 мс требует улучшения, дальше плохо. С марта 2024 заменил FID, который мерил только задержку до начала обработки и потому был почти всегда зелёным.</p>

        <h4>Как это работает</h4>
        <p>INP складывается из трёх частей:</p>
        <ol>
          <li><strong>Input delay</strong> — главный поток занят чем-то другим, событие ждёт. Виноваты long task: сторонние скрипты, гидратация, тяжёлый рендер.</li>

      { id: 'w5',
        q: 'Что такое CLS и как его убрать?',
        a: `<h4>Коротко</h4>
        <p>Cumulative Layout Shift — суммарная величина неожиданных сдвигов макета за время жизни страницы. Порог: <strong>хорошо до 0.1</strong>, до 0.25 требует улучшения. Метрика не про «страница дёрнулась один раз», а про то, насколько сильно и как часто контент уезжает под курсором и пальцем пользователя.</p>

        <h4>Как это работает</h4>
        <p>Каждый сдвиг оценивается как произведение двух долей: <strong>impact fraction</strong> (какая часть экрана затронута) на <strong>distance fraction</strong> (насколько далеко уехало относительно размера экрана). Сдвиги группируются в «сессионные окна» по 5 секунд с разрывом не более 1 секунды между ними, и в итоговую метрику идёт <strong>худшее</strong> окно, а не сумма всех.</p>

          <li>Анимации только через <code>transform</code>: анимация <code>top</code> или <code>height</code> считается сдвигом.</li>

        <h4>Подводные камни</h4>

        </ul>

        <h4>Что спросят следом</h4>
        <p>«Как найти виновника?» — <code>PerformanceObserver</code> с типом <code>layout-shift</code> и полем <code>sources</code>, где перечислены сдвинувшиеся узлы; в DevTools — Experience в Performance. «Считается ли сдвиг по клику?» — нет, в течение 500 мс после ввода. «Почему считается худшее окно?» — чтобы длинная сессия не накапливала штраф бесконечно.</p>`,
        code: `<!-- размеры известны заранее — места зарезервировано ровно столько, сколько нужно -->
<img src="/photo.avif" width="800" height="600" alt="">

<style>
  /* адаптивная картинка без сдвига */
  .cover { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }

  /* место под рекламу зарезервировано, даже если блок не приедет */
  .ad-slot { min-height: 250px; }

  /* скроллбар не дёргает макет */

</style>

// поиск виновных узлов
new PerformanceObserver(list => {
