let editor = null;          // текущий экземпляр CodeMirror
let running = false;

/** Тема редактора живёт на CSS-переменных приложения, поэтому светлая и тёмная работают сами */
function editorTheme() {
  const { EditorView, HighlightStyle, syntaxHighlighting, tags } = CM;
  const theme = EditorView.theme({
    '&': { backgroundColor: 'var(--code-bg)', color: 'var(--code-ink)', fontSize: '13px' },
    '.cm-content': { fontFamily: 'var(--mono)', padding: '14px 0', caretColor: 'var(--accent)' },
    '.cm-gutters': {
      backgroundColor: 'var(--code-bg)', color: 'var(--muted)',
      border: 'none', borderRight: '1px solid var(--line)', fontFamily: 'var(--mono)',
    },
    '.cm-activeLine': { backgroundColor: 'var(--accent-soft)' },
    '.cm-activeLineGutter': { backgroundColor: 'transparent', color: 'var(--ink)' },
    '.cm-cursor': { borderLeftColor: 'var(--accent)' },
    '&.cm-focused': { outline: 'none' },
    '.cm-selectionBackground, ::selection': { backgroundColor: 'var(--accent-soft)' },
    '.cm-scroller': { lineHeight: '1.6' },
  });

  const highlight = HighlightStyle.define([
    { tag: tags.keyword, color: 'var(--syn-keyword)' },
    { tag: [tags.string, tags.special(tags.string)], color: 'var(--syn-string)' },
    { tag: [tags.number, tags.bool, tags.null], color: 'var(--syn-number)' },
    { tag: tags.comment, color: 'var(--syn-comment)', fontStyle: 'italic' },
    { tag: [tags.function(tags.variableName), tags.function(tags.propertyName)], color: 'var(--syn-func)' },
    { tag: [tags.propertyName, tags.attributeName], color: 'var(--syn-prop)' },
    { tag: [tags.typeName, tags.className, tags.tagName], color: 'var(--syn-type)' },
    { tag: tags.operator, color: 'var(--syn-op)' },
  ]);

  return [theme, syntaxHighlighting(highlight)];
}

function createEditor(parent, initial, onRun) {
  const {
    EditorView, EditorState, keymap, lineNumbers, highlightActiveLine,
    defaultKeymap, indentWithTab, history, historyKeymap, javascript,
    bracketMatching, indentUnit, closeBrackets, closeBracketsKeymap,
  } = CM;

  const runKeymap = keymap.of([{
    key: 'Mod-Enter',
    run: () => { onRun(); return true; },
  }]);

  return new EditorView({
    parent,
    state: EditorState.create({
      doc: initial,
      extensions: [
        lineNumbers(),
        highlightActiveLine(),
        history(),
        bracketMatching(),
        closeBrackets(),
        indentUnit.of('  '),
        javascript({ jsx: true }),
        runKeymap,
        keymap.of([...closeBracketsKeymap, ...defaultKeymap, ...historyKeymap, indentWithTab]),
        editorTheme(),
        EditorView.lineWrapping,
      ],
    }),
  });
}

function renderResults(container, payload) {
  container.textContent = '';

  if (!payload.ok) {
    const box = el('div', 'run-error');
    box.appendChild(el('div', 'run-error-title', 'Не удалось выполнить'));
    box.appendChild(el('p', null, payload.error));
    container.appendChild(box);
    return;
  }

  const results = payload.results;
  const passed = results.filter(r => r.passed).length;
  const allPassed = passed === results.length;

  const summary = el('div', 'run-summary' + (allPassed ? ' is-pass' : ''));
  summary.appendChild(el('span', 'run-count', passed + ' из ' + results.length));
  summary.appendChild(el('span', 'run-label',
    allPassed ? 'все проверки пройдены' : 'проверок пройдено'));
  container.appendChild(summary);

  for (const result of results) {
    const row = el('div', 'check' + (result.passed ? ' is-pass' : ' is-fail'));
    const head = el('div', 'check-head');
    head.appendChild(el('span', 'check-mark', result.passed ? '✓' : '✗'));
    head.appendChild(el('span', 'check-name', result.name));
    row.appendChild(head);

    if (!result.passed) {
      row.appendChild(el('p', 'check-error', result.error));
      if (result.hasDiff) {
        const diff = el('div', 'check-diff');
        const got = el('div');
        got.appendChild(el('span', 'diff-label', 'получено'));
        got.appendChild(el('code', null, result.actual));
        const want = el('div');
        want.appendChild(el('span', 'diff-label', 'ожидалось'));
        want.appendChild(el('code', null, result.expected));
        diff.appendChild(got);
        diff.appendChild(want);
        row.appendChild(diff);
      }
    }

    if (result.logs && result.logs.length) {
      const logs = el('pre', 'check-logs');
      logs.textContent = result.logs.join('\n');
      row.appendChild(logs);
    }
    container.appendChild(row);
  }
}

/** Рабочее место: редактор, кнопки запуска и панель результатов */
function buildWorkbench(task, suite) {
  const wrap = el('section', 'workbench');

  const head = el('div', 'workbench-head');
  head.appendChild(el('span', 'eyebrow-plain', 'Решение'));
  const envLabel = { worker: 'JavaScript', dom: 'DOM', react: 'React' }[suite.env] || suite.env;
  head.appendChild(el('span', 'env-tag', envLabel));
  if (taskSolved[task.id]) head.appendChild(el('span', 'tag tag-known', 'Решено'));
  wrap.appendChild(head);

  const host = el('div', 'editor-host');
  wrap.appendChild(host);

  const output = el('div', 'run-output');

  const actions = el('div', 'workbench-actions');
  const runBtn = el('button', 'pill pill-primary', 'Запустить');
  const resetBtn = el('button', 'ghost', 'Сбросить');
  actions.appendChild(runBtn);
  actions.appendChild(resetBtn);
  actions.appendChild(el('span', 'spacer'));
  actions.appendChild(el('span', 'kbd-hint', 'Ctrl/Cmd + Enter'));
  wrap.appendChild(actions);
  wrap.appendChild(output);

  async function run() {
    if (running || !editor) return;
    running = true;
    runBtn.textContent = 'Выполняется…';
    runBtn.disabled = true;
    output.textContent = '';

    const code = editor.state.doc.toString();
    taskCode[task.id] = code;
    progressUpdatedAt = Date.now();
    saveLocal();
    pushRemote();

    let payload;
    try {
      payload = await SANDBOX.run(code, suite);
    } catch (error) {
      payload = { ok: false, error: String((error && error.message) || error) };
    }

    renderResults(output, payload);

    const solved = payload.ok && payload.results.every(r => r.passed);
    if (solved && !taskSolved[task.id]) {
      taskSolved[task.id] = true;
      progressUpdatedAt = Date.now();
      saveLocal();
      pushRemote();
      renderHeaderProgress();
      head.appendChild(el('span', 'tag tag-known', 'Решено'));
    }

    running = false;
    runBtn.textContent = 'Запустить';
    runBtn.disabled = false;
  }

  runBtn.addEventListener('click', run);
  resetBtn.addEventListener('click', () => {
    if (!editor) return;
    editor.dispatch({
      changes: { from: 0, to: editor.state.doc.length, insert: suite.starter || '' },
    });
    output.textContent = '';
    editor.focus();
  });

  // CodeMirror монтируется после вставки в документ — иначе он не измерит себя
  queueMicrotask(() => {
    if (!host.isConnected) return;
    if (editor) { editor.destroy(); editor = null; }
    editor = createEditor(host, taskCode[task.id] || suite.starter || '', run);
  });

  return wrap;
}

function shuffle(items) {
  const copy = items.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function startMock() {
  let pool = ui.mockDeck === 'all'
    ? ALL_CARDS
    : ALL_CARDS.filter(c => c.deck === ui.mockDeck);

  // Сначала то, что ещё не закрыто: непройденное и отмеченное на повтор
  const weak = pool.filter(c => progress[c.id] !== 'known');
  if (weak.length >= ui.mockSize) pool = weak;

  ui.mock = {
    queue: shuffle(pool).slice(0, ui.mockSize),
    pos: 0,
    results: [],
    startedAt: Date.now(),
    questionAt: Date.now(),
    done: false,
  };
  ui.revealed = false;
}

function gradeMock(status) {
  const session = ui.mock;
  if (!session || session.done) return;
  const card = session.queue[session.pos];
  setStatus(card.id, status);
  session.results.push({ card, status, seconds: Math.round((Date.now() - session.questionAt) / 1000) });
  session.pos++;
  if (session.pos >= session.queue.length) {
    session.done = true;
  } else {
    session.questionAt = Date.now();
  }
  ui.revealed = false;
}

function viewMock() {
  const wrap = document.createDocumentFragment();
  wrap.appendChild(el('div', 'eyebrow', 'Мок-интервью'));

  /* ── Настройка сессии ── */
  if (!ui.mock) {
    wrap.appendChild(el('h2', null, 'Собери сессию'));
    wrap.appendChild(el('p', 'lede',
      'Вопросы идут подряд, как на реальной секции: сначала отвечаешь вслух, потом сверяешься. Приоритет отдаётся тому, что ещё не закрыто. В конце — разбор, что уходит на повтор.'));

    wrap.appendChild(el('div', 'field-label', 'Раздел'));
    const deckChips = el('div', 'chips');
    const deckOptions = [{ id: 'all', title: 'Все разделы' },
                         ...DECKS.map(d => ({ id: d.id, title: d.title }))];
    for (const option of deckOptions) {
      const chip = el('button', 'chip', option.title);
      chip.setAttribute('aria-pressed', String(option.id === ui.mockDeck));
      chip.addEventListener('click', () => { ui.mockDeck = option.id; render(); });
      deckChips.appendChild(chip);
    }
    wrap.appendChild(deckChips);

    wrap.appendChild(el('div', 'field-label', 'Сколько вопросов'));
    const sizeChips = el('div', 'chips');
    for (const size of [5, 10, 20, 30]) {
      const chip = el('button', 'chip', String(size));
      chip.setAttribute('aria-pressed', String(size === ui.mockSize));
      chip.addEventListener('click', () => { ui.mockSize = size; render(); });
      sizeChips.appendChild(chip);
    }
    wrap.appendChild(sizeChips);

    const available = ui.mockDeck === 'all'
      ? ALL_CARDS.length
      : ALL_CARDS.filter(c => c.deck === ui.mockDeck).length;

    const start = el('button', 'pill pill-primary', 'Начать секцию');
    start.style.marginTop = '32px';
    start.disabled = available === 0;
    start.addEventListener('click', () => { startMock(); render(); });
    wrap.appendChild(start);

    wrap.appendChild(el('p', 'mock-note',
      'Доступно вопросов в разделе: ' + available + '. Держи ответ в пределах полутора минут — на интервью длиннее не слушают.'));
    return wrap;
  }

  /* ── Итоги ── */
  if (ui.mock.done) {
    const known = ui.mock.results.filter(r => r.status === 'known').length;
    const review = ui.mock.results.filter(r => r.status === 'review');
    const totalSeconds = Math.round((Date.now() - ui.mock.startedAt) / 1000);

    wrap.appendChild(el('h2', null, 'Секция пройдена'));

    const stats = el('div', 'stat-row');
    const cells = [
      { n: known + ' / ' + ui.mock.results.length, l: 'Уверенных ответов', cls: 'is-known' },
      { n: String(review.length), l: 'Ушло на повтор', cls: 'is-review' },
      { n: Math.floor(totalSeconds / 60) + ' мин', l: 'Длительность', cls: '' },
    ];
    for (const c of cells) {
      const cell = el('div', 'stat' + (c.cls ? ' ' + c.cls : ''));
      cell.appendChild(el('div', 'n', c.n));
      cell.appendChild(el('div', 'l', c.l));
      stats.appendChild(cell);
    }
    wrap.appendChild(stats);

    if (review.length) {
      const head = el('div', 'eyebrow', 'Разобрать в первую очередь');
      head.style.marginTop = '48px';
      wrap.appendChild(head);
      const list = el('div', 'task-list');
      for (const result of review) {
        const row = el('button', 'task-row');
        row.appendChild(el('span', 'num', '·'));
        const mid = el('span');
        mid.appendChild(el('span', 'name', result.card.q));
        mid.appendChild(el('span', 'why', result.card.deckTitle + ' · ответ занял ' + result.seconds + ' с'));
        row.appendChild(mid);
        row.appendChild(el('span', 'lvl', 'Открыть'));
        row.addEventListener('click', () => {
          ui.view = 'cards';
          ui.deck = result.card.deck;
          ui.filter = 'all';
          ui.query = '';
          const deck = DECKS.find(d => d.id === result.card.deck);
          ui.index = Math.max(0, deck.cards.findIndex(c => c.id === result.card.id));
          ui.revealed = true;
          ui.mock = null;
          render();
        });
        list.appendChild(row);
      }
      wrap.appendChild(list);
    } else {
      const done = el('p', 'lede');
      done.textContent = 'Все вопросы секции закрыты уверенно. Возьми другой раздел или увеличь количество вопросов.';
      wrap.appendChild(done);
    }

    const again = el('button', 'pill pill-primary', 'Ещё секция');
    again.style.marginTop = '36px';
    again.addEventListener('click', () => { ui.mock = null; render(); });
    wrap.appendChild(again);
    return wrap;
  }

  /* ── Идёт сессия ── */
  const session = ui.mock;
  const card = session.queue[session.pos];

  const head = el('div', 'mock-head');
  const timer = el('div', 'timer', '0:00');
  timer.id = 'mockTimer';
  head.appendChild(timer);
  head.appendChild(el('div', 'mock-note',
    'Вопрос ' + (session.pos + 1) + ' из ' + session.queue.length + ' · ' + card.deckTitle));

  const stop = el('button', 'ghost', 'Завершить');
  stop.style.marginLeft = 'auto';
  stop.addEventListener('click', () => {
    if (session.results.length) session.done = true;
    else ui.mock = null;
    render();
  });
  head.appendChild(stop);
  wrap.appendChild(head);

  const bar = el('div', 'bar');
  const fill = el('i');
  fill.style.width = Math.round((session.pos / session.queue.length) * 100) + '%';
  bar.appendChild(fill);
  wrap.appendChild(bar);

  wrap.appendChild(renderCard(card, session.queue.length, session.pos, null, gradeMock));
  return wrap;
}

function tickTimer() {
  const node = document.getElementById('mockTimer');
  if (!node || !ui.mock || ui.mock.done) return;
  const seconds = Math.floor((Date.now() - ui.mock.questionAt) / 1000);
  const mm = Math.floor(seconds / 60);
  const ss = String(seconds % 60).padStart(2, '0');
  node.textContent = mm + ':' + ss;
  node.classList.toggle('over', seconds > 90);
}

/* ── Root render ── */

function render() {
  renderNav();
  renderHeaderProgress();
  const app = document.getElementById('app');
  app.textContent = '';
  if (ui.view === 'dash')  app.appendChild(viewDash());
  if (ui.view === 'cards') app.appendChild(viewCards());
  if (ui.view === 'code')  app.appendChild(viewCode());
  if (ui.view === 'mock')  app.appendChild(viewMock());

  if (ui.focusSearch) {
    ui.focusSearch = false;
    const input = document.getElementById('deckSearch');
    if (input) {
      input.focus();
      const end = input.value.length;
      try { input.setSelectionRange(end, end); } catch (e) { /* не все типы поддерживают каретку */ }
    }
    return;   // при вводе в поиск страницу не прокручиваем
  }
  window.scrollTo({ top: 0, behavior: 'instant' });
}

/* ══ INTERACTION ══════════════════════════════════════════════ */

document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (t && typeof t.matches === 'function' && t.matches('input, textarea')) return;
  const mockActive = ui.view === 'mock' && ui.mock && !ui.mock.done;
  if (ui.view !== 'cards' && !mockActive) return;

  let card, advance, cards = [];
  if (mockActive) {
    card = ui.mock.queue[ui.mock.pos];
    advance = null;
  } else {
    cards = visibleCards();
    if (!cards.length) return;
    card = cards[ui.index];
    advance = () => { ui.index = (ui.index + 1) % cards.length; ui.revealed = false; };
  }

  const applyGrade = (status) => {
    if (mockActive) gradeMock(status);
    else { setStatus(card.id, status); advance(); }
    render();
  };

  const isSpace = e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar';
  if (isSpace || e.key === 'Enter') {
    e.preventDefault();
    if (!ui.revealed) { ui.revealed = true; render(); }
    else if (advance) { advance(); render(); }
  } else if (e.key === '1' && ui.revealed) {
    applyGrade('review');
  } else if (e.key === '2' && ui.revealed) {
    applyGrade('known');
  } else if (e.key === 'ArrowRight' && advance) {
    advance(); render();
  } else if (e.key === 'ArrowLeft' && advance) {
    ui.index = (ui.index - 1 + cards.length) % cards.length;
    ui.revealed = false;
    render();
  }
});

document.getElementById('themeBtn').addEventListener('click', () => {
  const root = document.documentElement;
  const current = root.getAttribute('data-theme');
  const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const next = current ? (current === 'dark' ? 'light' : 'dark') : (systemDark ? 'light' : 'dark');
  root.setAttribute('data-theme', next);
});

/* ══ BOOT ═════════════════════════════════════════════════════ */

loadLocal();
render();
getSample();          // если возможность есть, блок свободного ответа появится сам
setSync('локально');
initRemote();
setInterval(tickTimer, 250);
</script>
